<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lakeshore MP4 Executive Plates V2 - Contact Sheet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: #0a0e16;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      margin: 0 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .tile {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      background: #111827;
    }
    .label {
      padding: 10px 14px;
      color: #bae6fd;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Lakeshore MP4 Executive Plates V2 - Contact Sheet</h1>
  <div class="grid">
    <div class="tile"><div class="label">01 - Opening</div><img src="../assets/01-opening.png" alt="Opening"></div>
    <div class="tile"><div class="label">02 - Profile</div><img src="../assets/02-profile.png" alt="Profile"></div>
    <div class="tile"><div class="label">03 - Operating Map</div><img src="../assets/03-operating-map.png" alt="Operating map"></div>
    <div class="tile"><div class="label">04 - Intelligence</div><img src="../assets/04-intelligence-layer.png" alt="Intelligence"></div>
    <div class="tile"><div class="label">05 - Corpus</div><img src="../assets/05-corpus.png" alt="Corpus"></div>
    <div class="tile"><div class="label">06 - Kyriba</div><img src="../assets/06-treasury-wedge.png" alt="Kyriba"></div>
    <div class="tile"><div class="label">07 - Beyond Kyriba</div><img src="../assets/07-ai-success-platform.png" alt="Beyond Kyriba"></div>
    <div class="tile"><div class="label">08 - Value Case</div><img src="../assets/08-value-case.png" alt="Value case"></div>
    <div class="tile"><div class="label">09 - Move Proof</div><img src="../assets/09-proof-move.png" alt="Move proof"></div>
    <div class="tile"><div class="label">10 - Source Decision</div><img src="../assets/10-proof-source-decision.png" alt="Source decision"></div>
    <div class="tile"><div class="label">11 - Value Pipeline</div><img src="../assets/11-proof-value-pipeline.png" alt="Value pipeline"></div>
    <div class="tile"><div class="label">12 - Trust Layer</div><img src="../assets/12-architecture.png" alt="Trust layer"></div>
    <div class="tile"><div class="label">13 - Roadmap</div><img src="../assets/13-six-month-roadmap.png" alt="Roadmap"></div>
    <div class="tile"><div class="label">14 - Renewal</div><img src="../assets/14-success-standard.png" alt="Renewal"></div>
  </div>
</body>
</html>

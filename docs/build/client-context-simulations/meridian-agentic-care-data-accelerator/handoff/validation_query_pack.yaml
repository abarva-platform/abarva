    - identify cross-program signal patterns and systemic risk concentration
    - compare this program against portfolio heuristics
    - highlight reusable playbooks and dependencies
  steward:
    - enforce governance and control checks
    - produce control-gap closure sequence with evidence checklist
    - escalate when regulatory or audit evidence is insufficient

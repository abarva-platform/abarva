data_model:

  - item_id: DM-PROGRAM-TABLE
    layer: data_model
    title: "Programs table with tenant_key + RLS"
    spec_reference:
      doc: PROGRAMS_MODULE_FAILURE_MODE_DRIVEN_DESIGN.md
      section: "A.3 Pilot-readiness baseline"
      quoted_requirement: "Every Programs-module table has a tenant_key column; Supabase RLS gates reads and writes by tenant"
    current_state: partial
    validation_note: "Programs use engagements table (not a separate programs table). engagements does NOT have tenant_key — tenant isolation is via client_id. RLS via client_id present. acceptance_criteria requires tenant_key NOT NULL + RLS by tenant_key which is a gap vs current implementation."
    code_check:
      expected_files:
        - supabase/migrations/*programs*
      validation_command: "find supabase/migrations -name '*program*' -type f"
    gap_description: |
      Programs table likely exists but tenant_key + RLS coverage requires
      validation. Design doc cites the apex-retail vs apexretail key drift
      as a documented past issue.
    dependencies:
      blocks: [RM-TENANT-ISOLATION-NEGATIVE-TESTS]
      blocked_by: []
    acceptance_criteria:
      - programs table has tenant_key column with NOT NULL constraint
      - RLS policy enforces tenant_key = auth.user_tenant_key()
      - Cross-tenant query attempts blocked + logged
    estimated_complexity: small
    failure_modes_blocked: []
    pilot_readiness_impact: foundational tenant isolation


# ════════════════════════════════════════════════════════════════════
#  COMPONENTS · shared design-system primitives
# ════════════════════════════════════════════════════════════════════

components:

  - id: CMP-APP-SHELL
    name: AppShell · the workspace template
    description: |
      The root layout. 76px left rail + main column (top bar + middle strip
      + 2-pane body). Renders identically across all surfaces.
    used_in: [SHL-NAV-DEFAULT, all PRG/SET/SRC/INT/TWR pages]
    mockup_status: in-shell
    build_priority: P0
    repo_slices: [SHELL1]

  - id: CMP-NAV-RAIL
    name: NavRail · 76px icon nav
    description: |
      Left icon rail. Brand mark top, 5 surface icons, user avatar bottom.
      Active item: filled navy with paper letter. Inactive: outlined.
    used_in: [CMP-APP-SHELL]
    mockup_status: in-shell
    build_priority: P0
    repo_slices: [SHELL1, NAV1]

  - id: CMP-TOP-BAR
    name: TopBar · 48px
    description: |
      Account pill (with amber dot + locked badge), surface context line,
      timestamp + user avatar. Slim, persistent.
    used_in: [CMP-APP-SHELL]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-MIDDLE-STRIP
    name: MiddleStrip · 44px slot-based
    description: |
      Slim horizontal strip. Surface owns the content. Slot props:
      `phaseJourney` (Programs) | `subnav` (Setup) | `filter` (Intel/Tower)
      | `stageTracker` (Source).
    variants:
      - phase_journey: PhaseDot row · used by Programs
      - subnav: tab row · used by Setup
      - filter: pill row · used by Intel and Tower
      - stage_tracker: 10-stage pips · used by Source
    used_in: [CMP-APP-SHELL]
    mockup_status: in-shell
    build_priority: P0
    repo_slices: [SHELL3]

  - id: CMP-AGENT-COLUMN
    name: AgentColumn · 480px conversation pane
    description: |
      Dark navy column. Agent identity + state pill (top), serif voice
      quote + context line, suggested actions A/B/C, anchored input box
      at bottom. Props: agent, voice, context, actions, onSubmit.
    props:
      - agent (agent token: nx | sn | at | st)
      - voice (string · italic serif quote)
      - context (string · sans subtitle)
      - actions (Array<{letter, text, detail}>)
      - onSubmit (function · custom prompt handler)
    used_in: [all surfaces]
    mockup_status: in-shell
    build_priority: P0
    repo_slices: [SHELL2]
    notes: |
      Render primitive only. Content is supplied by the surface from the
      agent runtime. Don't hardcode voice strings inside the component.

  - id: CMP-WORK-PANE
    name: WorkPane · right-side scrollable container
    description: Scrolls independently of agent column. Contains WorkSection components.
    used_in: [CMP-APP-SHELL]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-WORK-SECTION
    name: WorkSection · titled section within WorkPane
    description: |
      Reusable section block. Mono eyebrow + serif title (15-16px) + meta
      (right-aligned). Contains rows or cards. Used everywhere in working pane.
    props: [eyebrow, title, meta, children]
    used_in: [all working panes]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-EVIDENCE-ROW
    name: EvidenceRow · pattern for evidence/check items
    description: |
      Checkbox-style item: filled (done) | outlined (pending) | warm-tinted
      (conflict). Name + source + meta. Used for evidence stack and gate checks.
    used_in: [PRG-DTL-P*, SRC-STA-RISK]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-DELIVERABLE-CARD
    name: DeliverableCard · program deliverable summary
    description: |
      ID + name (serif bold) + meta + Rich/Outline/Stub tag. Action buttons
      on hover.
    used_in: [PRG-DTL-P*]
    mockup_status: in-shell
    build_priority: P0
    repo_slices: [PDEL5, PDEL9, PDEL10]

  - id: CMP-CONNECTOR-CARD
    name: ConnectorCard · connector health card
    description: |
      Connector logo + name + last-sync + status pill (Healthy/Degraded).
      Hover reveals action.
    used_in: [SET-IDX-CONN]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-PRESSURE-MINI
    name: PressureMini · compact pressure summary
    description: |
      Severity stripe + name + meta + hero number + delta + top driver bar.
      Used in Tower portfolio list and program-scope pressures section.
    used_in: [TWR-IDX-PORTFOLIO, TWR-IDX-PROG-SCOPE]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-PHASE-DOT
    name: PhaseDot · phase indicator
    description: |
      Small dot (7px) for done/pending/locked, larger (9px) with halo for current.
      Mint = done, navy = current, peach = pending, gray = locked.
    used_in: [CMP-MIDDLE-STRIP, PRG-IDX-DEFAULT (mini phase indicator)]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-STATUS-PILL
    name: StatusPill · semantic color pills
    description: |
      Mint (validated/done), blue (current/scoped), peach (pending/warning),
      rust (high severity), gray (idle/locked).
    used_in: [all surfaces]
    mockup_status: in-shell
    build_priority: P0

  - id: CMP-AGENT-GLYPH

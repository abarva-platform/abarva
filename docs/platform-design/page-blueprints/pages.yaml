# ════════════════════════════════════════════════════════════════════
#  AbarVa Page Catalog · v1.0 · April 27 2026
# ════════════════════════════════════════════════════════════════════
#
# Stable IDs for every page, state variant, modal, and shared component
# in the AbarVa workspace. Use these IDs as binding spec when briefing
# Code Desktop, writing tickets, or referencing surfaces in conversation.
#
# ID convention: <SURFACE>-<TYPE>-<VARIANT>
#   SURFACE: SHL (shell) | HOM (home) | SET (setup) | PRG (programs)
#            SRC (source) | INT (intelligence) | TWR (tower) | CMP (component)
#   TYPE:    IDX (index) | DTL (detail) | MOD (modal) | FLW (flow step)
#            STA (state variant) | LNS (lens/view) | EMP (empty) | ERR (error)
#   VARIANT: phase number (P0–P6), severity (HI/MD/LO), sub-section,
#            status, or descriptive token
#
# Demo tenant: Apex Retail Group · Locked
# Flagship program: APX-CDP-2026 · CDP Activation · currently P2 Synthesis
# Design gate (P2 → P3) pending · Steward owns · Workshop 5 incomplete
#
# Repo cross-reference: every entry's `repo_slices` field maps to the slice
# IDs in docs/backlog/backlog-registry.json. The catalog is the design layer;
# the registry is the build layer. Together they form the spec.
#
# ════════════════════════════════════════════════════════════════════

meta:
  version: "1.0"
  date: "2026-04-27"
  total_entries: 78
  surfaces:
    - SHL: Shell · cross-cutting chrome and entry pages
    - HOM: Home · executive landing
    - SET: Setup · Steward · governance, connectors, users, audit, policies, architecture
    - PRG: Programs · Nexus · phased program execution, gates, evidence
    - SRC: Source · Nexus + Steward · sourcing/outsourcing/commercial intelligence
    - INT: Intelligence · Sentinel · pattern library, solution archetypes
    - TWR: Tower · Atlas · cross-program pressure, lenses, outcome realization
    - CMP: Components · shared design-system primitives

  agents:
    nexus: { name: Nexus, role: Maestro, model: Opus, voice: orchestral, color_token: navy }
    sentinel: { name: Sentinel, role: Validator, model: Opus, voice: evidence, color_token: navy }
    atlas: { name: Atlas, role: Synthesizer, model: Sonnet, voice: 150-word-cap, color_token: navy }
    steward: { name: Steward, role: Governor, model: Sonnet, voice: governance, color_token: navy }

  status_legend:
    built: Mockup HTML exists in /mnt/user-data/outputs/abarva-mockups
    matched: Built and matches locked production aesthetic
    in-shell: Built within the new 3-zone shell template
    pending: Spec'd but not yet rendered
    placeholder: Acknowledged · awaiting detailed design
    in-repo: Production code exists · catalog references the as-built state

  build_priority:
    P0: Required for shell wave SHELL-1..6
    P1: Next wave · post-shell adapters
    P2: Later · awaiting input or lower-leverage


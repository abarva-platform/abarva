<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Roadmap — bad example (do not produce this)">
  <!-- BAD EXAMPLE — do not produce this. Deliberately violates every rule in
       rendering-rules.md: sprint numbers, day counters, no decision gates,
       8 workstreams (over the 6 max), Gantt-bar task-list language, no
       outcome/owner/dependency framing. Kept as a counter-example only. -->
  <rect x="0" y="0" width="1200" height="520" fill="#FFFFFF"/>
  <text x="16" y="24" font-family="sans-serif" font-size="14" font-weight="700">Roadmap</text>

  <!-- Gantt-style date axis — forbidden: explicit sprint/day counters -->
  <text x="200" y="50" font-family="sans-serif" font-size="9">Sprint 1</text>
  <text x="290" y="50" font-family="sans-serif" font-size="9">Sprint 2</text>
  <text x="380" y="50" font-family="sans-serif" font-size="9">Sprint 3</text>
  <text x="470" y="50" font-family="sans-serif" font-size="9">Sprint 4</text>
  <text x="560" y="50" font-family="sans-serif" font-size="9">Sprint 5</text>
  <text x="650" y="50" font-family="sans-serif" font-size="9">Sprint 6</text>
  <text x="740" y="50" font-family="sans-serif" font-size="9">Sprint 7</text>
  <text x="830" y="50" font-family="sans-serif" font-size="9">Sprint 8</text>
  <line x1="180" y1="58" x2="900" y2="58" stroke="#CCCCCC"/>

  <!-- 8 task rows (over the 6-workstream max), task-list language, no owner/decision/dependency -->
  <g font-family="sans-serif" font-size="9">
    <text x="16" y="80">Task 1.1: kickoff meeting</text>
    <rect x="180" y="70" width="80" height="14" fill="#4472C4"/>
    <text x="16" y="104">Task 1.2: requirements gathering</text>
    <rect x="200" y="94" width="120" height="14" fill="#4472C4"/>
    <text x="16" y="128">Task 2.1: configure dev environment</text>
    <rect x="260" y="118" width="90" height="14" fill="#4472C4"/>
    <text x="16" y="152">Task 2.2: build data pipeline (Day 12 start)</text>
    <rect x="300" y="142" width="150" height="14" fill="#4472C4"/>
    <text x="16" y="176">Task 3.1: integration testing (Day 45)</text>
    <rect x="400" y="166" width="100" height="14" fill="#4472C4"/>
    <text x="16" y="200">Task 3.2: UAT sign-off Week 9</text>
    <rect x="480" y="190" width="80" height="14" fill="#4472C4"/>
    <text x="16" y="224">Task 4.1: deploy to production March 15, 2027</text>
    <rect x="560" y="214" width="90" height="14" fill="#4472C4"/>
    <text x="16" y="248">Task 4.2: hypercare Sprint 9</text>
    <rect x="650" y="238" width="70" height="14" fill="#4472C4"/>
  </g>

  <!-- No decision gates, no dependency legend, no outcome/success-measure framing -->
  <text x="16" y="290" font-family="sans-serif" font-size="9" fill="#999999">(no decision gates shown; no dependencies shown; no owners named)</text>
</svg>

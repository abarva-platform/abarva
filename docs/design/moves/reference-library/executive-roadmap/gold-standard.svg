  <text x="12" y="408" font-family="sans-serif" font-size="11" font-weight="700">Change &amp; Adoption</text>
  <rect x="190" y="376" width="314" height="56" rx="6" fill="#fff" stroke="#E6E2DA"/>
  <text x="200" y="408" font-family="sans-serif" font-size="9.5" fill="#6F6A61">(use judgment — no clause matched)</text>

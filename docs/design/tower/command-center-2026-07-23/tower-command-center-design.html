<title>Tower Command Center — approved design source (2026-07-23)</title>
<!--
  AUTHORITATIVE DESIGN SOURCE for the new Tower Command Center page.

  Unpacked verbatim from the approved artifact bundle. Only three mechanical
  changes were made so the file opens and runs standalone in any browser:
    1. inlined @font-face woff2 blocks removed; the same three families now
       load from Google Fonts (Fraunces / Inter / JetBrains Mono);
    2. the AbarVa wordmark inlined as a data: URI instead of a bundle uuid;
    3. the artifact runtime class renamed and self-bootstrapped on DOMContentLoaded.

  CSS, markup, mock data, view logic, drawers and charts are unmodified.
  This file is the pixel contract. Where this file and any written spec
  disagree, THIS FILE WINS.

  NOTE on the token block below: it is the palette the design was authored
  against. It is NOT identical to docs/design/strategic-moves/tokens.css.
  See the handoff prompt for the six deltas and how to scope the override.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* ─────────────────────────────────────────────────────────────────────
   1 · BRAND TOKENS (locked Apr 28, 2026)
   These are the canonical brand colors and fonts. Marketing site, investor
   deck, contracts, and any external surface MUST use these.
   ───────────────────────────────────────────────────────────────────── */
:root {
  /* Primary brand */
  --abarva-ink-black:    #000000;       /* Headlines, body, brand wordmark "Abar" */
  --abarva-signal-blue:  #0066CC;       /* The "Va". CTAs, links, brand accent */
  --abarva-paper:        #faf7f1;       /* Page background. Warm, off-white. */

  /* Supporting palette */
  --abarva-navy-ink:     #0c1a3a;       /* Dark sections, patterns library, depth */
  --abarva-stone:        #888780;       /* Tertiary text, eyebrows on paper */
  --abarva-slate:        #5F5E5A;       /* Body de-emphasis, captions */

  /* Derived (production) */
  --abarva-signal-blue-dark: #0052a3;   /* CTA hover */
  --abarva-rule:         rgba(136, 135, 128, 0.25); /* Hairline rules on paper */
  --abarva-rule-strong:  rgba(136, 135, 128, 0.5);
  --abarva-rule-onnavy:  rgba(255, 255, 255, 0.08);

  /* Typography (locked) */
  --abarva-serif: Fraunces, Georgia, "Times New Roman", serif;   /* @kind font */
  --abarva-sans:  Inter, -apple-system, system-ui, sans-serif;   /* @kind font */
  --abarva-mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;   /* @kind font */
}

/* ─────────────────────────────────────────────────────────────────────
   2 · CANON TOKENS (internal app surfaces)
   The "design canon" — used inside the authenticated app for Programs,
   Control Tower, Deliverables, Pattern detail, and /preview routes. These
   are the colors of the *work product*, not the brand. Teal/amber/red are
   semantic (gate status, pressure, severity), not decorative.
   ───────────────────────────────────────────────────────────────────── */
:root {
  /* Surfaces */
  --canon-bg-dark:    #0a0a0b;          /* Authenticated navbar, decision-grade contrast */
  --canon-bg-cream:   #f5f1eb;          /* App page background (a touch warmer than paper) */
  --canon-bg-surface: #ffffff;          /* Cards, sections, deliverable content */

  /* Semantic accent — gate / status / severity */
  --canon-teal:       #1d9e75;          /* Pass · Active · Done · Validated */
  --canon-teal-dark:  #0f6e56;
  --canon-teal-light: #e1f5ee;
  --canon-amber:      #ba7517;          /* Warn · Pressure · Watch */
  --canon-amber-light:#faeeda;
  --canon-red:        #a32d2d;          /* Fail · Critical · Contradiction */
  --canon-red-light:  #fceded;

  /* Neutral scale */
  --canon-gray-900:   #2c2c2a;
  --canon-gray-700:   #444441;
  --canon-gray-500:   #5f5e5a;
  --canon-gray-300:   #b4b2a9;
  --canon-gray-200:   #d3d1c7;
  --canon-gray-100:   #f1efe8;

  --canon-border:        rgba(10, 10, 11, 0.12);
  --canon-border-strong: rgba(10, 10, 11, 0.24);
}

/* ─────────────────────────────────────────────────────────────────────
   3 · TYPE SCALE
   Both surfaces use Fraunces (display) / Inter (UI text) / JetBrains Mono
   (eyebrow + label + code). Sizes below apply to both.
   ───────────────────────────────────────────────────────────────────── */
:root {
  /* Display — Fraunces, optical-size aware. Set with clamp() at use site. */
  --type-display-1:  clamp(48px, 6vw, 88px);   /* Hero — 1 per page */
  --type-display-2:  clamp(36px, 4vw, 58px);   /* Section opener */
  --type-display-3:  clamp(28px, 3vw, 40px);   /* Subhead */

  /* Body — Inter */
  --type-lead:    19px;   /* Lead paragraph after a heading */
  --type-body:    16px;   /* Default reading size */
  --type-small:   14px;   /* Dense UI, table cells */
  --type-caption: 13px;   /* Captions, footnotes */

  /* Mono eyebrow — JetBrains Mono, uppercase, 0.12em tracking */
  --type-eyebrow:    11px;
  --type-eyebrow-sm: 10px;

  /* Line heights */
  --lh-display: 1.05;       /* @kind other */
  --lh-heading: 1.2;        /* @kind other */
  --lh-prose:   1.6;        /* @kind other */
  --lh-ui:      1.5;        /* @kind other */
  --lh-tight:   1.3;        /* @kind other */

  /* Letter spacing */
  --ls-display: -0.025em;   /* @kind other */
  --ls-heading: -0.02em;    /* @kind other */
  --ls-body:    0;          /* @kind other */
  --ls-eyebrow: 0.12em;     /* @kind other */
}

/* ─────────────────────────────────────────────────────────────────────
   4 · SPACING & RADIUS
   ───────────────────────────────────────────────────────────────────── */
:root {
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-7:  32px;
  --space-8:  40px;
  --space-9:  56px;
  --space-10: 80px;
  --space-11: 112px;

  --radius-sm: 4px;
  --radius-md: 6px;        /* Buttons, chips, pressure cards */
  --radius-lg: 8px;        /* Section cards, KPI cards */
  --radius-xl: 12px;

  --shadow-card: 0 1px 2px rgba(10, 10, 11, 0.04);
  --shadow-pop:  0 8px 24px rgba(10, 10, 11, 0.08);
}

/* ─────────────────────────────────────────────────────────────────────
   5 · MOTION
   ───────────────────────────────────────────────────────────────────── */
:root {
  --ease-out:  cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */
  --ease-in:   cubic-bezier(0.55, 0, 0.68, 0);  /* @kind other */
  --dur-fast:  120ms;       /* @kind other */
  --dur-base:  200ms;       /* @kind other */
  --dur-slow:  320ms;       /* @kind other */
}

/* ─────────────────────────────────────────────────────────────────────
   6 · BASE PRIMITIVES (opt-in via class — never in :where)
   Apply .av-root to a section to inherit AbarVa typography defaults.
   ───────────────────────────────────────────────────────────────────── */
.av-root {
  font-family: var(--abarva-sans);
  font-size: var(--type-body);
  line-height: var(--lh-prose);
  color: var(--abarva-ink-black);
  background: var(--abarva-paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.av-root.dark {
  background: var(--abarva-navy-ink);
  color: var(--abarva-paper);
}
.av-root.canon {
  background: var(--canon-bg-cream);
  color: var(--canon-gray-900);
}

/* Wordmark — type-set, NOT an SVG. Use this ONLY in app chrome where the
   SVG isn't available. For all marketing/external surfaces, use the SVG. */
.av-wordmark {
  font-family: var(--abarva-serif);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  display: inline-flex;
  align-items: baseline;
}
.av-wordmark .abar { color: var(--abarva-ink-black); }
.av-wordmark .va   { color: var(--abarva-signal-blue); }
.av-root.dark .av-wordmark .abar,
.dark .av-wordmark .abar { color: var(--abarva-paper); }

/* Mono eyebrow — the most distinctive AbarVa typographic gesture.
   Never replace with sans-serif uppercase; the mono is the signature. */
.av-eyebrow {
  font-family: var(--abarva-mono);
  font-size: var(--type-eyebrow);
  font-weight: 600;
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--abarva-signal-blue);
}
.av-eyebrow.stone { color: var(--abarva-stone); }
.av-eyebrow.teal  { color: var(--canon-teal); }
.av-eyebrow.amber { color: var(--canon-amber); }
.av-eyebrow.red   { color: var(--canon-red); }
.av-eyebrow.paper { color: var(--abarva-paper); opacity: 0.7; }

/* Display — large editorial headings, Fraunces */
.av-display-1 { font-family: var(--abarva-serif); font-weight: 500; font-size: var(--type-display-1); line-height: var(--lh-display); letter-spacing: var(--ls-display); }
.av-display-2 { font-family: var(--abarva-serif); font-weight: 500; font-size: var(--type-display-2); line-height: var(--lh-heading); letter-spacing: var(--ls-heading); }
.av-display-3 { font-family: var(--abarva-serif); font-weight: 500; font-size: var(--type-display-3); line-height: var(--lh-heading); letter-spacing: var(--ls-heading); }

/* Lede — the first paragraph after a display heading */
.av-lede {
  font-size: var(--type-lead);
  line-height: var(--lh-prose);
  color: var(--abarva-slate);
  max-width: 60ch;
  text-wrap: pretty;
}
.av-root.dark .av-lede { color: rgba(250, 247, 241, 0.7); }
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--canon-bg-cream); font-family: var(--abarva-sans); color: var(--canon-gray-900); -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; overflow: hidden; }
  ::selection { background: rgba(0,102,204,0.16); }
  a { color: var(--canon-teal-dark); text-decoration: none; } a:hover { color: var(--canon-teal); }
  .serif { font-family: var(--abarva-serif); font-weight: 500; letter-spacing: -0.02em; }
  .mono { font-family: var(--abarva-mono); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.teal{background:var(--canon-teal);} .dot.amber{background:var(--canon-amber);} .dot.red{background:var(--canon-red);} .dot.gray{background:var(--canon-gray-300);} .dot.blue{background:var(--abarva-signal-blue);}
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--canon-gray-300) transparent; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; } .scroll::-webkit-scrollbar-thumb { background: var(--canon-gray-300); border-radius: 8px; }

  /* App shell — fixed height, no page scroll */
  .app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background:#08080b; display:flex; align-items:center; padding:0 28px; height:52px; flex:none; }
  .tb-logo { height:18px; } .tb-div { width:1px; height:19px; background:rgba(255,255,255,0.18); margin:0 15px; }
  .tb-tenant { font-family:var(--abarva-serif); font-style:italic; font-weight:500; font-size:15px; color:rgba(255,255,255,0.82); letter-spacing:-0.01em; }
  .tb-nav { margin-left:auto; display:flex; gap:2px; }
  .tb-item { font-size:13.5px; font-weight:500; color:rgba(255,255,255,0.7); padding:6px 13px; border-radius:8px; cursor:pointer; }
  .tb-item:hover { color:#fff; } .tb-item.active { background:#fff; color:#0a0a0b; font-weight:700; }

  .stage { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wrap { width:100%; max-width:1560px; margin:0 auto; padding:0 34px; }

  /* Standing header — compact */
  .dash { flex:none; padding:16px 0 0; }
  .dash-top { display:flex; align-items:center; justify-content:space-between; gap:28px; }
  .dash-id .eyebrow { font-family:var(--abarva-mono); font-size:10.5px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--canon-teal-dark); margin-bottom:5px; }
  .dash-id h1 { font-family:var(--abarva-serif); font-weight:500; font-size:26px; line-height:1; letter-spacing:-0.028em; }
  .dash-id h1 .thin { color:var(--canon-gray-500); }
  .dash-right { flex:none; text-align:right; display:flex; align-items:center; gap:16px; }
  .dash-right .when { font-family:var(--abarva-mono); font-size:10.5px; color:var(--canon-gray-500); line-height:1.6; letter-spacing:0.02em; }
  .flag { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--canon-red); background:var(--canon-red-light); padding:6px 12px; border-radius:999px; }

  /* Tabs */
  .tabs { flex:none; display:flex; gap:2px; border-bottom:1px solid var(--canon-border-strong); margin-top:14px; }
  .tab { font-family:var(--abarva-sans); font-size:14px; font-weight:600; color:var(--canon-gray-500); background:none; border:0; padding:12px 16px; cursor:pointer; position:relative; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; }
  .tab:hover { color:var(--canon-gray-900); } .tab.on { color:var(--canon-gray-900); }
  .tab.on::after { content:''; position:absolute; left:11px; right:11px; bottom:-1px; height:2.5px; background:var(--canon-teal); border-radius:2px; }
  .tab .tnum { font-family:var(--abarva-mono); font-size:10.5px; color:var(--canon-gray-300); }
  .tab .adot { width:6px; height:6px; border-radius:50%; background:var(--canon-red); }

  /* Body region — fills remaining height */
  .bodyregion { flex:1; min-height:0; }
  .bodyregion .wrap { height:100%; padding-top:18px; padding-bottom:16px; }
  .view { height:100%; display:flex; flex-direction:column; gap:14px; min-height:0; }
  .view-scroll { height:100%; overflow-y:auto; padding-right:6px; }

  .vhead { flex:none; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .vhead .vh { font-family:var(--abarva-serif); font-size:19px; font-weight:500; letter-spacing:-0.02em; }
  .vhead .vsub { font-size:12.5px; color:var(--canon-gray-500); }
  .vhead .vspace { flex:1; }
  .vhint { font-size:11.5px; color:var(--canon-gray-500); display:inline-flex; align-items:center; gap:6px; }

  .card { background:var(--canon-bg-surface); border:1px solid var(--canon-border); border-radius:13px; box-shadow:var(--shadow-card); display:flex; flex-direction:column; min-height:0; }
  .card-h { flex:none; padding:14px 18px 12px; border-bottom:1px solid var(--canon-border); display:flex; align-items:center; gap:10px; }
  .card-h .ch-k { font-family:var(--abarva-mono); font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--canon-gray-500); }
  .card-h .ch-t { font-family:var(--abarva-serif); font-size:16px; font-weight:500; letter-spacing:-0.015em; }
  .card-h .ch-r { margin-left:auto; font-size:11.5px; color:var(--canon-gray-500); }
  .card-b { flex:1; min-height:0; padding:16px 18px; }

  .eyebrow2 { font-family:var(--abarva-mono); font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--canon-gray-500); }

  /* Posture tiles */
  .ptiles { flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .ptile { background:var(--canon-bg-surface); border:1px solid var(--canon-border); border-radius:13px; padding:13px 15px; box-shadow:var(--shadow-card); position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .ptile::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--canon-gray-200); }
  .ptile.teal::before{background:var(--canon-teal);} .ptile.amber::before{background:var(--canon-amber);} .ptile.red::before{background:var(--canon-red);} .ptile.blue::before{background:var(--abarva-signal-blue);}
  .pt-k { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .pt-k .lab { font-family:var(--abarva-mono); font-size:10px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:var(--canon-gray-500); }
  .pt-k .st { margin-left:auto; font-family:var(--abarva-mono); font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px; }
  .st.steal{color:var(--canon-teal-dark);background:var(--canon-teal-light);} .st.samber{color:var(--canon-amber);background:var(--canon-amber-light);} .st.sred{color:var(--canon-red);background:var(--canon-red-light);}
  .pt-hero { font-family:var(--abarva-serif); font-weight:500; font-size:27px; line-height:0.95; letter-spacing:-0.035em; }
  .pt-hero small { font-size:0.4em; letter-spacing:0; color:var(--canon-gray-300); }
  .ptile.teal .pt-hero{color:var(--canon-teal-dark);} .ptile.red .pt-hero{color:var(--canon-red);}
  .pt-heron { font-size:11px; color:var(--canon-gray-500); margin-top:5px; }
  .pt-rows { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .pt-row { display:flex; align-items:center; gap:10px; font-size:11.5px; }
  .pt-row .rl { color:var(--canon-gray-500); flex:1; display:flex; align-items:center; gap:6px; }
  .pt-row .rv { font-family:var(--abarva-mono); font-weight:600; font-variant-numeric:tabular-nums; }
  .pt-row .rv.red{color:var(--canon-red);} .pt-row .rv.teal{color:var(--canon-teal-dark);} .pt-row .rv.amber{color:var(--canon-amber);}

  /* Command lower split */
  .cc-lower { flex:1; min-height:0; display:grid; grid-template-columns:0.92fr 1.08fr; gap:14px; }
  @media (max-width:820px){ .cc-lower{grid-template-columns:1fr;} .ptiles{grid-template-columns:repeat(2,1fr);} }

  .weekread { background:var(--canon-bg-surface); color:var(--canon-gray-900); border:1px solid var(--canon-border); border-radius:14px; padding:20px 24px; display:flex; flex-direction:column; min-height:0; overflow:hidden; box-shadow:var(--shadow-card); }
  .weekread .wk-k { font-family:var(--abarva-mono); font-size:10.5px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--canon-teal-dark); margin-bottom:12px; }
  .weekread .wk-line { font-family:var(--abarva-serif); font-weight:500; font-size:clamp(18px,1.7vw,24px); line-height:1.36; letter-spacing:-0.02em; text-wrap:pretty; color:var(--canon-gray-900); }
  .weekread .wk-line .n { color:var(--canon-teal-dark); font-family:var(--abarva-mono); font-weight:600; font-size:0.84em; }
  .weekread .wk-line .z { color:var(--canon-red); font-family:var(--abarva-mono); font-weight:600; font-size:0.84em; }
  .weekread .wk-line .turn { color:var(--canon-gray-500); }
  .wk-viz { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:11px; margin:16px 0 6px; }
  .wk-bar .wb-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; }

  .dq { display:flex; flex-direction:column; gap:9px; }

  .dq-meta { font-size:11.5px; color:var(--canon-gray-500); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .dq-meta b { color:var(--canon-gray-900); font-weight:600; }

  // ════════════════ TABS ════════════════
  renderTabs() {
    const tabs = [
      { id:'command', label:'Command Center' },
      { id:'funnel', label:'Value Proof', attn:true },
      { id:'lanes', label:'Decision Lanes' },
      { id:'ai', label:'AI Portfolio' },
      { id:'evidence', label:'Evidence', attn:true },
      { id:'actions', label:'Recommended Actions', n:this.D.ACT.length },
    ];
    const el = document.getElementById('tw-tabs');
    el.innerHTML = tabs.map(t => `<button class="tab ${this.state2.tab===t.id?'on':''}" data-tab="${t.id}">${t.label}${t.n!=null?`<span class="tnum">${t.n}</span>`:''}${t.attn?'<span class="adot"></span>':''}</button>`).join('');
    el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { this.state2.tab = b.dataset.tab; this.renderTabs(); this.renderBody(); });
  }

  renderBody() {
    const b = document.getElementById('tw-body');
    const v = { command:'viewCommand', funnel:'viewFunnel', lanes:'viewLanes', ai:'viewAI', evidence:'viewEvidence', actions:'viewActions' }[this.state2.tab];
    this._charts = [];
    b.innerHTML = this[v]();
    this.bindBody();
    this.mountCharts();
  }
  bindBody() {
    const b = document.getElementById('tw-body');
    b.querySelectorAll('[data-prog]').forEach(el => { el.onclick = () => this.progDrawer(el.dataset.prog); el.ondblclick = () => this.progDrawer(el.dataset.prog); });
    b.querySelectorAll('[data-ai]').forEach(el => { el.onclick = () => this.aiDrawer(el.dataset.ai); el.ondblclick = () => this.aiDrawer(el.dataset.ai); });
    b.querySelectorAll('[data-action]').forEach(el => el.onclick = () => this.actionDrawer(el.dataset.action));
    b.querySelectorAll('[data-gap]').forEach(el => el.onclick = () => this.gapDrawer(+el.dataset.gap));
    b.querySelectorAll('[data-aifilter]').forEach(el => el.onclick = () => { this.state2.aiFilter = el.dataset.aifilter; this.renderBody(); });
    b.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => { this.state2.tab = el.dataset.goto; this.renderTabs(); this.renderBody(); });
    b.querySelectorAll('[data-evq]').forEach(el => el.onclick = () => { this.state2.evQ = el.dataset.evq; this.renderBody(); });
    b.querySelectorAll('[data-aiview]').forEach(el => el.onclick = () => { this.state2.aiView = el.dataset.aiview; this.renderBody(); });
    b.querySelectorAll('[data-lanesview]').forEach(el => el.onclick = () => { this.state2.lanesView = el.dataset.lanesview; this.renderBody(); });
  }

  // ════════════════ DECISION LANES ════════════════
  viewLanes() {

      { id:'freeze', name:'Freeze', sub:'Funding ahead of proof — hold' },
      { id:'stop', name:'Stop', sub:'No verified value — terminate' },
    ];
    const lanesHtml = lanesDef.map(l => {
      const items = this.D.PROG.filter(p => p.lane === l.id);
      const total = items.reduce((a,p)=>a+p.promised,0);
      const cards = items.map(p => `<div class="pcard" data-prog="${p.id}">
        <div class="pc-name">${this.esc(p.name)}</div><div class="pc-owner">${this.esc(p.owner)}</div>
        <div class="pc-nums"><span class="f">${this.fmt(p.funded)}</span><span class="p">funded · ${this.fmt(p.promised)} promised</span></div>
        <div class="pc-proof"><div class="pc-p"><span class="pk">Proof</span>${this.pips(p.proof)}</div><div class="pc-p"><span class="pk">Usage</span><span class="chip ${p.usageStatus==='strong'?'teal':p.usageStatus==='weak'?'amber':'red'} mono">${p.usageStatus}</span></div></div>
        <div class="pc-gate"><span class="gk">Next gate</span><span><b>${this.esc(p.gate)}</b></span></div>
      </div>`).join('') || `<div style="font-size:12px;color:var(--canon-gray-500);padding:8px 4px">No programs in this lane.</div>`;

      <span class="chip mono" style="color:${col[p.lane]};background:transparent;border:1px solid var(--canon-border)">${laneWord[p.lane]}</span>
    </div>`).join('');
  }

      <td style="font-size:12px;color:var(--canon-gray-700);max-width:22ch">${this.esc(p.gate)}</td>
    </tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Program</th><th>Lane</th><th class="num">Funded</th><th class="num">Promised</th><th class="num">Proof</th><th class="num">Usage</th><th class="num">Blocked</th><th>Next gate</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  quadrant() {
    return `<div class="chartwrap">${this.rc('rc-quad','quad')}</div>
      <div class="legend"><span><i class="rd" style="background:var(--canon-teal)"></i>Fund</span><span><i class="rd" style="background:var(--canon-amber)"></i>Fix</span><span><i class="rd" style="background:var(--canon-red)"></i>Freeze / Stop</span></div>`;
  }

  // ════════════════ AI PORTFOLIO ════════════════
  viewAI() {
    const filters = [['all','All'],['funded','Funded'],['embedded','Embedded'],['candidate','Candidate'],['governance','Governance'],['platform','Platform']];
    const chips = filters.map(f => `<button class="chip ${this.state2.aiFilter===f[0]?'blue':'gray'}" data-aifilter="${f[0]}" style="cursor:pointer;border:1px solid ${this.state2.aiFilter===f[0]?'rgba(0,102,204,0.3)':'var(--canon-border)'}">${f[1]}</button>`).join('');
    const pool = this.D.CAND.map(c => `<div class="poolrow" data-goto="ai" title="Not funded — candidate idea"><span class="pr-n">${c.n}</span><div class="pr-nm">${this.esc(c.name)}<small>${this.esc(c.reason)}</small></div><span class="chip gray mono">candidate</span></div>`).join('');

    const sub = [['overview','Integrated'],['bubble','Bubble matrix'],['lens','Spend lens'],['table','Initiative table']];
    const av = this.state2.aiView || 'overview';
    const subnav = `<div class="subnav">${sub.map(s => `<button class="subbtn ${av===s[0]?'on':''}" data-aiview="${s[0]}">${s[1]}</button>`).join('')}</div>`;
    const showChips = av !== 'lens';
    const head = `<div class="vhead"><div class="vh">Which AI is real, embedded, or just an idea</div>${subnav}<span class="vspace"></span>${showChips?`<div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div>`:'<span class="vhint"><span class="dot gray"></span> Click a bar for its category detail</span>'}</div>`;

    let body;
    if (av === 'overview') {
      body = `<div class="cc-lower" style="grid-template-columns:1.22fr 1fr;flex:1">
        <div class="card">
          <div class="card-h"><span class="ch-k">Bubble matrix</span><span class="ch-r">value × readiness · size = spend</span></div>
          <div class="card-b" style="display:flex;flex-direction:column">${this.bubbleMatrix()}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
          <div class="card" style="flex:1.1">
            <div class="card-h"><span class="ch-t">AI spend lens</span><span class="ch-r">$53.7M AI-tagged</span></div>
            <div class="card-b" style="padding:12px 14px 8px">${this.rc('rc-lens','lens')}</div>
          </div>
          <div class="card" style="flex:1">
            <div class="card-h"><span class="ch-k">Not funded · candidate pool</span><span class="ch-r">kept separate from approved spend</span></div>
            <div class="card-b scroll" style="padding-top:12px"><div class="pool">${pool}</div></div>
          </div>
        </div>
      </div>`;
    } else if (av === 'bubble') {
      body = `<div class="cc-lower" style="grid-template-columns:1fr 320px;flex:1">
        <div class="card">
          <div class="card-h"><span class="ch-k">Bubble matrix</span><span class="ch-r">value potential × readiness · bubble size = AI spend</span></div>
          <div class="card-b" style="display:flex;flex-direction:column">${this.bubbleMatrix()}</div>
        </div>
        <div class="card">
          <div class="card-h"><span class="ch-t">Initiatives</span><span class="ch-r">numbered on the matrix</span></div>
          <div class="card-b scroll" style="padding:10px 12px">${this.aiLegendList()}</div>
        </div>
      </div>`;
    } else if (av === 'lens') {
      body = `<div class="card" style="flex:1">
        <div class="card-h"><span class="ch-t">AI spend lens by category</span><span class="ch-r">$53.7M AI-tagged · Copilot · ServiceNow · Workday/SAP · data/AI platform · cloud · governance · training</span></div>
        <div class="card-b" style="display:flex;flex-direction:column;padding:18px 22px">
          <div class="chartwrap">${this.rc('rc-lens','lens')}</div>
          <div class="legend" style="margin-top:12px"><span><i style="background:var(--canon-teal-dark)"></i>Funded</span><span><i style="background:var(--abarva-signal-blue)"></i>Embedded</span><span><i style="background:var(--canon-amber)"></i>Governance</span><span><i style="background:var(--canon-gray-700)"></i>Platform</span></div>
        </div>
      </div>`;
    } else {
      body = `<div class="card" style="flex:1">
        <div class="card-h"><span class="ch-t">All AI initiatives</span><span class="ch-r">funded · embedded · candidate — click a row for usage evidence</span></div>
        <div class="card-b scroll" style="padding-top:8px">${this.aiTable()}</div>
      </div>`;
    }
    return `<div class="view">${head}${body}</div>`;
  }

  aiLegendList() {
    const items = this.state2.aiFilter==='all' ? this.D.AI : this.D.AI.filter(a=>a.type===this.state2.aiFilter);
    const col = { funded:'var(--canon-teal-dark)', embedded:'var(--abarva-signal-blue)', candidate:'var(--canon-gray-300)', governance:'var(--canon-amber)', platform:'var(--canon-gray-700)' };
    return items.sort((a,b)=>a.n-b.n).map(a => `<div class="poolrow" data-ai="${a.n}" style="border-style:solid;border-color:var(--canon-border)">
      <span class="pr-n" style="color:#fff;background:${col[a.type]};border-radius:6px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center">${a.n}</span>
      <div class="pr-nm">${this.esc(a.name)}<small>${this.esc(a.vendor)} · $${a.spend.toFixed(1)}M · ${this.esc(a.posture)}</small></div>
    </div>`).join('');
  }

  aiTable() {
    const typeWord = { funded:'Funded', embedded:'Embedded', candidate:'Candidate', governance:'Governance', platform:'Platform' };
    const typeChip = { funded:'teal', embedded:'blue', candidate:'gray', governance:'amber', platform:'gray' };
    const items = this.state2.aiFilter==='all' ? this.D.AI : this.D.AI.filter(a=>a.type===this.state2.aiFilter);
    const rows = items.sort((a,b)=>b.spend-a.spend).map(a => `<tr class="click" data-ai="${a.n}">
      <td><div class="pname" style="font-size:14px">${a.n}. ${this.esc(a.name)}</div><div class="psub">${this.esc(a.system)}</div></td>
      <td><span class="chip ${typeChip[a.type]} mono">${typeWord[a.type]}</span></td>
      <td>${this.esc(a.vendor)}</td>
      <td class="num"><span class="bignum" style="font-size:15px">$${a.spend.toFixed(1)}M</span></td>
      <td class="num">${this.miniMeter(a.value)}</td>
      <td class="num">${this.miniMeter(a.readiness)}</td>
      <td style="text-align:right;font-weight:600;font-size:12.5px;color:var(--canon-gray-700)">${this.esc(a.posture)}</td>
    </tr>`).join('');
    const cand = this.D.CAND.map(c => `<tr class="click" data-goto="ai"><td><div class="pname" style="font-size:14px;color:var(--canon-gray-500)">${c.n}. ${this.esc(c.name)}</div></td><td><span class="chip gray mono">Candidate</span></td><td colspan="4" style="font-size:12.5px;color:var(--canon-gray-500)">${this.esc(c.reason)}</td><td style="text-align:right;font-size:12.5px;color:var(--canon-gray-500)">Not funded</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Initiative</th><th>Spend type</th><th>Vendor</th><th class="num">AI spend</th><th class="num">Value</th><th class="num">Readiness</th><th style="text-align:right">Posture</th></tr></thead><tbody>${rows}${this.state2.aiFilter==='all'||this.state2.aiFilter==='candidate'?cand:''}</tbody></table>`;
  }

  miniMeter(v) {
    const col = v>=66?'var(--canon-teal)':v>=40?'var(--canon-amber)':'var(--canon-red)';
    return `<span style="display:inline-flex;align-items:center;gap:7px;justify-content:flex-end"><span style="width:52px;height:5px;border-radius:3px;background:var(--canon-gray-100);overflow:hidden;display:inline-block"><i style="display:block;height:100%;width:${v}%;background:${col};border-radius:3px"></i></span><span style="font-family:var(--abarva-mono);font-size:11.5px;color:var(--canon-gray-700)">${v}</span></span>`;
  }

  bubbleMatrix() {
    return `<div class="chartwrap">${this.rc('rc-bubble','bubble')}</div>
      <div class="legend"><span><i style="background:var(--canon-teal-dark)"></i>Funded</span><span><i style="background:var(--abarva-signal-blue)"></i>Embedded</span><span><i style="background:var(--canon-amber)"></i>Governance</span><span><i style="background:var(--canon-gray-700)"></i>Platform</span></div>`;
  }

  // ════════════════ EVIDENCE ════════════════
  viewEvidence() {
    const exists = [
      { nm:'Fraud model — performance & usage', detail:'AUC 0.94 · 1.2M alerts scored/mo · 96% analyst adoption. Both performance and usage are proven — only Finance attestation is missing.', metric:'0.94', unit:'model AUC', tone:'teal', tag:'Strong proof' },
      { nm:'GitHub Copilot — developer productivity', detail:'590 of 640 engineers active · DORA lead time down 22%. A clear, measured time saving.', metric:'18h', unit:'saved / eng·mo', tone:'teal', tag:'Strong proof' },
      { nm:'ServiceNow AI — ticket deflection', detail:'Agent-assist live on 48% of queues · CSAT up 4 points. Usage evidence is solid.', metric:'31%', unit:'tickets deflected', tone:'teal', tag:'Strong proof' },
      { nm:'Workday / SAP — HR deflection', detail:'Measured inside the vendor tool, but never credited to the value line — so today it counts as $0 of realized value.', metric:'34%', unit:'HR queries deflected', tone:'amber', tag:'Measured · unattributed' },
    ];
    const missing = [
      { nm:'Finance sign-off on the fraud-avoidance method', detail:'Model team measures the $26M avoidance; Finance has not validated the counterfactual, so none of it can be booked.', metric:'$26M', unit:'unclaimed', tone:'red', tag:'High · owner CFO', idx:0 },
      { nm:'Seat-level Copilot usage tied to a benefit', detail:'324 paid seats show no measured outcome, and Finance & Ops are frozen on a DLP review.', metric:'324', unit:'idle seats', tone:'red', tag:'High · owner CIO', idx:1 },
      { nm:'Attribution of embedded AI into the value model', detail:'Workday/SAP/ServiceNow deflection is real but unattributed — invisible to the value line.', metric:'34%', unit:'unattributed', tone:'amber', tag:'Medium · owner CDAO', idx:2 },
      { nm:'Data-lineage control remediation (OCC)', detail:'A deficient lineage control blocks scaling any customer-facing AI across the platform.', metric:'OCC', unit:'open finding', tone:'red', tag:'High · owner CDAO', idx:3 },
    ];
    const owners = [
      { nm:'CFO', detail:'Attest the fraud-avoidance method, then define how embedded-AI benefit is credited to the value line.', metric:'$26M', unit:'value unclaimed', tone:'red', tag:'2 gaps · both high' },
      { nm:'CDAO', detail:'Close the OCC lineage finding and bring embedded vendor AI (Workday/SAP/ServiceNow) into portfolio scope.', metric:'$5.5M', unit:'value gated', tone:'amber', tag:'2 gaps' },
      { nm:'CIO', detail:'Produce seat-level Copilot usage tied to a benefit metric and clear the DLP freeze.', metric:'324', unit:'idle seats', tone:'red', tag:'1 gap · high' },
      { nm:'Model Risk / Wealth', detail:'Run the SR 11-7 sprint for 12 Tier-1 models and close the FINRA supervision gap.', metric:'12+1', unit:'items to clear', tone:'amber', tag:'2 gaps' },
    ];
    const blocked = [
      { nm:'Book the $26M Risk & Compliance AI value', detail:'Held until Finance attests the fraud-avoidance counterfactual.', metric:'$26M', unit:'at stake', tone:'red', tag:'Blocked · CFO' },
      { nm:'Freeze or expand M365 Copilot', detail:'Held until seat-level usage evidence exists for the 324 idle seats.', metric:'$6.8M', unit:'promised', tone:'red', tag:'Blocked · CIO' },
      { nm:'Approve customer-facing AI scale', detail:'Held until the OCC data-lineage finding is closed.', metric:'OCC', unit:'finding', tone:'amber', tag:'Blocked · CDAO' },
      { nm:'Scale or hold AML case triage', detail:'Held until 12 overdue Tier-1 model validations clear.', metric:'12', unit:'models', tone:'amber', tag:'Blocked · Model Risk' },
    ];
    const QS = [
      { id:'exists', label:'What evidence exists?', meta:'<b>4 areas</b> carry real usage or performance proof today', items:exists },
      { id:'missing', label:'What is missing?', meta:'<b>6 gaps</b> stand between promised value and a claim', items:missing },
      { id:'owner', label:'Who owns the missing proof?', meta:'Every gap resolves to one named executive', items:owners },
      { id:'blocked', label:'What decision is blocked until it arrives?', meta:'Each missing proof holds one decision', items:blocked },
    ];
    const active = QS.find(q => q.id === this.state2.evQ) || QS[0];
    const headTone = { exists:'var(--canon-teal-dark)', missing:'var(--canon-red)', owner:'var(--canon-amber)', blocked:'var(--canon-red)' };
    const seg = QS.map((q,i) => `<button class="evbtn ${q.id===active.id?'on':''}" data-evq="${q.id}"><span class="evn">${i+1}</span>${q.label}</button>`).join('');
    const toneCol = { teal:'var(--canon-teal-dark)', amber:'var(--canon-amber)', red:'var(--canon-red)' };
    const items = active.items.map(it => `<div class="ebig" ${it.idx!=null?`data-gap="${it.idx}" style="cursor:pointer"`:''}>
      <span class="dot ${it.tone==='teal'?'teal':it.tone==='amber'?'amber':'red'}" style="margin-top:6px"></span>
      <div class="ebig-main"><div class="ebig-nm">${this.esc(it.nm)}</div><div class="ebig-sub">${this.esc(it.detail)}</div>${it.idx!=null?'<div class="ebig-link">View audit trace →</div>':''}</div>
      <div class="ebig-right"><div class="ebig-metric" style="color:${toneCol[it.tone]}">${this.esc(it.metric)}</div><div class="ebig-unit">${this.esc(it.unit)}</div><div class="ebig-tag">${this.esc(it.tag)}</div></div>
    </div>`).join('');
    return `<div class="view">
      <div class="vhead"><div class="vh">Evidence, as a business posture</div><span class="vspace"></span><span class="vhint"><span class="dot gray"></span> Answers, not a trace log — click a gap for its audit trail</span></div>
      <div class="evseg">${seg}</div>
      <div class="card evpanel">
        <div class="card-h"><span class="ch-k" style="color:${headTone[active.id]}">Question ${QS.indexOf(active)+1} of 4</span><span class="ch-t">${active.label}</span><span class="ch-r">${active.meta}</span></div>
        <div class="card-b scroll"><div class="ebig-grid">${items}</div></div>
      </div>
    </div>`;
  }

  // ════════════════ RECOMMENDED ACTIONS ════════════════
  viewActions() {
    const roles = ['CFO','CIO','CDAO','Model Risk','Procurement'];
    const roleOther = this.D.ACT.filter(a => !roles.includes(a.role));
    const cols = roles.map(role => {
      const items = this.D.ACT.filter(a => a.role === role).concat(role==='Procurement'?roleOther:[]);
      const label = role==='Procurement' ? 'Procurement & business owners' : role==='Model Risk' ? 'Model Risk Office' : role;
      return `<div class="owncol">
        <div class="oc-head"><div class="oc-role">${label}</div><div class="oc-cnt">${items.length} action${items.length>1?'s':''}</div></div>
        <div class="oc-body">${items.map(a => `<div class="acard ${a.lane}" data-action="${a.id}">
          <div class="ak">${a.lane}</div>
          <div class="at">${this.esc(a.title)}</div>
          <div class="adue"><span class="dot ${a.lane==='fund'?'teal':a.lane==='stop'||a.lane==='freeze'?'red':'amber'}"></span>${this.esc(a.due)}</div>
          <div class="alink">Linked · <b>${this.esc(a.link)}</b></div>
        </div>`).join('')}</div>
      </div>`;
    }).join('');
    return `<div class="view">
      <div class="vhead"><div class="vh">The executive action memo</div><div class="vsub">Organized by who owns the next move — the bridge from Tower into Moves</div><span class="vspace"></span><span class="vhint"><span class="dot gray"></span> Click any action to review &amp; route</span></div>
      <div class="owncols">${cols}</div>
    </div>`;
  }

  // ════════════════ DRAWERS ════════════════
  openDrawer(html) {
    const d = document.getElementById('tw-drawer');
    d.innerHTML = html; d.classList.add('open'); d.setAttribute('aria-hidden','false');
    document.getElementById('tw-backdrop').classList.add('open');
    d.querySelectorAll('[data-close]').forEach(el => el.onclick = () => this.closeDrawer());
    const act = d.querySelector('[data-action]'); if (act) act.onclick = () => this.actionDrawer(act.dataset.action);
    const gt = d.querySelector('[data-goto]'); if (gt) gt.onclick = () => { this.closeDrawer(); this.state2.tab = gt.dataset.goto; this.renderTabs(); this.renderBody(); };
  }
  closeDrawer() {
    const d = document.getElementById('tw-drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true');
    document.getElementById('tw-backdrop').classList.remove('open');
  }

  plainProgram(p) {
    const laneWord = { fund:'Fund', fix:'Fix', freeze:'Freeze', stop:'Stop', watch:'Watch' }[p.lane];
    if (p.promised <= 0) return `No AI value is promised here — this is a run-and-sustain line. It matters for vendor renewal leverage, not the value story.`;
    const claimTxt = p.claim > 0 ? `${this.fmt(p.claim)} of it is claimable today` : `none of it is claimable yet`;
    const blk = p.blocker.charAt(0).toLowerCase() + p.blocker.slice(1).replace(/\.$/, '');
    return `Of <b>${this.fmt(p.promised)}</b> in promised value, <b>${claimTxt}</b> — because ${blk}. It sits in the <b>${laneWord}</b> lane, and the next unlock is <b>${p.gate}</b>.`;
  }
  plainAI(a) {
    const def = { funded:'a real, funded program with its own budget and approvals', embedded:'value delivered inside a platform you already pay for — not new AI spend', candidate:'a candidate idea, not approved spend', governance:'a control that unblocks other AI, not a value generator on its own', platform:'shared platform consumption spread across many teams' }[a.type];
    return `This is <b>${def}</b>. Recommended move: <b>${a.posture}</b>.`;
  }

  progDrawer(id) {
    const p = this.D.PROG.find(x => x.id === id); if (!p) return;
    const laneWord = { fund:'Fund', fix:'Fix', freeze:'Freeze', stop:'Stop', watch:'Watch' };
    const laneTone = { fund:'teal', fix:'amber', freeze:'red', stop:'red', watch:'gray' };
    // find related AI usage
    const relAI = this.D.AI.filter(a => (id==='P3'&&(a.n===1||a.n===6)) || (id==='P9'&&a.n===2) || (id==='P8'&&(a.n===7||a.n===3)) || (id==='P6'&&a.n===5) || (id==='P4'&&false));
    const usageHtml = relAI.length ? relAI.map(a => this.usageBlock(a)).join('') :
      `<div class="urow"><div class="ut"><span class="un">Usage evidence</span><span class="uv" style="color:var(--canon-gray-500)">Thin</span></div><div class="us">No usage-linked measurement is in place for this program yet. That absence is the reason value is not claimable.</div></div>`;
    const chain = [
      ['Promised', p.promised, '', 'what the business case claimed'],
      ['Usage-supported', p.usage, p.usage>0?'teal':'red', 'backed by real adoption / usage evidence'],
      ['Finance-validated', p.finval, p.finval>0?'teal':'red', 'Finance has signed the measurement method'],
      ['Claimable', p.claim, 'red', 'can be booked as realized value today'],
      ['Blocked', p.blocked, 'red', 'promised value that cannot be claimed yet'],
    ];
    this.openDrawer(`<div class="dr-head"><div class="dr-eyebrow" style="color:var(--${laneTone[p.lane]==='teal'?'canon-teal-dark':laneTone[p.lane]==='amber'?'canon-amber':laneTone[p.lane]==='red'?'canon-red':'canon-gray-500'})"><span>Program · ${this.esc(p.id)} · ${laneWord[p.lane]}</span><button class="dr-close" data-close>✕</button></div><h3>${this.esc(p.name)}</h3></div>
      <div class="dr-body">
        <div class="dr-plain ${laneTone[p.lane]}"><div class="pk">In plain terms</div><div class="pt">${this.plainProgram(p)}</div></div>
        <div class="dr-grid">
          <div><div class="k">Funded</div><div class="v">${this.fmt(p.funded)}</div></div>
          <div><div class="k">Promised value</div><div class="v">${this.fmt(p.promised)}</div></div>
          <div><div class="k">Finance-validated</div><div class="v sm ${p.finval>0?'teal':''}">${this.fmt(p.finval)}</div></div>
          <div><div class="k">Claimable</div><div class="v sm red">${this.fmt(p.claim)}</div></div>
        </div>
        <div class="dr-sec">Value proof chain <span style="text-transform:none;letter-spacing:0;color:var(--canon-gray-500);font-family:var(--abarva-sans)">— where promised value leaks on the way to claimable</span></div>
        ${chain.map(c => `<div class="drow stacked"><span class="dk">${c[0]}<span class="dsub">${c[3]}</span></span><span class="dv" style="color:${c[2]==='teal'?'var(--canon-teal-dark)':c[2]==='red'?'var(--canon-red)':'var(--canon-gray-900)'}">${this.fmt(c[1])}</span></div>`).join('')}
        <div class="dr-sec">Usage &amp; adoption evidence</div>
        ${usageHtml}
        <div class="dr-sec">Owner &amp; next gate</div>
        <div class="drow"><span class="dk">Owner</span><span class="dv">${this.esc(p.owner)}</span></div>
        <div class="drow"><span class="dk">Function</span><span class="dv">${this.esc(p.fn)}</span></div>
        <div class="drow"><span class="dk">Next gate</span><span class="dv" style="max-width:60%">${this.esc(p.gate)}</span></div>
        <div class="dr-sec">The read</div>
        <div class="efact"><div class="es">${this.esc(p.note)}</div><div class="eloc"><span class="file">SA08_ai-benefits-realization-usage</span> · ${this.esc(p.id)}</div></div>
      </div>
      <div class="dr-foot"><span class="dr-trust"><span class="dot ${laneTone[p.lane]}"></span>${laneWord[p.lane]} · ${this.esc(p.blocker)}</span><button class="btn" data-close>Close</button><button class="btn primary" data-goto="actions">See the action</button></div>`);
  }

  usageBlock(a) {
    return `<div style="margin-bottom:14px"><div style="font-family:var(--abarva-serif);font-size:15px;font-weight:500;margin-bottom:2px">${this.esc(a.name)}</div><div style="font-size:11.5px;color:var(--canon-gray-500);margin-bottom:6px">${this.esc(a.usageHead)} · ${this.esc(a.vendor)}</div>
      ${a.usage.map(u => `<div class="urow"><div class="ut"><span class="un">${this.esc(u[0])}</span><span class="uv">${this.esc(u[1])}</span></div><div class="ubar"><i style="width:${u[2]}%;background:${u[3]==='tl'?'var(--canon-teal)':u[3]==='am'?'var(--canon-amber)':'var(--canon-red)'}"></i></div></div>`).join('')}</div>`;
  }

  aiDrawer(n) {
    const a = this.D.AI.find(x => x.n === +n); if (!a) return;
    const typeWord = { funded:'Funded program', embedded:'Embedded platform spend', candidate:'Candidate idea', governance:'Governance', platform:'Platform' };
    this.openDrawer(`<div class="dr-head"><div class="dr-eyebrow"><span>AI initiative ${a.n} · ${typeWord[a.type]}</span><button class="dr-close" data-close>✕</button></div><h3>${this.esc(a.name)}</h3></div>
      <div class="dr-body">
        <div class="dr-grid">
          <div><div class="k">AI spend</div><div class="v">$${a.spend.toFixed(1)}M</div></div>
          <div><div class="k">Recommended posture</div><div class="v sm">${this.esc(a.posture)}</div></div>
          <div><div class="k">Value potential</div><div class="v sm teal">${a.value}/100</div></div>
          <div><div class="k">Readiness</div><div class="v sm ${a.readiness>=60?'teal':'amber'}">${a.readiness}/100</div></div>
        </div>
        <div class="dr-plain ${a.type==='funded'?'teal':a.type==='governance'?'amber':'gray'}"><div class="pk">In plain terms</div><div class="pt">${this.plainAI(a)}</div></div>
        <div class="dr-sec">Vendor &amp; system</div>
        <div class="drow"><span class="dk">Vendor</span><span class="dv">${this.esc(a.vendor)}</span></div>
        <div class="drow"><span class="dk">System</span><span class="dv">${this.esc(a.system)}</span></div>
        <div class="drow"><span class="dk">Spend type</span><span class="dv">${typeWord[a.type]}</span></div>
        <div class="dr-sec">Usage &amp; adoption evidence</div>
        ${this.usageBlock(a)}
        <div class="dr-sec">The read</div>
        <div class="efact"><div class="es">${this.esc(a.note)}</div><div class="eloc"><span class="file">10_ai-automation-use-cases</span> · usage feed</div></div>
      </div>
      <div class="dr-foot"><span class="dr-trust"><span class="dot ${a.readiness>=60?'teal':'amber'}"></span>${this.esc(a.posture)}</span><button class="btn" data-close>Close</button></div>`);
  }

  gapDrawer(idx) {
    const g = this.D.GAPS[idx]; if (!g) return;
    this.openDrawer(`<div class="dr-head"><div class="dr-eyebrow" style="color:${g.pri==='high'?'var(--canon-red)':'var(--canon-amber)'}"><span>Evidence gap · ${this.esc(g.area)}</span><button class="dr-close" data-close>✕</button></div><h3>${this.esc(g.missing)}</h3></div>
      <div class="dr-body">
        <div class="dr-grid">
          <div><div class="k">Owner</div><div class="v sm">${this.esc(g.owner)}</div></div>
          <div><div class="k">Due window</div><div class="v sm ${g.pri==='high'?'red':'amber'}">${this.esc(g.due)}</div></div>
          <div><div class="k">Linked program</div><div class="v sm">${this.esc(g.prog)}</div></div>
          <div><div class="k">Priority</div><div class="v sm ${g.pri==='high'?'red':'amber'}">${g.pri[0].toUpperCase()+g.pri.slice(1)}</div></div>
        </div>
        <div class="dr-sec">Why it matters</div><p class="rec-box">${this.esc(g.why)}</p>
        <div class="dr-sec">Decision blocked until it arrives</div><p class="rec-box"><b>${this.esc(g.decision)}</b></p>
        <div class="dr-sec">Audit trace</div>
        <div class="efact"><div class="es">Source templates: SA08_ai-benefits-realization-usage, 14_metrics-outcomes, SA02_it-finance-budget-spend.</div><div class="eloc"><span class="file">evidence_registry</span> · owner ${this.esc(g.owner)} · confidence medium · attestation pending</div></div>
      </div>
      <div class="dr-foot"><span class="dr-trust"><span class="dot ${g.pri==='high'?'red':'amber'}"></span>Blocks: ${this.esc(g.decision)}</span><button class="btn" data-close>Close</button><button class="btn primary" data-goto="actions">Route to action</button></div>`);
  }

  actionDrawer(id) {
    const a = this.D.ACT.find(x => x.id === id); if (!a) return;
    const toneMap = { fund:'teal', fix:'amber', freeze:'red', stop:'red' };
    this.openDrawer(`<div class="dr-head"><div class="dr-eyebrow" style="color:var(--${toneMap[a.lane]==='teal'?'canon-teal-dark':toneMap[a.lane]==='amber'?'canon-amber':'canon-red'})"><span>Action · ${this.esc(a.role)} · ${a.lane}</span><button class="dr-close" data-close>✕</button></div><h3>${this.esc(a.title)}</h3></div>
      <div class="dr-body" id="tw-dr-body">
        <div class="dr-grid">
          <div><div class="k">Decision required</div><div class="v sm">${this.esc(a.decision)}</div></div>
          <div><div class="k">Due window</div><div class="v sm ${toneMap[a.lane]==='red'?'red':toneMap[a.lane]==='amber'?'amber':'teal'}">${this.esc(a.due)}</div></div>
          <div><div class="k">Linked program</div><div class="v sm">${this.esc(a.link)}</div></div>
          <div><div class="k">Owner</div><div class="v sm">${this.esc(a.role)}</div></div>
        </div>
        <div class="dr-sec">Why now</div><p class="rec-box" style="color:var(--canon-gray-700)">${this.esc(a.why)}</p>
        <div class="dr-sec">Evidence needed</div><p class="rec-box">${this.esc(a.evidence)}</p>
        <div class="approve-note"><span class="dot amber"></span><span><b>Human approval required.</b> Approving routes this to <b>${this.esc(a.role)}</b> as a Move — “${this.esc(a.move)}” — with its evidence chain attached. Nothing acts automatically.</span></div>
      </div>
      <div class="dr-foot"><span class="dr-trust"><span class="dot ${toneMap[a.lane]}"></span>Owner · ${this.esc(a.role)}</span><button class="btn" data-close>Defer</button><button class="btn primary" id="tw-approve">Approve &amp; route</button></div>`);
    const ap = document.getElementById('tw-approve');
    if (ap) ap.onclick = () => {
      document.getElementById('tw-dr-body').innerHTML = `<div class="move-done"><div class="md">●</div><h4>Routed to ${this.esc(a.role)}</h4><p>Created as a Move — “${this.esc(a.move)}” — with its evidence chain attached. The owner approves activation in Strategic Moves.</p></div>`;
      document.getElementById('tw-drawer').querySelector('.dr-foot').innerHTML = `<span class="dr-trust"><span class="dot teal"></span>Move created · awaiting owner</span><button class="btn" data-close>Close</button><button class="btn primary" data-close>View in Moves</button>`;
      document.getElementById('tw-drawer').querySelectorAll('[data-close]').forEach(el => el.onclick = () => this.closeDrawer());
    };
  }

  // ════════════════ RECHARTS ════════════════
  rc(id, kind) { this._charts.push({ id, kind }); return `<div class="rc" id="${id}" style="width:100%;height:100%"></div>`; }

  mountCharts() {
    if (!this._RC || !this._createRoot || !this._RCReact) return;
    const live = new Set(this._charts.map(c => c.id));
    Object.keys(this.roots).forEach(id => { if (!live.has(id)) { try { this.roots[id].unmount(); } catch(e){} delete this.roots[id]; } });
    this._charts.forEach(c => {
      const el = document.getElementById(c.id); if (!el) return;
      if (this.roots[c.id]) { try { this.roots[c.id].unmount(); } catch(e){} }
      const root = this._createRoot(el); this.roots[c.id] = root;
      root.render(this['chart_'+c.kind]());
    });
  }

  _twoLine(props) {
    const h = this._RCReact.createElement; const { x, y, payload } = props;
    const parts = String(payload.value).split('|');
    return h('text', { x, y: y+11, textAnchor:'middle', fontFamily:'var(--abarva-mono)', fontSize:9.5, fill:'#5f5e5a' },
      parts.map((p,i) => h('tspan', { key:i, x, dy: i===0?0:11 }, p)));
  }
  _tip() {
    const h = this._RCReact.createElement, R = this._RC;
    return h(R.Tooltip, { cursor:{ fill:'rgba(0,0,0,0.03)' }, contentStyle:{ fontFamily:'var(--abarva-sans)', fontSize:12, border:'1px solid var(--canon-border-strong)', borderRadius:8, boxShadow:'var(--shadow-pop)', padding:'8px 11px' }, labelStyle:{ fontFamily:'var(--abarva-mono)', fontSize:10, textTransform:'uppercase', letterSpacing:'0.05em', color:'#5f5e5a', marginBottom:4 } });
  }
  get RC() { return this._RC; }
  get h() { return this._RCReact.createElement; }

  chart_week() {
    const h = this.h, R = this.RC;
    const data = [
      { name:'Promised', v:35.5, fill:'#b4b2a9', lab:'$35.5M' },
      { name:'Usage-supported', v:14.2, fill:'#1d9e75', lab:'$14.2M' },
      { name:'Finance-validated', v:3.8, fill:'#0f6e56', lab:'$3.8M' },
      { name:'Claimable', v:0.06, fill:'#a32d2d', lab:'$0' },
    ];
    return h(R.ResponsiveContainer, { width:'100%', height:'100%' },
      h(R.BarChart, { data, layout:'vertical', margin:{ top:2, right:56, left:0, bottom:2 }, barCategoryGap:'26%' },
        h(R.XAxis, { type:'number', hide:true, domain:[0,35.5] }),
        h(R.YAxis, { type:'category', dataKey:'name', width:118, axisLine:false, tickLine:false, tick:{ fontSize:11, fill:'#444441', fontFamily:'var(--abarva-sans)' } }),
        h(R.Bar, { dataKey:'v', radius:[0,4,4,0], isAnimationActive:false },
          data.map((d,i) => h(R.Cell, { key:i, fill:d.fill })),
          h(R.LabelList, { dataKey:'lab', position:'right', style:{ fontFamily:'var(--abarva-mono)', fontSize:11.5, fontWeight:600, fill:'#2c2c2a' } })
        )
      )
    );
  }

  chart_waterfall() {
    const h = this.h, R = this.RC;
    const data = [
      { name:'Promised', base:0, v:35.5, fill:'#444441', lab:'$35.5M' },
      { name:'No|usage', base:14.2, v:21.3, fill:'#a32d2d', lab:'−$21.3M' },
      { name:'Usage|supported', base:0, v:14.2, fill:'#1d9e75', lab:'$14.2M' },
      { name:'No finance|sign-off', base:3.8, v:10.4, fill:'#a32d2d', lab:'−$10.4M' },
      { name:'Finance|validated', base:0, v:3.8, fill:'#0f6e56', lab:'$3.8M' },
      { name:'Not|attested', base:0, v:3.8, fill:'#a32d2d', lab:'−$3.8M' },
      { name:'Claimable', base:0, v:0.12, fill:'#b4b2a9', lab:'$0' },
    ];
    return h(R.ResponsiveContainer, { width:'100%', height:'100%' },
      h(R.BarChart, { data, margin:{ top:26, right:6, left:4, bottom:6 }, barCategoryGap:'18%' },
        h(R.CartesianGrid, { vertical:false, stroke:'var(--canon-border)' }),
        h(R.XAxis, { dataKey:'name', interval:0, tickLine:false, axisLine:{ stroke:'var(--canon-border-strong)' }, height:40, tick:this._twoLine.bind(this) }),
        h(R.YAxis, { tickFormatter:(v)=>'$'+v, tick:{ fontSize:10, fill:'#b4b2a9', fontFamily:'var(--abarva-mono)' }, axisLine:false, tickLine:false, width:34 }),
        h(R.Bar, { dataKey:'base', stackId:'a', fill:'transparent', isAnimationActive:false }),
        h(R.Bar, { dataKey:'v', stackId:'a', radius:[3,3,0,0], isAnimationActive:false },
          data.map((d,i) => h(R.Cell, { key:i, fill:d.fill })),
          h(R.LabelList, { dataKey:'lab', position:'top', style:{ fontFamily:'var(--abarva-serif)', fontSize:12.5, fontWeight:500, fill:'#2c2c2a' } })
        )
      )
    );
  }

  chart_quad() {
    const h = this.h, R = this.RC;
    const col = { fund:'#1d9e75', fix:'#ba7517', freeze:'#a32d2d', stop:'#a32d2d', watch:'#b4b2a9' };
    const laneName = { fund:'Fund', fix:'Fix', freeze:'Freeze', stop:'Stop', watch:'Watch' };
    const maxStake = Math.max(...this.D.PROG.map(p=>p.stake));
    const byLane = {};
    this.D.PROG.forEach(p => { (byLane[p.lane] = byLane[p.lane] || []).push({ x:p.evid, y:p.stake, z:p.stake, id:p.id, name:p.name }); });
    const series = Object.keys(byLane).map(l => h(R.Scatter, { key:l, name:laneName[l], data:byLane[l], fill:col[l], fillOpacity:0.85, stroke:'#fff', strokeWidth:1.5, isAnimationActive:false, onClick:(pt)=>this.progDrawer(pt.id) }));
    return h(R.ResponsiveContainer, { width:'100%', height:'100%' },
      h(R.ScatterChart, { margin:{ top:12, right:14, left:2, bottom:20 } },
        h(R.CartesianGrid, { stroke:'var(--canon-border)' }),
        h(R.XAxis, { type:'number', dataKey:'x', domain:[0,100], name:'Evidence maturity', tickCount:6, tick:{ fontSize:9.5, fill:'#b4b2a9', fontFamily:'var(--abarva-mono)' }, axisLine:{ stroke:'var(--canon-border-strong)' }, tickLine:false, label:{ value:'Evidence maturity →', position:'bottom', offset:6, style:{ fontFamily:'var(--abarva-mono)', fontSize:9.5, fill:'#5f5e5a', letterSpacing:'0.04em' } } }),
        h(R.YAxis, { type:'number', dataKey:'y', domain:[0, Math.ceil(maxStake)], name:'Value at stake', tick:{ fontSize:9.5, fill:'#b4b2a9', fontFamily:'var(--abarva-mono)' }, axisLine:false, tickLine:false, width:26, tickFormatter:(v)=>'$'+v }),
        h(R.ZAxis, { type:'number', dataKey:'z', range:[60,620] }),
        h(R.ReferenceLine, { x:50, stroke:'var(--canon-border-strong)', strokeDasharray:'3 3' }),
        h(R.ReferenceLine, { y:maxStake/2, stroke:'var(--canon-border-strong)', strokeDasharray:'3 3' }),
        this._tip(),
        ...series
      )
    );
  }

  chart_bubble() {
    const h = this.h, R = this.RC;
    const items = this.state2.aiFilter==='all' ? this.D.AI : this.D.AI.filter(a=>a.type===this.state2.aiFilter);
    const col = { funded:'#0f6e56', embedded:'#0066CC', candidate:'#b4b2a9', governance:'#ba7517', platform:'#444441' };
    const byType = {};
    items.forEach(a => { (byType[a.type] = byType[a.type] || []).push({ x:a.readiness, y:a.value, z:a.spend, n:a.n, name:a.name }); });
    const series = Object.keys(byType).map(t => h(R.Scatter, { key:t, name:t, data:byType[t], fill:col[t], fillOpacity:0.82, stroke:'#fff', strokeWidth:1.5, isAnimationActive:false, onClick:(pt)=>this.aiDrawer(pt.n) },
      h(R.LabelList, { dataKey:'n', position:'center', style:{ fontFamily:'var(--abarva-mono)', fontSize:10.5, fontWeight:700, fill:'#fff', pointerEvents:'none' } })));
    return h(R.ResponsiveContainer, { width:'100%', height:'100%' },
      h(R.ScatterChart, { margin:{ top:12, right:16, left:2, bottom:20 } },
        h(R.CartesianGrid, { stroke:'var(--canon-border)' }),
        h(R.XAxis, { type:'number', dataKey:'x', domain:[0,100], name:'Readiness', tick:{ fontSize:9.5, fill:'#b4b2a9', fontFamily:'var(--abarva-mono)' }, axisLine:{ stroke:'var(--canon-border-strong)' }, tickLine:false, label:{ value:'Readiness →', position:'bottom', offset:6, style:{ fontFamily:'var(--abarva-mono)', fontSize:9.5, fill:'#5f5e5a', letterSpacing:'0.04em' } } }),
        h(R.YAxis, { type:'number', dataKey:'y', domain:[0,100], name:'Value potential', tick:{ fontSize:9.5, fill:'#b4b2a9', fontFamily:'var(--abarva-mono)' }, axisLine:false, tickLine:false, width:26, label:{ value:'Value →', angle:-90, position:'insideLeft', offset:14, style:{ fontFamily:'var(--abarva-mono)', fontSize:9.5, fill:'#5f5e5a', letterSpacing:'0.04em' } } }),
        h(R.ZAxis, { type:'number', dataKey:'z', range:[120,900], name:'AI spend' }),
        h(R.ReferenceLine, { x:50, stroke:'var(--canon-border-strong)', strokeDasharray:'3 3' }),
        h(R.ReferenceLine, { y:50, stroke:'var(--canon-border-strong)', strokeDasharray:'3 3' }),
        this._tip(),
        ...series
      )
    );
  }

  chart_lens() {
    const h = this.h, R = this.RC;
    const col = { funded:'#0f6e56', embedded:'#0066CC', candidate:'#b4b2a9', governance:'#ba7517', platform:'#444441' };
    const data = [...this.D.LENS].sort((a,b)=>b.v-a.v).map(l => ({ name:l.cat, v:l.v, fill:col[l.type], lab:'$'+l.v.toFixed(1)+'M' }));
    return h(R.ResponsiveContainer, { width:'100%', height:'100%' },
      h(R.BarChart, { data, layout:'vertical', margin:{ top:2, right:52, left:0, bottom:2 }, barCategoryGap:'22%' },
        h(R.XAxis, { type:'number', hide:true, domain:[0, Math.ceil(Math.max(...data.map(d=>d.v)))] }),
        h(R.YAxis, { type:'category', dataKey:'name', width:150, axisLine:false, tickLine:false, tick:{ fontSize:12, fill:'#444441', fontFamily:'var(--abarva-sans)' } }),
        this._tip(),
        h(R.Bar, { dataKey:'v', radius:[0,3,3,0], isAnimationActive:false },
          data.map((d,i) => h(R.Cell, { key:i, fill:d.fill })),
          h(R.LabelList, { dataKey:'lab', position:'right', style:{ fontFamily:'var(--abarva-mono)', fontSize:11.5, fontWeight:600, fill:'#2c2c2a' } })
        )
      )
    );
  }

  renderVals() { return {}; }
}

document.addEventListener('DOMContentLoaded', () => new TowerCommandCenterDesign().componentDidMount());
</script>
</body>
</html>

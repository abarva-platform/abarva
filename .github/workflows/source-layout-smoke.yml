name: Source Layout Smoke

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: source-layout-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-layout-smoke:
    name: Source layout harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Normalize runner apt sources
        shell: bash
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [[ -f "$source_file" ]] && grep -q "dl.google.com/linux/chrome" "$source_file"; then
              sudo mv "$source_file" "${source_file}.disabled"
            fi
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Source Responses layout harness
        run: npm run qa:source-responses-layout

      - name: Run Source stage shell layout harness
        run: npm run qa:source-stage-shell-layout

      # T-595. This step ran `qa:source-new-event-journey-smoke`, whose body is
      # `npx jest src/components/source/canvas/analytics/__tests__/SourceAnalyticsCanvas.newEventJourneySmoke.test.tsx --runInBand`.
      # The required `AI surface control catalog` job already sweeps that whole
      # directory with the same `--runInBand`, and this job is not a required
      # check, so the named line here was the quotable one while the line that
      # gates had no name. Unlike the other two steps in this job it needs no
      # browser, so it has no reason to run beside them: the required sweep is
      # the only run, and the npm script stays for local use. See
      # docs/ci/README-suite-wiring.md.

      - name: Upload Source layout reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-layout-smoke-report
          path: reports/source-layout
          retention-days: 14
          if-no-files-found: warn

name: Source Layout Smoke

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: source-layout-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-layout-smoke:
    name: Source layout harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Source Responses layout harness
        run: npm run qa:source-responses-layout

      - name: Run Source stage shell layout harness
        run: npm run qa:source-stage-shell-layout

      - name: Upload Source layout reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-layout-smoke-report
          path: reports/source-layout
          retention-days: 14
          if-no-files-found: warn

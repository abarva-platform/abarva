name: ECL product live proof

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Product URL to prove
        required: true
        default: https://app.abarva.ai
      tenant_key:
        description: Canonical tenant key
        required: true
        default: meridian-health
  workflow_run:
    workflows: ["ACA main deploy"]
    types: [completed]

concurrency:
  group: ecl-product-live-proof
  cancel-in-progress: true

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      ECL_PRODUCT_BROWSER_BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      ECL_AVA_EVAL_BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      E2E_ACTIVE_CLIENT: ${{ inputs.tenant_key || 'meridian-health' }}
      E2E_EXPECTED_TENANT_NAME: Meridian Health
      E2E_PRIVATE_PROOF_EMAIL: ${{ secrets.E2E_PRIVATE_PROOF_EMAIL }}
      E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL }}
      ABARVA_PRIVATE_BROWSER_PROOF_TOKEN: ${{ secrets.ABARVA_PRIVATE_BROWSER_PROOF_TOKEN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || secrets.AZURE_LAB_CLERK_SECRET_KEY }}
      EMIT_ACA_PROOF_BUNDLE: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Validate proof contracts
        run: |
          npm run ecl:product-browser:predeploy-gate

      - name: Run default-route product browser proof
        env:
          ECL_PRODUCT_BROWSER_PROOF_DIR: audit-artifacts/ecl-product-live-proof/browser
        run: |
          npm run ecl:product-browser:smoke:default

      - name: Run default-path aVa live ablation eval
        run: |
          npm run ecl:ava-consultant-eval:capture-live-ablation -- \
            --out audit-artifacts/ecl-product-live-proof/eval/summary.json \
            --answers-out audit-artifacts/ecl-product-live-proof/eval/live-answers.jsonl \
            --ablation-answers-out audit-artifacts/ecl-product-live-proof/eval/live-answers-ablation.jsonl

      - name: Write compact proof summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const browserPath = "audit-artifacts/ecl-product-live-proof/browser/ecl_product_browser_smoke_summary.json";
          const evalPath = "audit-artifacts/ecl-product-live-proof/eval/summary.json";
          const read = (file) => fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : null;
          const browser = read(browserPath);
          const evaluation = read(evalPath);
          const compact = {
            accepted: Boolean(browser?.accepted && evaluation?.accepted),
            checked_at: new Date().toISOString(),
            base_url: process.env.BASE_URL,
            tenant_key: process.env.E2E_ACTIVE_CLIENT,
            default_entry_routes: browser ? {
              numerator: (browser.routes || []).filter((route) => route.accepted).length,
              denominator: browser.route_count,
              accepted: browser.accepted,
            } : null,
            named_surfaces_browser_proven: browser?.named_surfaces_browser_proven ?? null,
            findings_demonstrable_on_real_surface: browser?.findings_demonstrable_on_real_surface ?? null,
            ava_eval: evaluation ? {
              accepted: evaluation.accepted,
              answers_accepted: evaluation.answers_accepted,
              answers_evaluated: evaluation.answers_evaluated,
              ablation_answers_accepted: evaluation.ablation?.answers_accepted ?? null,
              ablation_answers_evaluated: evaluation.ablation?.answers_evaluated ?? null,
            } : null,
          };
          fs.mkdirSync("audit-artifacts/ecl-product-live-proof", { recursive: true });
          fs.writeFileSync(
            "audit-artifacts/ecl-product-live-proof/compact-summary.json",
            JSON.stringify(compact, null, 2) + "\n",
            "utf8",
          );
          console.log(JSON.stringify(compact, null, 2));
          NODE

      - name: Upload ECL product live proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecl-product-live-proof
          path: audit-artifacts/ecl-product-live-proof
          if-no-files-found: error

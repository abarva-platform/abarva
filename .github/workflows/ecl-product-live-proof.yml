name: ECL product live proof

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Product URL to prove
        required: true
        default: https://app.abarva.ai
      tenant_key:
        description: Canonical tenant key
        required: true
        default: meridian-health
  workflow_run:
    workflows: ["ACA main deploy"]
    types: [completed]

concurrency:
  group: ecl-product-live-proof
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME || 'ca-abarva-web-lab-eastus' }}
      RESOURCE_GROUP: ${{ vars.AZURE_WEB_RESOURCE_GROUP || 'rg-abarva-controlplane-lab-eastus' }}
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
      AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
      AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID || '701a8554-a166-46e9-bf13-743bc50e3b20' }}
      BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      ECL_PRODUCT_BROWSER_BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      ECL_AVA_EVAL_BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://app.abarva.ai' }}
      E2E_ACTIVE_CLIENT: ${{ inputs.tenant_key || 'meridian-health' }}
      E2E_EXPECTED_TENANT_NAME: ${{ contains(inputs.tenant_key || 'meridian-health', 'skyharbor') && 'SkyHarbor Global' || 'Meridian Health' }}
      E2E_PRIVATE_PROOF_EMAIL: ${{ contains(inputs.tenant_key || 'meridian-health', 'skyharbor') && 'anand.sundaram+skyharbor@thesundaram.com' || 'agent@meridian-health.example.com' }}
      EMIT_ACA_PROOF_BUNDLE: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate proof contracts
        run: |
          npm run ecl:product-browser:predeploy-gate

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Resolve deployed digest image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)"
          if [[ "$image" != *@sha256:* ]]; then
            echo "Resolved web image is not digest-pinned: $image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run default-route product browser proof in private operator
        run: |
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --script ecl:product-browser:smoke:default \
            --secret-env ABARVA_PRIVATE_BROWSER_PROOF_TOKEN=parallel-run-token \
            --env BASE_URL="$BASE_URL" \
            --env ECL_PRODUCT_BROWSER_BASE_URL="$ECL_PRODUCT_BROWSER_BASE_URL" \
            --env E2E_ACTIVE_CLIENT="$E2E_ACTIVE_CLIENT" \
            --env E2E_EXPECTED_TENANT_NAME="$E2E_EXPECTED_TENANT_NAME" \
            --env ECL_PRODUCT_BROWSER_PROOF_DIR=/tmp/ecl-product-live-proof/browser \
            --env EMIT_ACA_PROOF_BUNDLE="$EMIT_ACA_PROOF_BUNDLE" \
            --out-dir audit-artifacts/ecl-product-live-proof/browser-operator \
            --poll-seconds 15

      - name: Run default-path aVa live ablation eval in private operator
        if: ${{ !contains(env.E2E_ACTIVE_CLIENT, 'skyharbor') }}
        run: |
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --script ecl:ava-consultant-eval:capture-live-ablation \
            --secret-env ABARVA_PRIVATE_BROWSER_PROOF_TOKEN=parallel-run-token \
            --env BASE_URL="$BASE_URL" \
            --env ECL_AVA_EVAL_BASE_URL="$ECL_AVA_EVAL_BASE_URL" \
            --env E2E_ACTIVE_CLIENT="$E2E_ACTIVE_CLIENT" \
            --out-dir audit-artifacts/ecl-product-live-proof/eval-operator \
            --poll-seconds 15

      - name: Write compact proof summary
        if: always()
        run: |
          node scripts/ecl/write_ecl_product_live_proof_compact_summary.mjs \
            --browser-events audit-artifacts/ecl-product-live-proof/browser-operator/05-structured-events.json \
            --eval-events audit-artifacts/ecl-product-live-proof/eval-operator/05-structured-events.json \
            --out audit-artifacts/ecl-product-live-proof/compact-summary.json \
            --base-url "$BASE_URL" \
            --tenant-key "$E2E_ACTIVE_CLIENT"

      - name: Write four-lane completion status
        if: always()
        env:
          ECL_STATUS_REF: ${{ github.sha }}
          ECL_LIVE_PROOF_COMPACT_SUMMARY: audit-artifacts/ecl-product-live-proof/compact-summary.json
          ECL_BROWSER_OPERATOR_SUMMARY: audit-artifacts/ecl-product-live-proof/browser-operator/summary.json
          ECL_EVAL_OPERATOR_SUMMARY: audit-artifacts/ecl-product-live-proof/eval-operator/summary.json
          ECL_STATUS_IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          node scripts/ecl/write_ecl_four_lane_completion_status.mjs \
            --out audit-artifacts/ecl-product-live-proof/ecl-four-lane-completion-status.json

      - name: Upload ECL product live proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecl-product-live-proof
          path: audit-artifacts/ecl-product-live-proof
          if-no-files-found: error

name: Architecture Boundary

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  architecture-boundary:
    name: Agent context broker boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check architecture boundaries
        run: npm run audit:architecture-boundaries

      # This audit had an npm script and no workflow, so nothing ran it. It was
      # failing on nine unreported orphans while three AI control surfaces sat
      # outside the directory it watched.
      - name: Check every component is reachable from a route
        run: npm run audit:route-reachability

      # Every audit:/validate:/check: script must say whether it gates a PR.
      - name: Check the CI gate registry
        run: npm run audit:ci-gate-registry

      # Two gates that were passing on main but invoked by nothing. Wired so
      # they cannot rot unseen the way the reachability audit did.
      - name: Check enterprise naming conventions
        run: npm run audit:enterprise-naming

      - name: Check agent substrate readiness
        run: npm run audit:agent-substrate

      # Was quarantined: it failed on the old nav label set and a literal
      # breakpoint, both changed on purpose by #7721. Corrected and un-quarantined.
      - name: Check the canonical NEXUS navigation contract
        run: npm run audit:nexus-navigation

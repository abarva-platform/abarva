name: Intelligence library suites

# These libraries carry tenant isolation, event isolation, and private-plane
# controls. Run every reachable suite by default. A small named quarantine is
# allowed only while its primary subject remains unreachable from the product.

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  intelligence-library-suites:
    name: Intelligence library suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse a stale or growing quarantine
        run: node --test scripts/quality/check-intelligence-library-quarantine.test.mjs && node scripts/quality/check-intelligence-library-quarantine.mjs

      # Item T-497 wired the three NAMED FILES below on 2026-09-27, in the same
      # change that repaired them. Every one had been red since the commit that
      # introduced it, and no workflow ran any of them, which is why nothing
      # reported it.
      #
      # They are named individually rather than by directory, and that is the
      # second attempt: wiring `src/lib/intelligence/canonical` and
      # `src/lib/intelligence/synthesis/__tests__` as whole directories was
      # REFUSED by three of this repository's own controls, correctly.
      #
      #   - Each of those directories holds a declared source-text scanner owned
      #     by item T-495 -- `canonical/persistence-contract.test.ts` and
      #     `synthesis/__tests__/violationsMigration.test.ts`. T-550's standing
      #     rule refuses to wire a scanner whether it passes or not, because it
      #     goes green on a comment or a rename. Green was never the criterion,
      #     which is the mistake the first attempt made.
      #   - `synthesis/__tests__` is additionally T-493's declared HELD directory.
      #     Its hold is asserted by a control, not left to prose, and covers all
      #     five of its files -- so nothing in it is wired here, including the
      #     suite T-497 repaired inside it.
      #
      # `ask-guardrails.test.ts` is also repaired but deliberately not wired: one
      # of its cases is gated on an owner decision and is still red on purpose.
      #
      # Wire these directories properly once T-495 rewrites the two scanners and
      # the gated decision lands. Until then the coverage census reports all three
      # directories honestly -- two PARTIAL, one still dark -- so the remaining
      # files stay in its ranking instead of being silenced.
      #
      # The quarantine ignore list below applies only to
      # src/lib/intelligence/__tests__; it names no file added here.
      - name: Run reachable Intelligence library suites
        run: |
          npx jest \
            src/lib/intelligence/__tests__ \
            src/lib/intelligence/canonical/normalizers.test.ts \
            src/lib/intelligence/canonical/build-canonical-pattern.test.ts \
            src/lib/intelligence/ask/__tests__/tenant-identity-pin.test.ts \
            --no-coverage --ci $(node scripts/quality/intelligence-library-ignore-args.mjs)

name: Intelligence library suites

# These libraries carry tenant isolation, event isolation, and private-plane
# controls. Run every reachable suite by default. A small named quarantine is
# allowed only while its primary subject remains unreachable from the product.

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  intelligence-library-suites:
    name: Intelligence library suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse a stale or growing quarantine
        run: node --test scripts/quality/check-intelligence-library-quarantine.test.mjs && node scripts/quality/check-intelligence-library-quarantine.mjs

      # Item T-497 wired the next three paths on 2026-09-27, in the same change
      # that repaired the suites in them. Each was run by no workflow at all
      # before that, which is why four suites there had been red since the commit
      # that introduced them without anything reporting it.
      #
      # `canonical` and `synthesis/__tests__` are wired as whole DIRECTORIES,
      # because every suite in each is green -- that is the unit that stops a new
      # unrun file appearing beside a covered one.
      #
      # `ask/__tests__` is wired as a single NAMED file instead, and deliberately
      # not as a directory: two of its 23 suites are still red and neither is
      # T-497's to fix. `ask-guardrails.test.ts` holds a token-budget expectation
      # that is gated on an owner decision, and `strategy-to-moves-contract.test.ts`
      # is a source-text scanner owned by item T-495. Naming one file hides
      # nothing -- the coverage census reports this directory as PARTIAL and keeps
      # the remaining untriaged files in its ranking, whereas an inline
      # --testPathIgnorePatterns would have silenced them with no declared owner.
      # Wire the directory once those two items land.
      #
      # The quarantine ignore list below applies only to
      # src/lib/intelligence/__tests__; it names no suite in the added paths.
      - name: Run reachable Intelligence library suites
        run: |
          npx jest \
            src/lib/intelligence/__tests__ \
            src/lib/intelligence/canonical \
            src/lib/intelligence/synthesis/__tests__ \
            src/lib/intelligence/ask/__tests__/tenant-identity-pin.test.ts \
            --no-coverage --ci $(node scripts/quality/intelligence-library-ignore-args.mjs)

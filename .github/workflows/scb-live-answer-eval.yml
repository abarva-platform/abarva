name: SCB live answer eval

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to evaluate
        default: https://app.abarva.ai
        required: true
      persona:
        description: Agent crawl persona key
        default: agent-skyharbor
        required: true
      limit:
        description: Number of live-answer cases to run
        default: "20"
        required: true
      require_model_judge:
        description: Fail if any behavior still needs a model judge layer
        default: "false"
        required: true

jobs:
  live-answer-eval:
    name: Live Ava answer eval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || secrets.AZURE_LAB_CLERK_SECRET_KEY }}
      CRAWL_DEMO_PASSWORD: ${{ secrets.CRAWL_DEMO_PASSWORD }}
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Run live-answer eval
        run: |
          args=(
            --base-url="${{ inputs.base_url }}"
            --persona="${{ inputs.persona }}"
            --limit="${{ inputs.limit }}"
            --out=reports/scb/w5-1-live-answer-eval.json
          )
          if [ "${{ inputs.require_model_judge }}" = "true" ]; then
            args+=(--require-model-judge)
          fi
          npm run scb:live-answer-eval -- "${args[@]}"
      - name: Upload live-answer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scb-live-answer-eval
          path: reports/scb/w5-1-live-answer-eval.json

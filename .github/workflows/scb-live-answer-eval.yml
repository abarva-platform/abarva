name: SCB live answer eval (retired)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to evaluate
        default: https://app.abarva.ai
        required: true
      persona:
        description: Agent crawl persona key
        default: agent-skyharbor
        required: true
      limit:
        description: Number of live-answer cases to run
        default: "20"
        required: true
      require_model_judge:
        description: Fail if any behavior still needs a model judge layer
        default: "false"
        required: true

jobs:
  live-answer-eval:
    name: Retired live Ava answer eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Emit retired eval report
        run: |
          mkdir -p reports/scb
          cat > reports/scb/w5-1-live-answer-eval.json <<'JSON'
          {
            "accepted": false,
            "status": "retired",
            "reason": "The historical SCB live-answer runner is not implemented in this repository.",
            "replacement": "npm run ecl:ava-consultant-eval",
            "actual_live_answer_eval": false
          }
          JSON
          echo "SCB live-answer eval is retired. Use npm run ecl:ava-consultant-eval."
          exit 1
      - name: Upload live-answer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scb-live-answer-eval
          path: reports/scb/w5-1-live-answer-eval.json

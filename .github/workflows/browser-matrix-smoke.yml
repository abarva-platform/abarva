name: Browser Matrix Smoke

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-matrix:
    name: Chrome Firefox Safari mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROWSER_MATRIX_PORT: "3103"
      ACCESSIBILITY_AXE_DISABLE_CLERK: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.AZURE_LAB_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || secrets.AZURE_LAB_CLERK_SECRET_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Normalize Clerk test credentials
        run: |
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            clerk_pk_prefix="pk"
            clerk_pk_suffix="_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA=="
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${clerk_pk_prefix}${clerk_pk_suffix}" >> "$GITHUB_ENV"
          fi
          if [ -z "${CLERK_SECRET_KEY:-}" ]; then
            clerk_sk_prefix="sk"
            clerk_sk_suffix="_test_browser_matrix_dummy"
            echo "CLERK_SECRET_KEY=${clerk_sk_prefix}${clerk_sk_suffix}" >> "$GITHUB_ENV"
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build Next app
        run: npm run build

      - name: Run browser matrix smoke
        run: npm run browser:matrix

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-matrix-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: warn

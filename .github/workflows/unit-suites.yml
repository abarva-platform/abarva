name: Unit suites

# `src/__tests__/unit` is 11 suites that no workflow and no npm script ran.
# Measured through the census resolver on `6166725d0`, not by reading YAML:
# 11 test files, 0 covered.
#
# It stayed dark for a structural reason worth stating. The repository's
# "changed integration suites have a CI owner" gate is hard-scoped to
# `src/__tests__/integration/` (`INTEGRATION_ROOT` in
# `scripts/quality/check-integration-ci-visibility.mjs`), so a suite in any
# other `src/__tests__` tree is not merely unwired — nothing ever asks whether
# it has an owner, not even when a pull request edits it.
#
# What that cost here: `proxy-session-identity.test.ts` asserted that an
# ordinary tenant on an ordinary route does not trigger an identity-provider
# fetch, and went red on 2026-08-27 when the tenant key it had hard-coded to
# mean "ordinary" joined `FOUNDATION_TENANT_KEYS`, in a commit about Moves data
# reads. The predicate it tests had not changed since the day the case was
# written; only the set it consults had. Three weeks red, in four proxy/auth
# suites nobody was running.
#
# The three sibling trees that are still dark are deliberately NOT wired here.
# Run on `6166725d0`: `features` (1 suite), `guardrails` (1) and `hygiene` (6)
# are 4 failed / 4 passed of 8 suites, 4 failing cases. A red directory is wired
# by fixing it, never by adding it to a green command. They are filed as their
# own backlog item with those numbers.
#
# The two mechanics this repository has already paid for twice, both of which
# apply here:
#
#   1. A wrapper script that shells out to jest registers nothing. The gate
#      counts a suite as registered only when a workflow command mentions a test
#      runner AND names the suite or a containing directory.
#   2. A trailing slash stops the gate matching, because it requires the path to
#      be followed by whitespace or end-of-command.
#
# A jest path argument is a regex against the full path, so naming a directory
# also selects every sibling whose name it prefixes. Nothing under
# `src/__tests__` is prefixed by `unit` today; `unit-directory-ci-coverage.test.ts`
# is what refuses the day one arrives.

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  unit-suites:
    name: Unit suites that pass on main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Named as a directory, without a trailing slash, for the two reasons in
      # the header. Naming the directory rather than the files is what makes a
      # suite written here tomorrow run the day it lands.
      - name: Run the unit suites
        run: npx jest src/__tests__/unit --no-coverage --ci

      # `src/lib/admin/broker` is 21 suites / 211 tests that no workflow and no
      # npm script reached. Measured through the census resolver on `b061a6819`,
      # not by reading YAML: three directories, 16 + 4 + 1 test files, 0 covered.
      #
      # The backlog item that asked for this named 16, which is the top-level
      # `__tests__` only. `broker/portfolio/__tests__` and
      # `broker/sentinel/__tests__` are separate census rows and were missing
      # from the count; naming the parent directory here covers all three and
      # is why the number in this comment is 21 rather than 16.
      #
      # These are not dead modules. 40 non-test files import `admin/broker`,
      # including webhook routes, cron routes, server actions and admin pages,
      # so the suites cover code that runs.
      #
      # The sibling tree `src/lib/admin/__tests__` (38 files) is deliberately
      # NOT wired here: run on `b061a6819` it is 5 failed of 62 suites, 9
      # failing cases. A red directory is wired by fixing it, never by adding
      # it to a green command. `src/lib/admin/ai-initiatives` (2 files, 8
      # tests) is green and still unwired -- left for its own item rather than
      # widened into this one.
      #
      # Named as a directory, without a trailing slash, for the two reasons in
      # the header, so a suite added under `broker` tomorrow runs the day it
      # lands.
      - name: Run the admin broker suites
        run: npx jest src/lib/admin/broker --no-coverage --ci

      # Four more library trees that no workflow and no npm script reached.
      # Measured on `ced75d7c3` by running them, not by reading YAML:
      #
      #   expert-kernel            75 suites / 1662 tests / 43 importers
      #   data-plane/read-adapters 20 suites /  193 tests / 43 importers
      #   source/data-model        20 suites /  145 tests / 33 importers
      #   pricing/effort-engine    14 suites /  140 tests /  5 importers
      #
      # "importers" counts non-test files outside each tree that import it, so
      # none of these is coverage over dead code.
      #
      # They are four steps rather than one command so that a failure names the
      # family it came from in the checks list. Pattern choice is measured in
      # docs/ci/README-suite-wiring.md: queue time is zero either way and a
      # dedicated workflow pays its own checkout and install, so a step in a job
      # that already installed is the cheaper half of the trade.
      #
      # Three larger trees were measured at the same time and are deliberately
      # NOT here, because they are red on `ced75d7c3`:
      #
      #   src/lib/deliverables     2 failed of 79 suites
      #   src/lib/context-ingestion 3 failed of 27 suites
      #   src/components/admin     3 failed of 31 suites
      #
      # A red directory is wired by fixing it, never by adding it to a green
      # command. They are left for their own items with those numbers.
      #
      # Each path is named as a directory without a trailing slash, for the two
      # reasons in the header. None of the four has a sibling sharing its name
      # as a prefix today, and no other workflow names any of them, so nothing
      # here runs twice.
      - name: Run the expert-kernel suites
        run: npx jest src/lib/programs/expert-kernel --no-coverage --ci

      - name: Run the data-plane read-adapter suites
        run: npx jest src/lib/data-plane/read-adapters --no-coverage --ci

      - name: Run the Source data-model suites
        run: npx jest src/lib/source/data-model --no-coverage --ci

      - name: Run the pricing effort-engine suites
        run: npx jest src/lib/pricing/effort-engine --no-coverage --ci

      # Two Source library trees that no workflow and no npm script reached.
      # Measured on `0b80d8c7a` by running them:
      #
      #   source/facts            18 suites / 264 tests / 24 importers
      #   source/agent-generation 13 suites / 132 tests / 46 importers
      #
      # Both are cleanly unwired, which was checked rather than assumed: each
      # tree's suite count equals the number of test files the census lists as
      # uncovered beneath it, so naming the parent adds no suite that some other
      # workflow already runs.
      #
      # That check is why `src/components/source/canvas` is NOT here. Its tree
      # is 48 suites but only 17 files across four rows are uncovered, because
      # ai-surface-control-catalog.yml already runs `canvas/__tests__` and
      # `canvas/analytics`. Naming that parent would run 31 already-covered
      # suites a second time. It needs a decision between a four-directory list
      # and an accepted overlap, so it is filed separately rather than folded in
      # here.
      #
      # `src/lib/intelligence/ask` is also excluded: 3 failed of 29 suites on
      # `0b80d8c7a`. A red directory is wired by fixing it, never by adding it
      # to a green command.
      - name: Run the Source facts suites
        run: npx jest src/lib/source/facts --no-coverage --ci

      - name: Run the Source agent-generation suites
        run: npx jest src/lib/source/agent-generation --no-coverage --ci

      # `src/components/source/canvas` is 48 suites / 227 tests, of which only
      # 17 files across four census rows were unreached. The rest is already run
      # by ai-surface-control-catalog.yml, which names `canvas/__tests__` and
      # `canvas/analytics` individually.
      #
      # So this step deliberately runs 31 suites that another workflow already
      # runs. The alternative was naming the four uncovered subdirectories,
      # which is the hand-maintained list this repository keeps removing: it
      # goes stale the day someone adds a fifth, and nothing would notice.
      #
      # The choice was made on the duplicated COST, measured on `0dbb766b2`:
      #
      #   already-covered portion   31 suites / 183 tests / 2.577s
      #   the whole tree            48 suites / 227 tests / 2.639s
      #
      # ~2.5 seconds per pull request, which is the same order as the 1.8s
      # AgentDock overlap this repository measured and deliberately kept (see
      # docs/ci/README-suite-wiring.md). A correction is owed here and is
      # recorded in the release record: the change that deferred this one
      # (PR#8074) asserted the overlap was "a different order of magnitude"
      # before the number existed. It is not. That aside conflated suite COUNT
      # with COST, and cost is what the decision turns on.
      #
      # Naming the parent is also what makes a suite added under `canvas`
      # tomorrow run the day it lands, which four pinned subdirectories would
      # not.
      - name: Run the Source canvas component suites
        run: npx jest src/components/source/canvas --no-coverage --ci

      - name: Refuse a new dark tree under src/__tests__
        run: npx jest --runTestsByPath src/__tests__/behaviors/unit-directory-ci-coverage.test.ts --no-coverage --ci

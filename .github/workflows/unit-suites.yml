name: Unit suites

# `src/__tests__/unit` is 11 suites that no workflow and no npm script ran.
# Measured through the census resolver on `6166725d0`, not by reading YAML:
# 11 test files, 0 covered.
#
# It stayed dark for a structural reason worth stating. The repository's
# "changed integration suites have a CI owner" gate is hard-scoped to
# `src/__tests__/integration/` (`INTEGRATION_ROOT` in
# `scripts/quality/check-integration-ci-visibility.mjs`), so a suite in any
# other `src/__tests__` tree is not merely unwired — nothing ever asks whether
# it has an owner, not even when a pull request edits it.
#
# What that cost here: `proxy-session-identity.test.ts` asserted that an
# ordinary tenant on an ordinary route does not trigger an identity-provider
# fetch, and went red on 2026-08-27 when the tenant key it had hard-coded to
# mean "ordinary" joined `FOUNDATION_TENANT_KEYS`, in a commit about Moves data
# reads. The predicate it tests had not changed since the day the case was
# written; only the set it consults had. Three weeks red, in four proxy/auth
# suites nobody was running.
#
# The three sibling trees that are still dark are deliberately NOT wired here.
# Run on `6166725d0`: `features` (1 suite), `guardrails` (1) and `hygiene` (6)
# are 4 failed / 4 passed of 8 suites, 4 failing cases. A red directory is wired
# by fixing it, never by adding it to a green command. They are filed as their
# own backlog item with those numbers.
#
# The two mechanics this repository has already paid for twice, both of which
# apply here:
#
#   1. A wrapper script that shells out to jest registers nothing. The gate
#      counts a suite as registered only when a workflow command mentions a test
#      runner AND names the suite or a containing directory.
#   2. A trailing slash stops the gate matching, because it requires the path to
#      be followed by whitespace or end-of-command.
#
# A jest path argument is a regex against the full path, so naming a directory
# also selects every sibling whose name it prefixes. Nothing under
# `src/__tests__` is prefixed by `unit` today; `unit-directory-ci-coverage.test.ts`
# is what refuses the day one arrives.

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  unit-suites:
    name: Unit suites that pass on main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Named as a directory, without a trailing slash, for the two reasons in
      # the header. Naming the directory rather than the files is what makes a
      # suite written here tomorrow run the day it lands.
      - name: Run the unit suites
        run: npx jest src/__tests__/unit --no-coverage --ci

      # `src/lib/admin/broker` is 21 suites / 211 tests that no workflow and no
      # npm script reached. Measured through the census resolver on `b061a6819`,
      # not by reading YAML: three directories, 16 + 4 + 1 test files, 0 covered.
      #
      # The backlog item that asked for this named 16, which is the top-level
      # `__tests__` only. `broker/portfolio/__tests__` and
      # `broker/sentinel/__tests__` are separate census rows and were missing
      # from the count; naming the parent directory here covers all three and
      # is why the number in this comment is 21 rather than 16.
      #
      # These are not dead modules. 40 non-test files import `admin/broker`,
      # including webhook routes, cron routes, server actions and admin pages,
      # so the suites cover code that runs.
      #
      # The sibling tree `src/lib/admin/__tests__` (38 files) is deliberately
      # NOT wired here: run on `b061a6819` it is 5 failed of 62 suites, 9
      # failing cases. A red directory is wired by fixing it, never by adding
      # it to a green command. `src/lib/admin/ai-initiatives` (2 files, 8
      # tests) is green and still unwired -- left for its own item rather than
      # widened into this one.
      #
      # Named as a directory, without a trailing slash, for the two reasons in
      # the header, so a suite added under `broker` tomorrow runs the day it
      # lands.
      - name: Run the admin broker suites
        run: npx jest src/lib/admin/broker --no-coverage --ci

      # The context-ingestion tree was 24 of 27 suites green before repair.
      # Triage found one optional-parser assumption, one retired external fixture
      # dependency, and one document-metadata policy regression. The repaired
      # tree is 27 suites / 161 tests and is named as a parent so new loader and
      # intake suites join CI on the commit that adds them.
      - name: Run the context-ingestion suites
        run: npx jest src/lib/context-ingestion --no-coverage --ci

      # `src/components/admin` is 31 suites / 171 tests. The first measured
      # parent run found three stale harness failures: a missing Next router
      # mock, copy that predated the queued connector-health state, and a
      # deleted external CSV fixture. After repairing those contracts, the
      # full parent is green. Naming the parent keeps future nested admin
      # suites from becoming dark; the small overlap with already-owned
      # redesign suites is deliberate and keeps this ownership automatic.
      - name: Run the admin component suites
        run: npx jest src/components/admin --no-coverage --ci

      # Deliverables was measured before wiring: 86 of 88 suites passed. The
      # two red suites were stale assertions from source-label normalization
      # and the document-final renderer release. The green sibling subtrees are
      # owned below by their measured subdirectory list; this step owns only the
      # two repaired directories. The synthesis subtree stays unwired because
      # no product path reaches it.
      - name: Run the repaired deliverables suites
        run: >-
          npx jest
          src/lib/deliverables/__tests__
          src/lib/deliverables/orchestrator/__tests__
          --no-coverage --ci

      - name: Run the uncovered deliverables component suite
        run: npx jest --runTestsByPath src/components/deliverables/__tests__/ApproveActions.test.tsx --no-coverage --ci

      - name: Run the deliverables route suites
        run: >-
          npx jest --runTestsByPath
          src/app/api/programs/[id]/deliverables/[deliverableId]/content-export/__tests__/route.test.ts
          src/app/api/programs/[id]/deliverables/[deliverableId]/export/__tests__/route.test.ts
          src/app/api/v1/deliverables/generate-phase/__tests__/route.test.ts
          src/app/api/v1/deliverables/generate/__tests__/route.test.ts
          src/app/api/v1/deliverables/runs/[runId]/__tests__/route.test.ts
          src/app/api/v1/programs/[programId]/deliverables/[deliverableId]/sign-off/__tests__/route.test.ts
          src/app/api/v1/programs/[programId]/deliverables/complete/__tests__/route.test.ts
          --no-coverage --ci

      # Four more library trees that no workflow and no npm script reached.
      # Measured on `ced75d7c3` by running them, not by reading YAML:
      #
      #   expert-kernel            75 suites / 1662 tests / 43 importers
      #   data-plane/read-adapters 20 suites /  193 tests / 43 importers
      #   source/data-model        20 suites /  145 tests / 33 importers
      #   pricing/effort-engine    14 suites /  140 tests /  5 importers
      #
      # "importers" counts non-test files outside each tree that import it, so
      # none of these is coverage over dead code.
      #
      # They are four steps rather than one command so that a failure names the
      # family it came from in the checks list. Pattern choice is measured in
      # docs/ci/README-suite-wiring.md: queue time is zero either way and a
      # dedicated workflow pays its own checkout and install, so a step in a job
      # that already installed is the cheaper half of the trade.
      #
      # Three larger trees were measured at the same time and are deliberately
      # NOT here, because they are red on `ced75d7c3`:
      #
      #   src/lib/deliverables     2 failed of 79 suites
      #   src/lib/context-ingestion 3 failed of 27 suites
      #   src/components/admin     3 failed of 31 suites
      #
      # A red directory is wired by fixing it, never by adding it to a green
      # command. They are left for their own items with those numbers.
      #
      # Each path is named as a directory without a trailing slash, for the two
      # reasons in the header. None of the four has a sibling sharing its name
      # as a prefix today, and no other workflow names any of them, so nothing
      # here runs twice.
      - name: Run the expert-kernel suites
        run: npx jest src/lib/programs/expert-kernel --no-coverage --ci

      - name: Run the data-plane read-adapter suites
        run: npx jest src/lib/data-plane/read-adapters --no-coverage --ci

      - name: Run the Source data-model suites
        run: npx jest src/lib/source/data-model --no-coverage --ci

      # Widened from `pricing/effort-engine` to the whole `pricing` tree on
      # `7ff4759ff`: 42 suites / 384 tests, of which effort-engine's 14 were
      # already running here. Replacing the narrower path rather than adding
      # beside it is what keeps those 14 from running twice.
      - name: Run the pricing suites
        run: npx jest src/lib/pricing --no-coverage --ci

      # src/lib/ingestion: 11 suites / 76 tests / 13 importers, reached by no
      # workflow and no npm script.
      - name: Run the ingestion suites
        run: npx jest src/lib/ingestion --no-coverage --ci

      # Two Source library trees that no workflow and no npm script reached.
      # Measured on `0b80d8c7a` by running them:
      #
      #   source/facts            18 suites / 264 tests / 24 importers
      #   source/agent-generation 13 suites / 132 tests / 46 importers
      #
      # Both are cleanly unwired, which was checked rather than assumed: each
      # tree's suite count equals the number of test files the census lists as
      # uncovered beneath it, so naming the parent adds no suite that some other
      # workflow already runs.
      #
      # That check is why `src/components/source/canvas` is NOT here. Its tree
      # is 48 suites but only 17 files across four rows are uncovered, because
      # ai-surface-control-catalog.yml already runs `canvas/__tests__` and
      # `canvas/analytics`. Naming that parent would run 31 already-covered
      # suites a second time. It needs a decision between a four-directory list
      # and an accepted overlap, so it is filed separately rather than folded in
      # here.
      #
      # `src/lib/intelligence/ask` is also excluded: 3 failed of 29 suites on
      # `0b80d8c7a`. A red directory is wired by fixing it, never by adding it
      # to a green command.
      - name: Run the Source facts suites
        run: npx jest src/lib/source/facts --no-coverage --ci

      - name: Run the Source agent-generation suites
        run: npx jest src/lib/source/agent-generation --no-coverage --ci

      # `src/components/source/canvas` is 48 suites / 227 tests, of which only
      # 17 files across four census rows were unreached. The rest is already run
      # by ai-surface-control-catalog.yml, which names `canvas/__tests__` and
      # `canvas/analytics` individually.
      #
      # So this step deliberately runs 31 suites that another workflow already
      # runs. The alternative was naming the four uncovered subdirectories,
      # which is the hand-maintained list this repository keeps removing: it
      # goes stale the day someone adds a fifth, and nothing would notice.
      #
      # The choice was made on the duplicated COST, measured on `0dbb766b2`:
      #
      #   already-covered portion   31 suites / 183 tests / 2.577s
      #   the whole tree            48 suites / 227 tests / 2.639s
      #
      # ~2.5 seconds per pull request, which is the same order as the 1.8s
      # AgentDock overlap this repository measured and deliberately kept (see
      # docs/ci/README-suite-wiring.md). A correction is owed here and is
      # recorded in the release record: the change that deferred this one
      # (PR#8074) asserted the overlap was "a different order of magnitude"
      # before the number existed. It is not. That aside conflated suite COUNT
      # with COST, and cost is what the decision turns on.
      #
      # Naming the parent is also what makes a suite added under `canvas`
      # tomorrow run the day it lands, which four pinned subdirectories would
      # not.
      - name: Run the Source canvas component suites
        run: npx jest src/components/source/canvas --no-coverage --ci

      # The direct Source core row contains 69 suites: 9 are already owned by
      # ai-surface-control-catalog.yml and 60 were not reached by any workflow.
      # The parent also contains 8 nested files, so the actual Jest command is
      # 77 suites / 736 tests. All pass unchanged.
      #
      # Naming the parent deliberately repeats the 9 owned suites. Their
      # measured cost is ~1 second (9 suites / 71 tests), while the full parent
      # is ~2.6 seconds. That bounded overlap buys automatic ownership for new
      # core and specialist tests instead of pinning a 60-file list that would
      # become stale on the next addition.
      - name: Run the Source core suites
        run: npx jest src/lib/source/__tests__ --no-coverage --ci

      # Nineteen approval and approval-adjacent route suites across thirteen
      # directories were not reached by a pull-request workflow. The narrow
      # list is deliberate: their common parents also contain unrelated route
      # trees, so naming a broad parent would hide which governed gate failed.
      - name: Run governed approval route suites
        run: >-
          npx jest --runTestsByPath
          "src/app/api/v1/programs/[programId]/pricing/__tests__/approve-route.test.ts"
          "src/app/api/v1/programs/[programId]/pricing/__tests__/estimates-route.test.ts"
          "src/app/api/v1/programs/[programId]/pricing/__tests__/config-route.test.ts"
          "src/app/api/v1/programs/[programId]/pricing/__tests__/estimate-detail-routes.test.ts"
          "src/app/(maestro)/admin/__tests__/page-source.test.ts"
          "src/app/(maestro)/admin/__tests__/cached-helpers-log-errors.test.ts"
          "src/app/(maestro)/admin/__tests__/layout-access.test.ts"
          "src/app/api/admin/programs/approvals/__tests__/_auth.test.ts"
          "src/app/api/admin/programs/approvals/__tests__/route.test.ts"
          "src/app/api/admin/pricing/rate-cards/[id]/approve/__tests__/route.test.ts"
          "src/app/api/admin/programs/approvals/export/__tests__/route.test.ts"
          "src/app/api/v1/programs/[programId]/artifacts/[artifactId]/client-approval/__tests__/route.test.ts"
          "src/app/api/v1/programs/[programId]/current-state/evidence/[evidenceId]/approve/__tests__/route.test.ts"
          "src/app/api/v1/programs/[programId]/phase-gate-approval/__tests__/route.test.ts"
          "src/app/api/v1/programs/[programId]/solution-options/approve/__tests__/route.test.ts"
          "src/app/api/v1/source/[eventId]/stage/__tests__/route.test.ts"
          "src/app/api/v1/source/[eventId]/vendor-proposals/facts/[factId]/reject/__tests__/route.test.ts"
          "src/app/api/v1/source/events/[eventId]/approve/__tests__/route.test.ts"
          "src/app/api/v1/source/events/[eventId]/request-approval/__tests__/route.test.ts"
          --no-coverage --ci

      # Source export code produces the files a user can download, so this tree
      # is a control boundary rather than a formatting convenience. Measured on
      # `4758bb8aa`: 24 suites / 250 tests pass. One suite,
      # `artifact-verdict-consistency`, is already run by the AI surface control
      # workflow; naming the parent deliberately duplicates that single suite
      # so every new export suite is owned on the day it lands.
      #
      # Two suites are called out in the release record because they govern
      # client-facing truth: the narrative quality gate blocks an unreviewed
      # RFP body, and artifact verdict consistency keeps downloadable outputs
      # aligned with the Source judgment kernel.
      - name: Run the Source export suites
        run: npx jest src/lib/source/exports/__tests__ --no-coverage --ci

      # These three steps name SUBDIRECTORIES rather than a parent, which is the
      # opposite of every step above, and the reason matters: each of these
      # parents contains red suites. Naming the parent here would wire a known
      # failure into a green command.
      #
      # It came out of a mistake worth recording. These trees had been written
      # off as "red" at TREE level, from one run of the whole parent. Checking
      # WHICH directories actually failed found the failures confined to two
      # directories in each case, with green siblings behind them:
      #
      #   src/lib/deliverables   2 red dirs of 10; 7 green subtrees, 22 suites
      #   src/components/admin   2 red dirs of  6; 3 green subtrees,  5 suites
      #   src/lib/admin          all 5 failures in one dir; ai-initiatives green
      #
      # `components/admin/tower` was in this list for one commit and has been
      # removed: the tower test-ratchet baseline (docs/ci/tower-test-baseline.json,
      # run by home-surface-guard.yml on pull_request) already names it, so
      # running it here was a duplicate. See the release record for how that was
      # missed -- the coverage census had it right and the check that doubted it
      # was the thing at fault.
      #
      # 30 suites / 348 tests, measured on `3720e95eb`, hidden behind a label
      # applied one level too high.
      #
      # Still red and still unwired, deliberately:
      #   src/lib/deliverables/__tests__/golden-regression.test.ts
      #   src/lib/deliverables/orchestrator/__tests__
      #   src/components/admin/__tests__ and components/admin/context-layer/__tests__
      #   src/lib/admin/__tests__ (5 failed of 62 suites)
      #
      # And src/lib/deliverables/synthesis is excluded for a different reason:
      # nothing outside its own tree imports its one file except the failing
      # golden-regression suite, so no production code reaches it. Running it
      # would add a number to the census without covering anything.
      #
      # Because these are pinned subdirectories, a NEW directory added under
      # any of these parents will not run here. That is the cost of the parents
      # being red, and it goes away when they are fixed: the right repair is to
      # fix those suites and collapse these lists into their parents.
      - name: Run the green deliverables subtrees
        run: >-
          npx jest
          src/lib/deliverables/decision-model
          src/lib/deliverables/planning
          src/lib/deliverables/profiles
          src/lib/deliverables/quality
          src/lib/deliverables/shared
          src/lib/deliverables/story
          src/lib/deliverables/templates
          --no-coverage --ci

      - name: Run the green admin component subtrees
        run: >-
          npx jest
          src/components/admin/agent-readiness-redesign
          src/components/admin/data-trust-redesign
          src/components/admin/setup
          --no-coverage --ci

      - name: Run the admin AI-initiatives suites
        run: npx jest src/lib/admin/ai-initiatives --no-coverage --ci

      # The data-plane write-adapter tree is 11 suites / 169 tests. Ten suites
      # were green on the first measured run; the remaining three failures in
      # one suite came from a stale Supabase read mock after the production
      # parent lookup moved to the Azure/Postgres compatibility client. The
      # repaired directory is named literally so new write-adapter suites join
      # CI on the commit that adds them.
      - name: Run the data-plane write-adapter suites
        run: npx jest src/lib/data-plane/write-adapters/__tests__ --no-coverage --ci

      # src/app/api/admin: 16 suites / 74 tests / ~0.4s, measured on
      # `4735d934f`. Twelve of its directories were reached by no workflow.
      #
      # The two files named in --testPathIgnorePatterns are a QUARANTINE, not
      # a cleanup: both are red (5 failing tests between them) and this step
      # would fail on arrival without them. Nothing forces that list to shrink
      # when they are fixed -- it is two lines with the reason beside them,
      # which is the best available here and not a guarantee.
      #
      # Naming the parent with two exclusions rather than listing ten green
      # subdirectories is the same trade made elsewhere in this file: a list
      # of directories goes stale the day an eleventh appears and nothing
      # notices, while the parent runs it on arrival. The cost is that this
      # step re-runs the four governed approval suites another step already
      # owns -- measured at 4 suites / 20 tests / 0.17s, the same order as the
      # overlaps already accepted in docs/ci/README-suite-wiring.md. Count is
      # not cost.
      #
      # `/node_modules/` is restated because passing --testPathIgnorePatterns
      # replaces jest's default rather than adding to it.
      #
      # The patterns are unquoted. Quoting them is honoured by jest and, since
      # `4735d934f`, by the coverage census too -- but unquoted stays the
      # clearer form, and it is what the census's own quarantine generators
      # emit.
      #
      # No path here contains a bracketed route segment. One that did would
      # need --runTestsByPath, because `[id]` is a character class to a jest
      # path argument -- the reason the governed approval suites are named by
      # exact path rather than swept.
      - name: Run the admin API route suites
        run: >-
          npx jest
          src/app/api/admin
          --testPathIgnorePatterns /node_modules/
          src/app/api/admin/context-layer/csv-upload
          src/app/api/admin/users/provision
          --no-coverage --ci

      - name: Refuse a new dark tree under src/__tests__
        run: npx jest --runTestsByPath src/__tests__/behaviors/unit-directory-ci-coverage.test.ts --no-coverage --ci

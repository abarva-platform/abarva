name: Tower exact schema — lab

# This lane is confined to two SHA-bound Tower migrations. It never invokes
# db:migrate:ci, which applies every pending migration in the shared database.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Explicit status (read-only) or apply (exact two Tower files)"
        required: true
        type: choice
        options:
          - status
          - apply
      confirm:
        description: "For apply, type APPLY_TOWER_ONLY exactly"
        required: false
        type: string
        default: ""
      deployed_sha:
        description: "Optional full SHA of a deployed main ancestor with unchanged Tower operator contracts"
        required: false
        type: string
        default: ""
      deployed_run_id:
        description: "Successful repo-owned ACA main deploy run ID for an explicit deployed_sha"
        required: false
        type: string
        default: ""

concurrency:
  group: aca-main-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrabarvalab001' }}
  IMAGE_REPOSITORY: ${{ vars.AZURE_WEB_IMAGE_REPOSITORY || 'abarva/web' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME || 'ca-abarva-web-lab-eastus' }}
  RESOURCE_GROUP: ${{ vars.AZURE_WEB_RESOURCE_GROUP || 'rg-abarva-controlplane-lab-eastus' }}
  AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
  AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
  AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID || '701a8554-a166-46e9-bf13-743bc50e3b20' }}
  TOWER_PROOF_ACCOUNT: stabarvaprivatedplab001
  TOWER_PROOF_CONTAINER: ecl-synthetic-intake

jobs:
  tower-schema:
    name: Exact Tower schema status or apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: db-migration-lab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Bind main workflow to the exact deployed image source
        id: ancestor
        env:
          SCHEMA_MODE: ${{ inputs.mode }}
          SCHEMA_CONFIRM: ${{ inputs.confirm }}
          REQUESTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          REQUESTED_DEPLOY_RUN_ID: ${{ inputs.deployed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Select main only" >&2; exit 1; }
          git fetch origin main
          mkdir -p audit-artifacts/tower-only-schema/public-proof
          explicit=false
          [[ -z "$REQUESTED_DEPLOYED_SHA" ]] || explicit=true
          if [[ "$explicit" == true ]]; then
            [[ "$REQUESTED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "Explicit deployed SHA requires a numeric ACA main deploy run ID" >&2; exit 1;
            }
          else
            [[ -z "$REQUESTED_DEPLOY_RUN_ID" ]] || {
              echo "Deploy run ID is only valid with an explicit deployed SHA" >&2; exit 1;
            }
          fi
          node scripts/tower/verify-deployed-schema-ancestor.mjs \
            --dispatch-sha="$GITHUB_SHA" --deployed-sha="$REQUESTED_DEPLOYED_SHA" \
            --explicit-ancestor="$explicit" \
            > audit-artifacts/tower-only-schema/public-proof/ancestor-binding.json
          deployed_sha="$(jq -r .deployed_sha audit-artifacts/tower-only-schema/public-proof/ancestor-binding.json)"
          echo "TOWER_DEPLOYED_SHA=$deployed_sha" >> "$GITHUB_ENV"
          echo "TOWER_EXPLICIT_ANCESTOR=$explicit" >> "$GITHUB_ENV"
          echo "TOWER_DEPLOY_RUN_ID=$REQUESTED_DEPLOY_RUN_ID" >> "$GITHUB_ENV"
          echo "::notice title=Tower schema mode::$SCHEMA_MODE"
          if [[ "$SCHEMA_MODE" == "apply" ]]; then
            [[ "$SCHEMA_CONFIRM" == "APPLY_TOWER_ONLY" ]] || {
              echo "Exact Tower apply confirmation is required" >&2; exit 1;
            }
          fi

      - name: Verify Azure identity configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AZURE_DEPLOY_CLIENT_ID" && -n "$AZURE_DEPLOY_TENANT_ID" && -n "$AZURE_DEPLOY_SUBSCRIPTION_ID" ]] || {
            echo "Azure OIDC configuration is incomplete" >&2; exit 1;
          }

      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Bind current main to sole 100 percent runtime digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts/tower-only-schema
          mkdir -p audit-artifacts/tower-only-schema/public-proof
          tag="main-${TOWER_DEPLOYED_SHA:0:8}"
          digest="$(az acr manifest show-metadata --registry "$ACR_NAME" \
            --name "${IMAGE_REPOSITORY}:${tag}" --query digest --output tsv)"
          [[ "$digest" == sha256:* ]] || { echo "Current main image digest is unavailable" >&2; exit 1; }
          image="${ACR_NAME}.azurecr.io/${IMAGE_REPOSITORY}@${digest}"
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --output json > audit-artifacts/tower-only-schema/containerapp.json
          az containerapp ingress traffic show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --output json > audit-artifacts/tower-only-schema/traffic.json
          revision="$(jq -r '[.[]? | select((.weight // 0) == 100)] | if length == 1 then .[0].revisionName else "" end' \
            audit-artifacts/tower-only-schema/traffic.json)"
          nonzero="$(jq -r '[.[]? | select((.weight // 0) > 0)] | length' audit-artifacts/tower-only-schema/traffic.json)"
          [[ -n "$revision" && "$nonzero" == 1 ]] || { echo "No sole 100 percent revision" >&2; exit 1; }
          az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision "$revision" --output json > audit-artifacts/tower-only-schema/revision.json
          template_image="$(jq -r '.properties.template.containers[0].image // ""' audit-artifacts/tower-only-schema/containerapp.json)"
          revision_image="$(jq -r '.properties.template.containers[0].image // ""' audit-artifacts/tower-only-schema/revision.json)"
          ready_revision="$(jq -r '.properties.latestReadyRevisionName // ""' audit-artifacts/tower-only-schema/containerapp.json)"
          [[ "$template_image" == "$image" && "$revision_image" == "$image" && "$ready_revision" == "$revision" ]] || {
            echo "Current main, template and 100 percent runtime digest differ" >&2; exit 1;
          }
          for worker in job-abarva-deliv-worker job-abarva-deliv-worker-event; do
            az containerapp job show --name "$worker" --resource-group "$RESOURCE_GROUP" \
              --output json > "audit-artifacts/tower-only-schema/${worker}.json"
            worker_image="$(jq -r '.properties.template.containers[0].image // ""' \
              "audit-artifacts/tower-only-schema/${worker}.json")"
            [[ "$worker_image" == "$image" ]] || {
              echo "Worker $worker differs from current main digest" >&2; exit 1;
            }
          done
          jq -n --arg workflow_head "$GITHUB_SHA" --arg deployed_sha "$TOWER_DEPLOYED_SHA" \
            --arg current_main "$(jq -r .current_main_sha audit-artifacts/tower-only-schema/public-proof/ancestor-binding.json)" \
            --arg image "$image" --arg revision "$revision" \
            '{workflow_head_sha:$workflow_head,deployed_sha:$deployed_sha,current_main_sha_at_bind:$current_main,image:$image,revision:$revision}' \
            > audit-artifacts/tower-only-schema/public-proof/runtime-binding.json
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify successful repo-owned deploy evidence for explicit ancestor
        if: env.TOWER_EXPLICIT_ANCESTOR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir=audit-artifacts/tower-only-schema/deployed-run
          mkdir -p "$evidence_dir"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TOWER_DEPLOY_RUN_ID}" > "$evidence_dir/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TOWER_DEPLOY_RUN_ID}/artifacts?per_page=100" \
            > "$evidence_dir/artifacts.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$TOWER_DEPLOYED_SHA" \
            --argjson run_id "$TOWER_DEPLOY_RUN_ID" '
            .id == $run_id and .repository.full_name == $repo and .head_repository.full_name == $repo and
            .head_sha == $sha and .head_branch == "main" and
            .path == ".github/workflows/aca-main-deploy.yml" and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and .conclusion == "success"' "$evidence_dir/run.json" >/dev/null || {
            echo "Explicit ancestor lacks a successful repo-owned main deploy run" >&2; exit 1;
          }
          jq -e --argjson run_id "$TOWER_DEPLOY_RUN_ID" '
            .total_count == (.artifacts | length) and
            ([.artifacts[] | select(.name == "aca-main-deploy" and .expired == false and
              .workflow_run.id == $run_id)] | length) == 1' "$evidence_dir/artifacts.json" >/dev/null || {
            echo "Successful deploy has no unique retained evidence artifact" >&2; exit 1;
          }
          gh run download "$TOWER_DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name aca-main-deploy --dir "$evidence_dir/download"
          proof="$evidence_dir/download/runtime-invariant/runtime-invariant-proof.json"
          [[ -f "$proof" ]] || { echo "Runtime invariant proof is absent" >&2; exit 1; }
          node scripts/tower/verify-deployed-run-evidence.mjs \
            "$evidence_dir/run.json" "$evidence_dir/artifacts.json" "$proof" \
            "$TOWER_DEPLOY_RUN_ID" "$TOWER_DEPLOYED_SHA" "${{ steps.image.outputs.image }}" \
            "$GITHUB_REPOSITORY" > "$evidence_dir/verified.json"
          artifact_id="$(jq -r .deploy_artifact_id "$evidence_dir/verified.json")"
          jq -n --arg workflow_head "$GITHUB_SHA" --arg deployed_sha "$TOWER_DEPLOYED_SHA" \
            --arg run_id "$TOWER_DEPLOY_RUN_ID" --arg artifact_id "$artifact_id" \
            --arg proof_sha256 "$(sha256sum "$proof" | cut -d' ' -f1)" \
            --arg image "${{ steps.image.outputs.image }}" \
            '{workflow_head_sha:$workflow_head,deployed_sha:$deployed_sha,deploy_run_id:$run_id,
              deploy_artifact_id:$artifact_id,deploy_runtime_proof_sha256:$proof_sha256,image:$image}' \
            > audit-artifacts/tower-only-schema/public-proof/deploy-evidence-binding.json

      - name: Assert private operator is idle
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job show --name job-abarva-private-operator-eus --resource-group "$RESOURCE_GROUP" \
            --output json > audit-artifacts/tower-only-schema/operator-before.json
          az containerapp job execution list --name job-abarva-private-operator-eus --resource-group "$RESOURCE_GROUP" \
            --output json > audit-artifacts/tower-only-schema/operator-executions-before.json
          nonterminal="$(jq -f scripts/tower/operator-nonterminal-executions.jq \
            audit-artifacts/tower-only-schema/operator-executions-before.json)"
          [[ "$nonterminal" == 0 ]] || { echo "Private operator has a nonterminal execution" >&2; exit 1; }
          idle="$(jq -r '[.properties.template.containers[]? | select(.name == "db-migrate") |
            (.command // [])[0]] | first // ""' audit-artifacts/tower-only-schema/operator-before.json)"
          [[ "$idle" == "/bin/true" ]] || { echo "Private operator template is not idle" >&2; exit 1; }

      - name: Resolve private proof managed identity
        id: proof-identity
        shell: bash
        run: |
          set -euo pipefail
          identity_name=id-abarva-scale-runtime-lab-eastus
          identity_json="$(az identity show --name "$identity_name" --resource-group "$RESOURCE_GROUP" --output json)"
          identity_id="$(jq -r '.id' <<< "$identity_json")"
          client_id="$(jq -r '.clientId' <<< "$identity_json")"
          [[ "$client_id" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "Private operator proof identity has no client ID" >&2; exit 1;
          }
          jq -e --arg id "$identity_id" \
            '[(.identity.userAssignedIdentities // {} | keys[]) | ascii_downcase] | index($id | ascii_downcase) != null' \
            audit-artifacts/tower-only-schema/operator-before.json >/dev/null || {
              echo "Proof identity is not attached to the private operator" >&2; exit 1;
            }
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"

      - name: Read-only exact Tower preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          deployed_input=""
          [[ "$TOWER_EXPLICIT_ANCESTOR" != true ]] || deployed_input="$TOWER_DEPLOYED_SHA"
          node scripts/tower/verify-deployed-schema-ancestor.mjs \
            --dispatch-sha="$GITHUB_SHA" --deployed-sha="$deployed_input" \
            --explicit-ancestor="$TOWER_EXPLICIT_ANCESTOR" \
            > audit-artifacts/tower-only-schema/public-proof/ancestor-before-status.json
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --idle-image "${{ steps.image.outputs.image }}" \
            --idle-verify-wait-seconds 300 \
            --script tower:schema:status-job \
            --container db-migrate \
            --env AZURE_CLIENT_ID="${{ steps.proof-identity.outputs.client_id }}" \
            --env TOWER_RELOAD_PROOF_BLOB_ACCOUNT="$TOWER_PROOF_ACCOUNT" \
            --env TOWER_RELOAD_PROOF_BLOB_CONTAINER="$TOWER_PROOF_CONTAINER" \
            --env TOWER_SCHEMA_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env TOWER_SCHEMA_MAIN_SHA="$TOWER_DEPLOYED_SHA" \
            --env TOWER_SCHEMA_IMAGE="${{ steps.image.outputs.image }}" \
            --secret-env DATABASE_URL=azure-postgres-control-database-url \
            --out-dir audit-artifacts/tower-only-schema/preflight \
            | tee audit-artifacts/tower-only-schema/preflight.log
          state=any
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            state=ready
          fi
          node scripts/tower/verify-tower-schema-proof.mjs \
            audit-artifacts/tower-only-schema/preflight/04-logs.txt status "$state" \
            | tee audit-artifacts/tower-only-schema/public-proof/preflight-receipt.txt
          jq -e '.idleVerified == true' audit-artifacts/tower-only-schema/preflight/99c-idle-verification.json
          jq '{idleVerified,problems}' audit-artifacts/tower-only-schema/preflight/99c-idle-verification.json \
            > audit-artifacts/tower-only-schema/public-proof/preflight-idle.json

      - name: Recheck runtime and operator immediately before apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          deployed_input=""
          [[ "$TOWER_EXPLICIT_ANCESTOR" != true ]] || deployed_input="$TOWER_DEPLOYED_SHA"
          node scripts/tower/verify-deployed-schema-ancestor.mjs \
            --dispatch-sha="$GITHUB_SHA" --deployed-sha="$deployed_input" \
            --explicit-ancestor="$TOWER_EXPLICIT_ANCESTOR" \
            > audit-artifacts/tower-only-schema/public-proof/ancestor-before-apply.json
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --output json \
            > audit-artifacts/tower-only-schema/containerapp-before-apply.json
          az containerapp ingress traffic show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --output json \
            > audit-artifacts/tower-only-schema/traffic-before-apply.json
          revision="$(jq -r '[.[]? | select((.weight // 0) == 100)] | if length == 1 then .[0].revisionName else "" end' \
            audit-artifacts/tower-only-schema/traffic-before-apply.json)"
          [[ -n "$revision" && "$(jq -r '.properties.latestReadyRevisionName' \
            audit-artifacts/tower-only-schema/containerapp-before-apply.json)" == "$revision" ]] || exit 1
          az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision "$revision" --output json > audit-artifacts/tower-only-schema/revision-before-apply.json
          [[ "$(jq -r '.properties.template.containers[0].image' \
            audit-artifacts/tower-only-schema/containerapp-before-apply.json)" == "${{ steps.image.outputs.image }}" &&
             "$(jq -r '.properties.template.containers[0].image' \
            audit-artifacts/tower-only-schema/revision-before-apply.json)" == "${{ steps.image.outputs.image }}" ]] || {
            echo "Live digest changed after preflight" >&2; exit 1;
          }
          for worker in job-abarva-deliv-worker job-abarva-deliv-worker-event; do
            worker_image="$(az containerapp job show --name "$worker" --resource-group "$RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' --output tsv)"
            [[ "$worker_image" == "${{ steps.image.outputs.image }}" ]] || {
              echo "Worker digest changed after preflight" >&2; exit 1;
            }
          done
          az containerapp job execution list --name job-abarva-private-operator-eus --resource-group "$RESOURCE_GROUP" \
            --output json > audit-artifacts/tower-only-schema/operator-executions-before-apply.json
          nonterminal="$(jq -f scripts/tower/operator-nonterminal-executions.jq \
            audit-artifacts/tower-only-schema/operator-executions-before-apply.json)"
          [[ "$nonterminal" == 0 ]] || { echo "Private operator is busy" >&2; exit 1; }

      - name: Apply exactly two Tower migrations
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --idle-image "${{ steps.image.outputs.image }}" \
            --idle-verify-wait-seconds 300 \
            --script tower:schema:apply-job \
            --container db-migrate \
            --env TOWER_SCHEMA_APPLY_CONFIRM=APPLY_TOWER_ONLY \
            --env AZURE_CLIENT_ID="${{ steps.proof-identity.outputs.client_id }}" \
            --env TOWER_RELOAD_PROOF_BLOB_ACCOUNT="$TOWER_PROOF_ACCOUNT" \
            --env TOWER_RELOAD_PROOF_BLOB_CONTAINER="$TOWER_PROOF_CONTAINER" \
            --env TOWER_SCHEMA_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env TOWER_SCHEMA_MAIN_SHA="$TOWER_DEPLOYED_SHA" \
            --env TOWER_SCHEMA_IMAGE="${{ steps.image.outputs.image }}" \
            --secret-env DATABASE_URL=azure-postgres-control-database-url \
            --out-dir audit-artifacts/tower-only-schema/apply \
            | tee audit-artifacts/tower-only-schema/apply.log
          node scripts/tower/verify-tower-schema-proof.mjs \
            audit-artifacts/tower-only-schema/apply/04-logs.txt apply applied \
            | tee audit-artifacts/tower-only-schema/public-proof/apply-receipt.txt
          jq -e '.idleVerified == true' audit-artifacts/tower-only-schema/apply/99c-idle-verification.json
          jq '{idleVerified,problems}' audit-artifacts/tower-only-schema/apply/99c-idle-verification.json \
            > audit-artifacts/tower-only-schema/public-proof/apply-idle.json

      - name: Independent read-only ledger and Tower schema readback
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --idle-image "${{ steps.image.outputs.image }}" \
            --idle-verify-wait-seconds 300 \
            --script tower:schema:verify-job \
            --container db-migrate \
            --env AZURE_CLIENT_ID="${{ steps.proof-identity.outputs.client_id }}" \
            --env TOWER_RELOAD_PROOF_BLOB_ACCOUNT="$TOWER_PROOF_ACCOUNT" \
            --env TOWER_RELOAD_PROOF_BLOB_CONTAINER="$TOWER_PROOF_CONTAINER" \
            --env TOWER_SCHEMA_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env TOWER_SCHEMA_MAIN_SHA="$TOWER_DEPLOYED_SHA" \
            --env TOWER_SCHEMA_IMAGE="${{ steps.image.outputs.image }}" \
            --secret-env DATABASE_URL=azure-postgres-control-database-url \
            --out-dir audit-artifacts/tower-only-schema/readback \
            | tee audit-artifacts/tower-only-schema/readback.log
          node scripts/tower/verify-tower-schema-proof.mjs \
            audit-artifacts/tower-only-schema/readback/04-logs.txt verify applied \
            | tee audit-artifacts/tower-only-schema/public-proof/readback-receipt.txt
          jq -e '.idleVerified == true' audit-artifacts/tower-only-schema/readback/99c-idle-verification.json
          jq '{idleVerified,problems}' audit-artifacts/tower-only-schema/readback/99c-idle-verification.json \
            > audit-artifacts/tower-only-schema/public-proof/readback-idle.json

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Tower-only schema run"
            echo "Mode: ${{ inputs.mode }}"
            echo "Workflow head SHA: $GITHUB_SHA"
            echo "Deployed image source SHA: ${TOWER_DEPLOYED_SHA:-unbound}"
            echo "Source and Home migrations were outside this exact apply list."
            echo "The public artifact holds redacted receipts and idle status. Full schema readback is in private Blob."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-only-schema-${{ github.run_id }}
          path: audit-artifacts/tower-only-schema/public-proof/
          if-no-files-found: warn

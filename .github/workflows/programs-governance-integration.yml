name: Programs Governance Integration

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: programs-governance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  programs-governance-integration:
    name: Programs governance integration
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Exercise governed Programs paths
        run: >-
          npx jest --runTestsByPath
          src/__tests__/integration/programs/deliverable-approval-flow.test.ts
          src/__tests__/integration/programs/phase-gate-advancement-flow.test.ts
          src/__tests__/integration/programs/phase-capture-gate-routes.test.ts
          src/__tests__/integration/programs/programs-approval-flag-mutation-guards.test.ts
          src/__tests__/integration/programs/programs-nexus-mutation-guards.test.ts
          src/__tests__/integration/programs/programs-origination-routes-guards.test.ts
          src/__tests__/integration/programs/programs-read-routes-tenant-guards.test.ts
          src/__tests__/integration/programs/programs-p6-phase-constraint.test.ts
          src/__tests__/integration/programs/programs-phase-gate-status.test.ts
          src/__tests__/integration/programs/programs-generate-route-azure-read.test.ts
          src/__tests__/integration/programs/programs-create-route.test.ts
          src/__tests__/integration/programs/programs-auth-mode-and-tenant-guards.test.ts
          src/__tests__/integration/programs/programs-mutation-routes-tenant-guards.test.ts
          src/__tests__/integration/programs/programs-detail-prog22-deliverables-canvas.test.ts
          src/__tests__/integration/programs/programs-detail-prog21-gate-drawer.test.ts
          src/__tests__/integration/programs/programs-detail-prog25-workshop-notes-plan.test.ts
          src/__tests__/integration/programs/programs-detail-p3-source-audit.test.ts
          src/__tests__/integration/programs/phase-filter-view.test.ts
          src/__tests__/integration/programs/programs-catalog-lock.test.ts
          src/__tests__/integration/programs-enhancement-seed-planner.test.ts
          --runInBand

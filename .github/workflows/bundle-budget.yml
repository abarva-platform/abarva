name: Bundle Budget

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  next-bundle-budget:
    name: Next bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next app
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:budget

      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-budget-report
          path: audit-artifacts/performance/bundle-budget.json
          retention-days: 14
          if-no-files-found: warn

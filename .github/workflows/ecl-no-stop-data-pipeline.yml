name: ECL no-stop data pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ecl-no-stop-data-pipeline.yml"
      - "docs/architecture/ECL_*.md"
      - "docs/architecture/ecl-no-stop-execution-queue.json"
      - "docs/architecture/meridian-demo-findings-*.json"
      - "docs/architecture/sql-drafts/ecl_*.sql"
      - "docs/releases/records/**"
      - "scripts/ecl/**"
  push:
    branches-ignore:
      - main
    paths:
      - ".github/workflows/ecl-no-stop-data-pipeline.yml"
      - "docs/architecture/ECL_*.md"
      - "docs/architecture/ecl-no-stop-execution-queue.json"
      - "docs/architecture/meridian-demo-findings-*.json"
      - "docs/architecture/sql-drafts/ecl_*.sql"
      - "docs/releases/records/**"
      - "scripts/ecl/**"
  workflow_dispatch:
    inputs:
      action:
        description: "proof_only runs QA and uploads artifacts. auto_merge_pr merges a PR only after proof passes and confirm_merge=MERGE."
        required: true
        type: choice
        options:
          - proof_only
          - auto_merge_pr
        default: proof_only
      pr_number:
        description: "Required only for action=auto_merge_pr."
        required: false
        type: string
        default: ""
      confirm_merge:
        description: "Required for action=auto_merge_pr: type MERGE exactly."
        required: false
        type: string
        default: ""
      run_release_check:
        description: "Run npm release:check before auto-merge."
        required: true
        type: boolean
        default: true

concurrency:
  group: ecl-no-stop-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  proof:
    name: Local ECL proof and QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python workbook dependency
        run: python3 -m pip install openpyxl

      - name: Install disposable Postgres tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_bin="$(find /usr/lib/postgresql -path '*/bin/initdb' -print | sort -V | tail -1)"
          if [[ -z "$pg_bin" ]]; then
            echo "initdb not found after installing Postgres." >&2
            exit 1
          fi
          pg_bin="$(dirname "$pg_bin")"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" --version
          "$pg_bin/pg_ctl" --version
          "$pg_bin/psql" --version

      - name: Compile ECL proof scripts
        run: |
          python3 -m py_compile \
            scripts/ecl/run_no_stop_execution_queue.py \
            scripts/ecl/validate_no_stop_execution_queue.py \
            scripts/ecl/validate_ecl_operator_status_report.py \
            scripts/ecl/land_source_excel_workbooks.py \
            scripts/ecl/validate_source_excel_raw_landing.py \
            scripts/ecl/generate_dense_source_room_extracts.py \
            scripts/ecl/validate_dense_source_room_extracts.py \
            scripts/ecl/load_client_intake_applications_layer.py \
            scripts/ecl/write_dense_source_room_ecl_producer_coverage.py \
            scripts/ecl/load_dense_source_room_source_layer.py \
            scripts/ecl/load_dense_source_room_context_layer.py \
            scripts/ecl/load_dense_source_room_commercial_layer.py \
            scripts/ecl/load_dense_source_room_review_layer.py \
            scripts/ecl/load_dense_source_room_source_projection_layer.py \
            scripts/ecl/load_dense_source_room_cube_layer.py

      - name: Reconcile ECL projection schema at named ref
        env:
          ECL_RECONCILE_REF: ${{ github.sha }}
        run: |
          npm run test:ecl-projection-schema-reconciliation

      - name: Prove demo findings source contract
        run: |
          npm run test:ecl-demo-findings-source-contract

      - name: Prove client intake application adapter
        run: |
          npm run test:ecl-client-intake-application-adapter

      - name: Prove ECL source file origin upgrade
        run: |
          npm run test:ecl-source-file-origin-upgrade

      - name: Prove dense source-room plausibility gates
        run: |
          npm run test:ecl-dense-source-room-stride-gate

      - name: Run no-stop ECL execution queue
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python3 scripts/ecl/run_no_stop_execution_queue.py

      - name: Validate no-stop ECL execution queue
        run: |
          python3 scripts/ecl/validate_no_stop_execution_queue.py

      - name: Validate final operator status report
        run: |
          python3 scripts/ecl/validate_ecl_operator_status_report.py

      - name: Assert dense all-layer local proof counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          queue = read('outputs/ecl-no-stop-queue-validation/validation-summary.json')
          execution = read('outputs/ecl-no-stop-execution-run/execution-summary.json')
          operator = read('outputs/ecl-no-stop-execution-run/operator-status-validation-summary.json')
          raw = read('reports/source-excel-raw-landing-2026-08-23/source_excel_raw_landing_summary.json')
          dense = read('outputs/source-room-depth-catchup-2026-08-23/dense_source_room_summary.json')
          producers = read('reports/ecl-source-room-producer-coverage-2026-08-23/ecl_source_room_producer_coverage_summary.json')
          source = read('reports/ecl-dense-source-layer-local-load-2026-08-23/dense_source_room_ecl_source_load_summary.json')
          context = read('reports/ecl-dense-context-layer-local-load-2026-08-23/dense_source_room_ecl_context_load_summary.json')
          commercial = read('reports/ecl-dense-commercial-layer-local-load-2026-08-23/dense_source_room_ecl_commercial_load_summary.json')
          review = read('reports/ecl-dense-review-layer-local-load-2026-08-23/dense_source_room_ecl_review_load_summary.json')
          projection = read('reports/ecl-dense-source-projection-local-load-2026-08-23/dense_source_room_ecl_source_projection_load_summary.json')
          cube = read('reports/ecl-dense-cube-layer-local-load-2026-08-23/dense_source_room_ecl_cube_load_summary.json')

          failures = []
          if not queue.get('accepted'):
              failures.append(f'queue validation failed: {queue}')
          if queue.get('slice_count') != 16:
              failures.append(f'queue slice count={queue.get("slice_count")}, expected 16')
          if queue.get('auto_proceed_slice_count') != 12:
              failures.append(f'auto-proceed slices={queue.get("auto_proceed_slice_count")}, expected 12')
          if queue.get('blocked_slice_count') != 4:
              failures.append(f'hard-gated slices={queue.get("blocked_slice_count")}, expected 4')
          if not execution.get('accepted'):
              failures.append(f'queue execution failed: {execution}')
          if execution.get('passed_executable_slice_count') != 12 or execution.get('executable_slice_count') != 12:
              failures.append(f'executable slices={execution.get("passed_executable_slice_count")}/{execution.get("executable_slice_count")}, expected 12/12')
          if not operator.get('accepted'):
              failures.append(f'operator status failed: {operator}')
          if operator.get('completion_percent') != 100:
              failures.append(f'operator completion={operator.get("completion_percent")}, expected 100')

          raw_expected = {
              'expected_workbooks': 14,
              'landed_workbooks': 14,
              'source_room_extracts': 12,
              'traceability_rows': 2749,
              'blocking_gaps': 0,
          }
          for key, expected in raw_expected.items():
              if raw.get(key) != expected:
                  failures.append(f'raw {key}={raw.get(key)}, expected {expected}')

          dense_expected = {
              'extract_count': 14,
              'row_count': 7080,
              'field_dictionary_rows': 231,
          }
          for key, expected in dense_expected.items():
              if dense.get(key) != expected:
                  failures.append(f'dense {key}={dense.get(key)}, expected {expected}')
          if dense.get('client_attestation_state') != 'not_client_attested':
              failures.append('dense source room must remain not_client_attested')

          producer_expected = {
              'table_count': 36,
              'source_family_count': 14,
              'dense_source_rows': 7080,
              'source_supplied_tables': 11,
              'partial_source_supplied_tables': 3,
              'downstream_builder_required_tables': 21,
              'missing_core_producer_count': 0,
          }
          for key, expected in producer_expected.items():
              if producers.get(key) != expected:
                  failures.append(f'producer {key}={producers.get(key)}, expected {expected}')

          source_readback = source.get('readback', {})
          source_expected = {
              'source_file': 14,
              'source_record': 7080,
              'document': 720,
              'document_extraction': 250,
              'extraction_distinct_spans': 250,
              'client_attested_rows': 0,
          }
          for key, expected in source_expected.items():
              if source_readback.get(key) != expected:
                  failures.append(f'source readback {key}={source_readback.get(key)}, expected {expected}')

          context_readback = context.get('readback', {})
          context_expected = {
              'object': 3825,
              'application': 750,
              'application_deployment': 1650,
              'vendor': 215,
              'data_platform': 263,
              'infrastructure': 220,
              'relationship': 8972,
              'deployment_of': 1650,
              'hosted_on': 1650,
              'integrates_with': 972,
              'metric_definition': 127,
              'measure': 13190,
              'relationship_endpoint_drift': 0,
              'measure_metric_drift': 0,
          }
          for key, expected in context_expected.items():
              if context_readback.get(key) != expected:
                  failures.append(f'context readback {key}={context_readback.get(key)}, expected {expected}')

          commercial_readback = commercial.get('readback', {})
          commercial_expected = {
              'contract': 230,
              'contract_service_line': 230,
              'contract_scope': 690,
              'invoice_line': 480,
              'sla_observation': 260,
              'contract_vendor_drift': 0,
              'contract_scope_object_drift': 0,
              'sla_metric_drift': 0,
          }
          for key, expected in commercial_expected.items():
              if commercial_readback.get(key) != expected:
                  failures.append(f'commercial readback {key}={commercial_readback.get(key)}, expected {expected}')

          review_readback = review.get('readback', {})
          review_expected = {
              'review_event': 658,
              'review_contract_subjects': 277,
              'review_invoice_subjects': 120,
              'review_sla_subjects': 260,
              'review_context_pack_subjects': 1,
              'review_source_record_drift': 0,
              'review_contract_drift': 0,
              'review_invoice_drift': 0,
              'review_sla_drift': 0,
          }
          for key, expected in review_expected.items():
              if review_readback.get(key) != expected:
                  failures.append(f'review readback {key}={review_readback.get(key)}, expected {expected}')

          projection_readback = projection.get('readback', {})
          projection_expected = {
              'projection_manifest': 7,
              'source_contract_360': 230,
              'source_vendor_360': 101,
              'source_value_levers': 230,
              'source_event_workspace': 173,
              'source_value_claimable_rows': 0,
              'source_value_gated_rows': 230,
              'contract_projection_contract_drift': 0,
              'vendor_projection_vendor_drift': 0,
              'value_lever_metric_drift': 0,
              'event_review_drift': 0,
              'event_rows_without_evidence_payload': 0,
          }
          for key, expected in projection_expected.items():
              if projection_readback.get(key) != expected:
                  failures.append(f'projection readback {key}={projection_readback.get(key)}, expected {expected}')

          cube_readback = cube.get('readback', {})
          cube_expected = {
              'cube_manifest': 9,
              'cube_slice': 29,
              'cube_slice_metric': 103,
              'cube_slice_measure': 4320,
              'cube_key_count': 9,
              'cube_metric_drift': 0,
              'cube_measure_drift': 0,
              'json_metric_without_fk': 0,
              'blocked_without_gap': 0,
          }
          for key, expected in cube_expected.items():
              if cube_readback.get(key) != expected:
                  failures.append(f'cube readback {key}={cube_readback.get(key)}, expected {expected}')

          for label, summary in [('context', context), ('commercial', commercial), ('review', review), ('projection', projection), ('cube', cube)]:
              if any(not row.get('rejected') for row in summary.get('planted_failures', [])):
                  failures.append(f'{label} planted failure did not reject')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)

          print(json.dumps({
              'queue_slices': queue.get('slice_count'),
              'queue_passed': execution.get('passed_executable_slice_count'),
              'raw_workbooks': raw.get('landed_workbooks'),
              'dense_source_rows': dense.get('row_count'),
              'context_objects': context_readback.get('object'),
              'relationships': context_readback.get('relationship'),
              'contracts': commercial_readback.get('contract'),
              'source_contract_360': projection_readback.get('source_contract_360'),
              'cube_keys': cube_readback.get('cube_key_count'),
              'hard_gates': queue.get('blocked_slice_count'),
          }, indent=2, sort_keys=True))
          PY

      - name: Package proof artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts/ecl-no-stop-data-pipeline
          tar -czf audit-artifacts/ecl-no-stop-data-pipeline/ecl-no-stop-proof.tgz \
            reports/source-excel-raw-landing-2026-08-23 \
            outputs/source-room-depth-catchup-2026-08-23 \
            reports/ecl-source-room-producer-coverage-2026-08-23 \
            reports/ecl-dense-source-layer-local-load-2026-08-23 \
            reports/ecl-dense-context-layer-local-load-2026-08-23 \
            reports/ecl-dense-commercial-layer-local-load-2026-08-23 \
            reports/ecl-dense-review-layer-local-load-2026-08-23 \
            reports/ecl-dense-source-projection-local-load-2026-08-23 \
            reports/ecl-dense-cube-layer-local-load-2026-08-23 \
            outputs/ecl-no-stop-execution-run \
            outputs/ecl-no-stop-queue-validation \
            docs/architecture/ecl-no-stop-execution-queue.json
          shasum -a 256 audit-artifacts/ecl-no-stop-data-pipeline/ecl-no-stop-proof.tgz \
            | tee audit-artifacts/ecl-no-stop-data-pipeline/ecl-no-stop-proof.sha256

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ecl-no-stop-proof-${{ github.run_id }}
          path: audit-artifacts/ecl-no-stop-data-pipeline/
          if-no-files-found: error

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'auto_merge_pr' && inputs.run_release_check }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run release control gate
        run: npm run release:check -- --base origin/main --head HEAD

  auto-merge:
    name: Explicitly confirmed PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - proof
      - release-check
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.action == 'auto_merge_pr' }}

    steps:
      - name: Enforce merge gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.proof.result }}" != "success" ]]; then
            echo "Proof job did not pass: ${{ needs.proof.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs['release-check'].result }}" != "success" && "${{ needs['release-check'].result }}" != "skipped" ]]; then
            echo "Release check did not pass: ${{ needs['release-check'].result }}" >&2
            exit 1
          fi
          if [[ -z "${{ inputs.pr_number }}" ]]; then
            echo "pr_number is required for action=auto_merge_pr." >&2
            exit 1
          fi
          if [[ "${{ inputs.confirm_merge }}" != "MERGE" ]]; then
            echo "confirm_merge must be exactly MERGE." >&2
            exit 1
          fi

      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ inputs.pr_number }}" \
            --repo abarva-platform/abarva \
            --squash \
            --delete-branch

      - name: Deploy handoff
        shell: bash
        run: |
          cat <<'EOF'
          PR merge completed. Shared ACA deployment is intentionally not performed here.
          A push to main triggers .github/workflows/aca-main-deploy.yml, which owns image build,
          digest pinning, revision health, traffic shift, and deploy evidence.
          EOF

name: Coverage Threshold

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  behavior-coverage:
    name: Behavior coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run behavior coverage gate
        run: npm run coverage:behavior-gate

      - name: Check agent answer provenance affordances
        run: >-
          npx jest src/components/agent/__tests__/AgentDock.test.tsx
          --runInBand
          -t 'marks agent turns as AI drafts|shows a citation gap for substantive uncited agent text without evidence context|does not show a citation gap when the surface carries usable evidence context'

      - name: Check the dock renders structured response parts
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentDock.structured-parts.test.tsx --runInBand

      # Backlog item T-003. The behaviour suite above already drives this
      # sweep, but it fails as one jest case among many. Running it as its
      # own step means an unreachable comparison names itself in the job log.
      - name: Check enum comparisons against their CHECK constraints
        run: npm run audit:enum-reachability

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-coverage-summary
          path: coverage/behavior-gate/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

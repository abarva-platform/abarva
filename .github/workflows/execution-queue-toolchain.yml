name: Execution queue toolchain

on:
  pull_request:
    paths:
      - ".github/workflows/execution-queue-toolchain.yml"
      - "scripts/exec/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Execution queue behavioral contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the execution queue behavioral contract
        run: node scripts/exec/build-execution-queue.test.mjs

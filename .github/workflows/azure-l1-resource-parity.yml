name: Azure L1 resource parity

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on unexpected resources as well as missing resources.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  resource-parity:
    name: Verify expected Azure lab resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_LAB_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_LAB_TENANT_ID }}
          subscription-id: 701a8554-a166-46e9-bf13-743bc50e3b20

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run L1 resource parity audit
        run: |
          set -euo pipefail

          args=()
          if [ "${{ inputs.strict }}" = "true" ]; then
            args+=(--strict)
          fi

          npm run azure:resource:parity -- "${args[@]}" | tee azure-l1-resource-parity.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-l1-resource-parity
          path: azure-l1-resource-parity.json
          if-no-files-found: ignore

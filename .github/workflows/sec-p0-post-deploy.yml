name: SEC-P0 cross-tenant probes (post-deploy)

# Runs the audit B-agent's pen-test playbook against any deployed
# environment to assert the 8 SEC-P0 cross-tenant routes still return
# 403 forbidden_cross_tenant on tenant-A → tenant-B probes.
#
# Triggers:
#   - workflow_dispatch (manual; pick the environment)
#   - On schedule (nightly; against production by default)
#   - Optionally: post-deployment_status from Vercel (commented; enable
#     when the deployment-status webhook is wired)
#
# Required repository secrets for scheduled production probes:
#   PRODUCTION_BASE_URL           e.g. https://app.abarva.ai
#   PRODUCTION_APEX_SESSION       __session cookie value for an Apex CIO
#   PRODUCTION_APEX_COOKIE_HEADER full browser Cookie header for Apex (alternative to session)
#   PRODUCTION_MERIDIAN_CLIENT_ID Meridian's client UUID (the "other" tenant)
#
# Optional staging secrets for manual workflow_dispatch:
#   STAGING_BASE_URL           e.g. https://staging.abarva.ai
#   STAGING_APEX_SESSION       __session cookie value for an Apex CIO
#   STAGING_APEX_COOKIE_HEADER full browser Cookie header for Apex (alternative to session)
#   STAGING_MERIDIAN_CLIENT_ID Meridian's client UUID (the "other" tenant)
#
# Optional Azure lab secrets:
#   AZURE_LAB_BASE_URL                 e.g. https://ca-abarva-web-lab-eastus.<region>.azurecontainerapps.io
#   AZURE_LAB_APEX_SESSION             __session cookie value minted against the Azure lab host
#   AZURE_LAB_APEX_COOKIE_HEADER       full browser Cookie header minted against the Azure lab host
#   AZURE_LAB_MERIDIAN_CLIENT_ID       Meridian's client UUID in the Azure lab DB
#   AZURE_LAB_MERIDIAN_CLIENT_KEY      defaults to meridian-health
#   AZURE_LAB_KNOWN_MERIDIAN_TURN_ID   optional known Meridian turn for SEC-P0-7
#
# Exit code:
#   0  all 8 SEC-P0 probes returned 403/400/404 (success)
#   1  one or more probes returned anything else (P0 incident → page founder)
#
# Backlog: A1 expansion · post-deploy regression gate.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to probe"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - azure-lab
          - production
  schedule:
    # 03:00 UTC nightly against production. Staging remains available via
    # workflow_dispatch when staging probe secrets are configured.
    - cron: "0 3 * * *"

jobs:
  probe:
    name: SEC-P0 cross-tenant probes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve environment URLs
        id: env
        run: |
          target="${{ inputs.environment || 'production' }}"
          case "$target" in
            production)
              base_url="${{ secrets.PRODUCTION_BASE_URL }}"
              session="${{ secrets.PRODUCTION_APEX_SESSION }}"
              cookie_header="${{ secrets.PRODUCTION_APEX_COOKIE_HEADER }}"
              other_id="${{ secrets.PRODUCTION_MERIDIAN_CLIENT_ID }}"
              other_key="${{ secrets.PRODUCTION_MERIDIAN_CLIENT_KEY }}"
              known_turn="${{ secrets.PRODUCTION_KNOWN_MERIDIAN_TURN_ID }}"
              ;;
            azure-lab)
              base_url="${{ secrets.AZURE_LAB_BASE_URL }}"
              session="${{ secrets.AZURE_LAB_APEX_SESSION }}"
              cookie_header="${{ secrets.AZURE_LAB_APEX_COOKIE_HEADER }}"
              other_id="${{ secrets.AZURE_LAB_MERIDIAN_CLIENT_ID }}"
              other_key="${{ secrets.AZURE_LAB_MERIDIAN_CLIENT_KEY }}"
              known_turn="${{ secrets.AZURE_LAB_KNOWN_MERIDIAN_TURN_ID }}"
              ;;
            staging)
              base_url="${{ secrets.STAGING_BASE_URL }}"
              session="${{ secrets.STAGING_APEX_SESSION }}"
              cookie_header="${{ secrets.STAGING_APEX_COOKIE_HEADER }}"
              other_id="${{ secrets.STAGING_MERIDIAN_CLIENT_ID }}"
              other_key="${{ secrets.STAGING_MERIDIAN_CLIENT_KEY }}"
              known_turn="${{ secrets.STAGING_KNOWN_MERIDIAN_TURN_ID }}"
              ;;
            *)
              echo "Unknown probe environment: $target" >&2
              exit 2
              ;;
          esac

          other_key="${other_key:-meridian-health}"

          if [[ -z "$base_url" || -z "$other_id" || ( -z "$session" && -z "$cookie_header" ) ]]; then
            echo "Missing SEC-P0 probe secrets for $target. Required: BASE_URL, MERIDIAN_CLIENT_ID, and one of APEX_SESSION or APEX_COOKIE_HEADER." >&2
            exit 2
          fi

          echo "::add-mask::$session"
          echo "::add-mask::$cookie_header"
          echo "BASE_URL=$base_url" >> "$GITHUB_OUTPUT"
          echo "SESSION=$session" >> "$GITHUB_OUTPUT"
          echo "COOKIE_HEADER=$cookie_header" >> "$GITHUB_OUTPUT"
          echo "OTHER_ID=$other_id" >> "$GITHUB_OUTPUT"
          echo "OTHER_KEY=$other_key" >> "$GITHUB_OUTPUT"
          echo "KNOWN_TURN=$known_turn" >> "$GITHUB_OUTPUT"

      - name: Run SEC-P0 probe suite
        env:
          ABARVA_PROBE_BASE_URL: ${{ steps.env.outputs.BASE_URL }}
          ABARVA_PROBE_SESSION: ${{ steps.env.outputs.SESSION }}
          ABARVA_PROBE_COOKIE_HEADER: ${{ steps.env.outputs.COOKIE_HEADER }}
          ABARVA_PROBE_OTHER_TENANT_ID: ${{ steps.env.outputs.OTHER_ID }}
          ABARVA_PROBE_OTHER_TENANT_KEY: ${{ steps.env.outputs.OTHER_KEY }}
          ABARVA_PROBE_KNOWN_OTHER_TURN: ${{ steps.env.outputs.KNOWN_TURN }}
        run: bash tests/security/sec-p0-cross-tenant-probes.sh

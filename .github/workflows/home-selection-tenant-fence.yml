name: Home selection tenant fence

# Runs the real Home reader against a disposable Postgres holding two tenants.
#
# The trigger list is what the suite loads and applies, not a guess: the suite
# reads this file and fails when a repository module it loaded, a migration it
# applied, or a path named here that no longer exists is out of step with the
# list below. Add a path here in the same change that makes the reader load it.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/home-selection-tenant-fence.yml"
      - "scripts/ecl/__tests__/test_home_selection_tenant_fence.ts"
      - "datasets/tenant-inputs/tenant-input-registry.json"
      - "scripts/data-build/segment-spine.ts"
      - "src/lib/auth/agent-client-logins.ts"
      - "src/lib/client-config.ts"
      - "src/lib/data-plane/azureRead.ts"
      - "src/lib/data-plane/read-adapters/azureSession.ts"
      - "src/lib/data-plane/tenantConnectionResolver.ts"
      - "src/lib/ecl/denseAssessment.ts"
      - "src/lib/home/preview/bundle-normalization.ts"
      - "src/lib/home/preview/ecl-dependency-proof.ts"
      - "src/lib/home/preview/ecl-enterprise-context.ts"
      - "src/lib/home/preview/ecl-projection-bundle.ts"
      - "src/lib/home/preview/golden-snapshot.ts"
      - "src/lib/home/preview/home-assessment-selection.ts"
      - "src/lib/home/preview/home-narrative-packet.ts"
      - "src/lib/home/preview/home-projection-fault.ts"
      - "src/lib/home/preview/projection-row-payload.ts"
      - "src/lib/observability/structured-logger.ts"
      - "src/lib/tenant/aliases.ts"
      - "src/lib/tenant/declared-synthetic-tenant.ts"
      - "supabase/migrations/20260831031000_ecl_substrate_baseline.sql"
      - "supabase/migrations/20260901090000_home_serving_views_intake_families.sql"
      - "supabase/migrations/20260902090000_home_serving_view_executive_interviews.sql"
      - "supabase/migrations/20260902100000_home_serving_view_relationships.sql"
      - "supabase/migrations/20261002013000_home_active_assessment.sql"
      - "supabase/migrations/20261002060000_home_active_assessment_tenant_fk.sql"
      - "src/lib/home/preview/golden-snapshots/**"
  workflow_dispatch:

jobs:
  tenant-fence:
    name: Home selection tenant fence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecl_admission_test
          POSTGRES_USER: ecl_test
          POSTGRES_PASSWORD: ecl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecl_test -d ecl_admission_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hold the Home tenant fence against a disposable Postgres
        env:
          NODE_OPTIONS: --conditions=react-server
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: npx tsx scripts/ecl/__tests__/test_home_selection_tenant_fence.ts

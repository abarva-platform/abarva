# Hygiene Gate CI Contract — OPS14
# Runs hygiene_gate.sh on every PR to enforce integration hygiene.
# Non-destructive: never modifies the working tree, never pushes, never pops stashes.

name: Hygiene Gate

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # Allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip TypeScript build check (faster)"
        required: false
        default: "false"
        type: boolean

jobs:
  hygiene-gate:
    name: Run hygiene_gate.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # shellcheck is preinstalled on ubuntu-latest. `bash -n` catches syntax
      # and nothing else, and three of the last four defects in this script
      # family were shell semantics: a pipe swallowing an exit status, a
      # substring test standing in for a comparison, a variable hiding a path
      # from a resolver. Every one was found by a person noticing a
      # construction.
      #
      # This starts clean rather than with a waiver list. Measured before it
      # was proposed: 15 shell files under scripts/, 0 errors, 2 warnings, 6
      # findings in total, and all six were fixed or answered rather than
      # baselined. A gate that arrives already failing teaches people to
      # ignore it.
      #
      # -x so a sourced sibling is followed instead of reported as unreadable.
      - name: Shellcheck scripts/
        run: |
          shellcheck --version
          find scripts -name '*.sh' -type f -print0 | xargs -0 shellcheck -x

      - name: Make hygiene gate executable
        run: chmod +x scripts/integration/hygiene_gate.sh

      - name: Run hygiene gate (full)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build == 'false' }}
        run: bash scripts/integration/hygiene_gate.sh

      - name: Run hygiene gate (skip-build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_build == 'true' }}
        run: bash scripts/integration/hygiene_gate.sh --skip-build

      - name: Upload hygiene gate output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hygiene-gate-output
          path: |
            docs/build/build-slices.json
            docs/build/build-waves.json
            docs/build/production-readiness.json
          retention-days: 7
          if-no-files-found: warn

      # THIRTEEN of T-556's fifteen are wired here, not fifteen. Two are held
      # out, and deliberately so: in both cases an EARLIER record already
      # quarantines the file for a reason T-556 did not read, and wiring past a
      # stated reason on the strength of "it is green" is the shape of defect
      # this backlog exists to stop. Both are filed as T-599.
      #
      # 1. `(maestro)/source/__tests__/tenant-resolution-source-contract.test.tsx`.
      #    `docs/releases/records/2026-09-21-source-readiness-route-suite-ownership.md`
      #    holds it unwired "until it is green, derives expectations from the
      #    chosen canonical tenant authority, and proves opposite-tenant
      #    refusal". Only the first third is discharged: the suite was rewritten
      #    to render rather than scan source text and it is green, but it
      #    derives from neither of the two `CANONICAL_TENANT_KEYS` exports, and
      #    its strongest isolation case proves an UNRESOLVED tenant fails
      #    closed — not that one tenant is refused another's data.
      #
      # 2. The legacy-compatibility database client's suite under
      #    `src/lib/__tests__/` — named exactly in the `WITHHELD` constant of
      #    the guard suite, which this file may not repeat, for the reason that
      #    follows. The record that wired its siblings,
      #    `2026-09-20-wire-governance-tenant-green-suites.md`, left it out
      #    because "the architecture gate rejects newly owned legacy client
      #    dependencies". That reason is live, not stale, and it was measured
      #    rather than taken on trust: adding the step and running
      #    `npm run audit:architecture-rules` returns one violation of
      #    `NO_SUPABASE_RUNTIME` against this workflow file. The rule is a line
      #    scan over `.github/workflows`, so the step could not be added here
      #    even to be quarantined — which is also why the paragraph above
      #    describes the path instead of printing it. A required check forbids
      #    it; this one is not a judgement call at all.

      # The agent-runtime unit directory, named ONCE (T-743).
      #
      # Three files from this directory used to be named here, and the step said
      # why: sweeping the directory would have picked up "unrelated untriaged
      # debt this item did not measure". That was true when it was written and
      # it is no longer, so the reason is discharged rather than dropped —
      # T-742 executed 19 of the 28 unrun suites individually and recorded
      # `wire_into_ci` for every one, T-743 executed the remaining 9 the same
      # way (73 tests, 73 passed), and the directory then ran as a unit: 33
      # suites, 592 tests, 592 passed, under a second.
      #
      # Naming the directory rather than its files is the whole point. Five of
      # 33 suites here were reached by CI and 28 by nothing, with no quarantine
      # declared against any of them — nobody chose that, it is what named-file
      # wiring does to every file added after the command was written. This
      # workflow runs on every pull request with no `paths:` filter, so a suite
      # added tomorrow is reached without editing anything.
      #
      # Jest reads a bare path argument as a regex, so this also selects any
      # sibling whose name STARTS with `__tests__`; there is none, and

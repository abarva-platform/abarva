name: AI Surface Control Catalog

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-surface-control-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-surface-control-catalog:
    name: AI surface control catalog
    runs-on: ubuntu-latest
    # Raised from 5 with the Programs unit suites (T-004). The five most recent
    # runs of this job took 135s, 138s, 147s, 218s and 281s against the old
    # 300s ceiling, so the job was already finishing within seconds of a
    # timeout on its slowest runs and one more step would have tipped it into
    # failing for a reason that has nothing to do with the controls it guards.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Check AI surface controls
        run: npm run audit:ai-surface-controls

      - name: Exercise visible agent stream controls
        run: npx jest src/app/api/chat/agent/__tests__/agent-visible-stream-controls.test.ts --runInBand

      - name: Exercise agent phase-advance approval gate
        run: npx jest src/lib/agent/tools/program/__tests__/advancePhase.approval-gate.test.ts --runInBand

      - name: Exercise Source external-action gate
        run: npx jest src/app/api/v1/source/work-items/__tests__/external-action-gate.test.ts --runInBand

      - name: Exercise Moves phase-advance approval gate
        # --runTestsByPath: jest reads a bare pattern as a regex, and the
        # literal brackets in [programId] are a character class that matches
        # nothing. The step passed locally and found no tests in CI.
        run: npx jest --runTestsByPath "src/app/api/v1/programs/[programId]/advance/__tests__/approval-gate.test.ts" --runInBand

      - name: Exercise Intelligence promotion approval gate
        run: npx jest --runTestsByPath src/lib/programs/__tests__/origination-submit.promotion-gate.test.ts --runInBand

      - name: Exercise Moves phase-gate route approval
        run: npx jest --runTestsByPath src/app/api/programs/phase-gate/__tests__/approval-gate.test.ts --runInBand

      - name: Exercise Intelligence gate-waiver decision controls
        run: npx jest --runTestsByPath src/app/api/reasoning/gate-waiver/__tests__/route.controls.test.ts --runInBand

      - name: Exercise Tower portfolio upload non-approval boundary
        run: npx jest --runTestsByPath src/app/api/tower/upload/__tests__/route.test.ts --runInBand

      - name: Exercise renewal cockpit external action
        run: npx jest --runTestsByPath src/components/source/__tests__/RenewalCockpitActionBar.external-action.test.tsx --runInBand

      - name: Exercise Source estimate assumption disclosure
        run: npx jest --runTestsByPath src/components/source/__tests__/RenewalCockpitView.estimate-disclosure.test.tsx --runInBand

      - name: Exercise deliverable approval actions
        run: npx jest --runTestsByPath src/components/deliverables/__tests__/ApproveActions.controls.test.tsx --runInBand

      - name: Exercise Source approval queue controls
        run: npx jest --runTestsByPath src/components/source/__tests__/AdminSourceEventApprovalQueue.controls.test.tsx --runInBand

      - name: Exercise Source canonical artifact render approval gate
        run: npx jest --runTestsByPath "src/app/api/v1/source/[eventId]/artifacts/[artifactCode]/render/__tests__/route.test.ts" --runInBand

      - name: Exercise Source governed artifact download approval gate
        run: npx jest --runTestsByPath "src/app/api/v1/source/artifacts/[artifactId]/download/__tests__/route.test.ts" --runInBand

      - name: Exercise Moves phase-advance button
        run: npx jest --runTestsByPath src/components/programs/__tests__/PhaseAdvanceButton.controls.test.tsx --runInBand

      - name: Exercise Moves decision evidence packet
        run: npx jest --runTestsByPath src/lib/programs/__tests__/moves-ai-liability.decision-packet.test.ts --runInBand

      - name: Exercise agent response disclosure controls
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentResponse.controls.test.tsx --runInBand

      # The `citation` control of the same surface. It is a separate suite
      # because it needs `@/lib/agent/markdownRenderer` mocked, and the suite
      # above deliberately runs with the repo-wide react-markdown passthrough
      # so its four other controls are proven against the component as
      # everything else renders it.
      - name: Exercise agent response citation resolution
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentResponse.citation-control.test.tsx --runInBand

      # Full suite: backlog T-015 closed the former pin-top and structured
      # artifact exemptions, so the catalog can now gate the whole dock file.
      - name: Exercise agent dock responsibility and approval notices
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentDock.test.tsx --runInBand

      - name: Exercise Atlas drawer disclosure controls
        run: npx jest --runTestsByPath src/components/shell/__tests__/AtlasDrawer.controls.test.tsx --runInBand

      - name: Exercise Moves deliverable canvas disclosure controls
        run: npx jest --runTestsByPath src/lib/programs/__tests__/deliverable-canvas-polish-view.controls.test.ts --runInBand

      - name: Exercise programs gate approval modal
        run: npx jest --runTestsByPath src/components/programs/__tests__/ProgramDetailPage.gate-approval.controls.test.tsx --runInBand

      # Not a catalog control. These two suites guard the Source artifact verdict
      # contract — that the deal pack, the CXO report and its HTML/PPTX renders
      # all state the verdict the expert-judgment kernel returned. They ran in no
      # CI job, and one of them sat red for weeks while a sibling expectation was
      # rewritten to agree with the defect. See backlog items 26 / 66 / 77.
      - name: Exercise Source artifact verdict consistency
        run: npx jest --runTestsByPath src/lib/source/exports/__tests__/artifact-verdict-consistency.test.ts src/lib/source/exports/cxo-report/__tests__/source-cxo-narrative-report.test.ts --runInBand

      # Not a catalog control. This suite drives the real Source canvas ask
      # handler and asserts that the payload the canvas renders describes the
      # answer it is showing. It is deliberately NOT under
      # `src/__tests__/behaviors`: the behavior coverage floor measures over
      # whatever those suites load, and driving a real route pulls that route's
      # largely unexercised dependency graph into the denominator — measured at
      # 93.44% without this suite and 77.73% with it. Wiring it here keeps the
      # floor honest and keeps the suite running. See backlog item 82.
      - name: Exercise Source canvas model answer payload
        run: npx jest --runTestsByPath "src/app/api/v1/source/[eventId]/nexus/ask/__tests__/canvas-model-answer-payload.test.ts" --runInBand

      # Not a catalog control. This suite drives the shared evidence-packet
      # validator, which checked every field the product writes and not the one
      # field a human writes: the rationale minimum was enforced per-surface at
      # the two Moves builders, so a new decision surface had to remember it.
      # See backlog item 63.
      - name: Exercise shared evidence packet human rationale
        run: npx jest --runTestsByPath src/lib/ai-liability/__tests__/human-decision-controls.human-rationale.test.ts --runInBand

      # The shared rationale validator above already owns one file in this
      # directory. Run the remaining liability controls as a parent so new
      # audit/export, acknowledgment, training, and policy tests cannot land
      # outside CI without running the rationale suite twice.
      - name: Exercise remaining AI liability library controls
        run: >-
          npx jest src/lib/ai-liability/__tests__
          --testPathIgnorePatterns src/lib/ai-liability/__tests__/human-decision-controls.human-rationale.test.ts
          --runInBand

      # These guards are imported by the production answer routes and decide
      # whether product capability, tenant evidence, and third-party claims
      # may reach a client-visible answer.
      - name: Exercise product truth library controls
        run: npx jest src/lib/agent/product-truth/__tests__ --runInBand

      # Not a catalog control. `src/components/source/canvas/analytics/__tests__`
      # runs in no npm script and no workflow — 28 suites / 173 tests over the
      # component the Source event route mounts, reporting to nobody. Found
      # while wiring the off-stage notice below, whose own first CI run
      # executed it nowhere. The whole directory is wired rather than the one
      # new file: all 28 were green on `main` when this step was added, so no
      # failure is imported, and wiring one file would leave the other 27 in
      # the same blind spot. See backlog items 26 / 66 / 77.
      - name: Exercise Source canvas analytics component suites
        run: npx jest src/components/source/canvas/analytics --runInBand

      # Not a catalog control. `src/components/strategic-moves/__tests__` is the
      # second-ranked governed-risk directory in
      # `docs/architecture/test-ci-coverage-census.json` — declared AI surface
      # control, approval/lifecycle write and tenant-scoped read — and ran in no
      # npm script and no workflow. Its AI-liability suite could not run at all:
      # importing the documents panel under jsdom reached `@clerk/backend`'s bare
      # ESM, so the suite failed to parse and the three failures underneath it
      # were invisible. The 13 green suites are listed rather than the directory
      # because `MovesPhaseStandaloneClient.test.tsx` carried 4 triaged-red cases
      # that were not that change's to fix. See backlog items 26 / 92 / 102.
      #
      # T-518 closed those four. The fourteenth path below is that suite, added
      # here because the exclusion above was explicitly conditional on its red
      # cases and they no longer exist: 76 of 76 pass on this commit. It is
      # listed by exact path for the same reason as the other thirteen — the
      # directory is not swept, so naming it is how it runs at all — and the
      # job hosting this step is a required status check, so the name is one a
      # closure note may honestly quote (T-595).
      - name: Exercise Moves visible AI liability controls
        run: >-
          npx jest --runTestsByPath
          src/components/strategic-moves/__tests__/moves-liability-visible-controls.test.tsx
          src/components/strategic-moves/__tests__/MovesPhaseStandaloneClient.test.tsx
          src/components/strategic-moves/__tests__/BoardArtifactsPanel.test.tsx
          src/components/strategic-moves/__tests__/FileCabinetPanel.labels.test.ts
          src/components/strategic-moves/__tests__/MovePhaseExplorer.finder-shell.test.tsx
          src/components/strategic-moves/__tests__/PhaseRoleApprovalsSummary.test.tsx
          src/components/strategic-moves/__tests__/StrategicMoveOriginateClient.test.ts
          src/components/strategic-moves/__tests__/StrategicMoveOriginateClient.test.tsx
          src/components/strategic-moves/__tests__/composeOriginateFirstMessage.grounding.test.ts
          src/components/strategic-moves/__tests__/move-list-format.test.ts
          src/components/strategic-moves/__tests__/moves-detail-route-sunset.test.ts
          src/components/strategic-moves/__tests__/phase-approve-and-build-settle.test.tsx
          src/components/strategic-moves/__tests__/phase-capture-autosave-lanes.test.tsx
          src/components/strategic-moves/__tests__/strategicMoveBriefToDiscoveryShape.test.ts
          --runInBand

      # Not a catalog control. `src/lib/agent/tools/__tests__` is the
      # first-ranked governed-risk directory in
      # `docs/architecture/test-ci-coverage-census.json` — declared AI surface
      # control, approval/lifecycle write and tenant-scoped read — and ran in no
      # npm script and no workflow. Its ten suites drive the real tool handlers
      # for every write an agent can make to a Program: the phase advance that
      # must never self-approve, the program commit, the deliverable sign-off
      # and the registry's defence-in-depth surface gate. All ten were green and
      # reporting to nobody. Nine of ten deliberate control mutations failed
      # them; the survivor — deleting the publish-rights gate on the
      # single-deliverable sign-off — is covered by this change and now fails
      # them too. See backlog items 26 / 92.
      - name: Exercise agent program-tool control suites
        run: npx jest src/lib/agent/tools/__tests__ --runInBand

      # Not a catalog control. `src/lib/agent/tools/intelligence/__tests__` is
      # the Sentinel half of the directory above and ran in no npm script and
      # no workflow either. It was red the whole time: three cases named a
      # pattern id the corpus retired when it re-keyed `pattern_*` slugs to
      # `PAT-*` codes. A fourth case guarded its assertions behind
      # `if (depth1.success && depth2.success)`, so it stayed green while
      # asserting nothing, and the tool's own input schema — handed verbatim to
      # the model — still offered the retired id as its worked example. Roots
      # are now derived from the live manifest so a future re-key cannot
      # reproduce this. See backlog items 26 / 92 / 120.
      - name: Exercise Sentinel intelligence-tool suites
        run: npx jest src/lib/agent/tools/intelligence/__tests__ --runInBand

      # Not a catalog control. The Programs pattern authority decides whether
      # a pattern key may be cited as a match, and every writer treats its
      # refusal as fatal — `commit_program` returns
      # `program_pattern_not_promoted` instead of submitting the brief, and
      # `originateProgram` throws before the engagement insert. So its
      # promoted-state list is load-bearing: when it named three states
      # `engagement_topics.promotion_state` cannot hold, the gate refused every
      # key that exists, and every unit test stayed green because each one
      # injects its own lookup and can return a row the database could never
      # produce. The reachability suite checks the list against the CHECK
      # constraint in the migration that defines the column. These suites ran
      # in no workflow. See backlog item 126.
      - name: Exercise the Programs pattern authority
        run: >
          npx jest --runTestsByPath
          src/lib/programs/__tests__/pattern-authority-reachability.test.ts
          src/lib/programs/__tests__/pattern-authority.test.ts
          src/lib/programs/__tests__/program-pattern-writer-guards.test.ts
          --runInBand

      # Not a catalog control. `src/lib/programs/__tests__` holds 85 suites and
      # a workflow reached SIX of them — three catalog controls above and the
      # three pattern-authority suites, each named one file at a time as it
      # became somebody's item. The other 79 ran nowhere, and one of them had
      # been red since 2026-08-06: it pinned a tenant display label that a
      # deliberate rename changed four days later, and nothing in the
      # repository could report it for the 44 days since. It is repaired in
      # this change by deriving the expectation from the exported vocabulary
      # rather than pinning the literal.
      #
      # Wired as a DIRECTORY, like the sibling `src/lib/agent/tools/__tests__`:
      # a directory named once covers the suites nobody has written yet, which
      # is the half file-by-file wiring can never cover. Measured on
      # `fbe56c123`: 85 suites, 770 tests, 11.8s from a cleared jest cache.
      # `src/__tests__/behaviors/programs-unit-directory-ci-coverage.test.ts`
      # holds this step in place through the census's own resolver.
      #
      # The six suites above now run twice in this job. Naming them is what
      # maps a catalog control to the step that exercises it, so the duplicate
      # execution is the cheaper half of that trade — the same one taken for
      # `admin-context-uploads-tabs.test.tsx` in `integration-suites.yml`.
      # See backlog item T-004.
      - name: Exercise the Programs unit suites
        run: npx jest src/lib/programs/__tests__ --runInBand

      # Not a catalog control either. Wiring `src/lib/programs/__tests__` above
      # left 38 directories under `src/lib/programs` — 168 test files — that a
      # workflow reaches for none of their suites, because a jest path argument
      # is a regex against the full path and `src/lib/programs/__tests__` does
      # not appear anywhere in `src/lib/programs/phase-templates/__tests__/…`.
      #
      # This is the first of the 38, taken highest-governed-risk first: score
      # 100, band `critical`, signal `approval_or_lifecycle_write`, rank 25 of
      # the whole repository. It was measured before it was wired and it is
      # GREEN — 10 suites, 63 tests, 0.5s — so unlike the directory above it,
      # this step buys the future rather than repairing the past. That is the
      # weaker of the two claims and it is the only one available here; a
      # directory is worth wiring when its modules are live, not only when its
      # suites are broken. These are live: eleven of the thirteen modules have
      # importers outside the directory, and the barrel is imported by the
      # `assemble-pattern` and `approved-inputs-pack` API routes.
      #
      # `src/__tests__/behaviors/programs-unit-directory-ci-coverage.test.ts`
      # holds this step in place through the census's own four-hop resolver,
      # and its dark-directory ratchet comes down 38 → 37 in the same change.
      # Lowering it is what makes that number a measurement rather than a
      # ceiling. See backlog item T-062.
      - name: Exercise the Programs phase-template suites
        run: npx jest src/lib/programs/phase-templates/__tests__ --runInBand

      # The second of the dark directories, and the first one taken because it
      # was RED rather than because it ranked. All 37 remaining directories were
      # run individually: 34 were green and five suites across four directories
      # were failing, reported to nobody. Two of the five are in this directory
      # and both asserted tenancy behaviour, which is why this pair was read
      # first.
      #
      # Neither was a product defect. Both pinned a literal that a deliberate
      # change moved — one named a tenant that had since been promoted into the
      # foundation list, so it no longer demonstrated the denial branch it was
      # written for; the other pinned a display label a rename had changed. Both
      # are repaired by DERIVING the expectation from the authority the code
      # itself consults, so the next such change travels instead of arriving as
      # a false defect. The guard's two denial branches are both still live and
      # each is now asserted to have a real tenant behind it.
      #
      # A test file also sat loose in `board-artifacts/` rather than in
      # `__tests__`. The census models coverage per directory, so wiring the
      # sibling would have left it dark while reading as covered; it moved into
      # `__tests__` rather than widening this command to the parent, which would
      # have silently adopted every future loose file. See backlog T-063/T-065.
      - name: Exercise the Programs board-artifact suites
        run: npx jest src/lib/programs/board-artifacts/__tests__ --runInBand

      # Two suites shipped on 18 Sep whose release records said "5 of 5 pass"
      # and "19 of 19 pass". Both were true locally and enforced by nothing:
      # neither file was named by any workflow, and no scoped jest script
      # reaches src/lib/**/__tests__ or src/components/**/__tests__. The
      # decision-trail guard — whose whole point is that a failed read must not
      # render as "no decisions recorded" — could have been deleted without a
      # single check going red.
      - name: Exercise the Source event decision trail reader
        run: npx jest --runTestsByPath src/lib/source/__tests__/activity-log.test.ts --runInBand

      - name: Exercise the Source New workspace, including the decision trail
        run: npx jest --runTestsByPath src/components/source/new-workspace/SourceNewWorkspace.test.tsx --runInBand

      # The file cabinet is where the workspace's motion labels are actually
      # read: the folder rail carries the accepted motion, and the artifact
      # opened inside it carries a reused stage key that must not contradict
      # it. The suite existed and no workflow named it, so the rule that keeps
      # an RFI event from printing RFP on its own package ran nowhere.
      - name: Exercise the Source New file cabinet, including solicitation labels
        run: npx jest --runTestsByPath src/components/source/new-workspace/SourceNewFiles.test.tsx --runInBand

      # The Source stage gate decides whether an event may move past a stage
      # whose criteria are still open. It ran in no workflow, so the branch
      # that treated a criterion the canonical catalog cannot resolve as
      # non-blocking could not be caught by any check.
      - name: Exercise the Source stage promotion gate
        run: >
          npx jest --runTestsByPath
          src/lib/source/__tests__/source-governance-enforcement.test.ts
          src/lib/source/__tests__/gate-advance-contract.test.ts
          --runInBand

      # Not a catalog control. These Source library suites were red on main
      # and ran in no workflow: the stale cases hid one real dangling
      # evidence-map identifier plus current renderer/stage-evidence behavior.
      # The six-file scope is deliberate; the rest of src/lib/source/__tests__
      # still contains unrelated triaged debt.
      - name: Exercise Source library red-suite triage scope
        run: >
          npx jest --runTestsByPath
          src/lib/source/__tests__/gate-auto-assessment.test.ts
          src/lib/source/__tests__/gate-auto-assessment-persist.test.ts
          src/lib/source/__tests__/nexus-api-live-context.test.ts
          src/lib/source/__tests__/stage-progression.test.ts
          src/lib/source/__tests__/artifact-binding-matrix.test.ts
          src/lib/source/__tests__/stage-next-move.test.ts
          --runInBand

      # Not a catalog control, but credited with one. `src/components/source/canvas/__tests__`
      # is the first-ranked governed-risk directory in
      # `docs/architecture/test-ci-coverage-census.json` — band `critical`,
      # signal `declared_ai_surface_control` via `agent-dock-chat-turns` — and
      # ran in no npm script and no workflow. Its sibling
      # `canvas/analytics/__tests__` was wired months after the same discovery;
      # the three suites one directory up were left behind because nobody
      # measured the directory, only the file in front of them. All three were
      # green on `main` when this step was added, so no failure is imported.
      # Green is not the same as load-bearing, so each was mutation-checked
      # first: truncating the blocker list to its first entry, dropping the
      # structured-parts renderer from the aVa answer, ungating the approval
      # button from required-evidence readiness, deleting the artifact context
      # manifest, and making every requirement read as ready each fail them.
      # The directory is wired rather than the three files so the next suite
      # added here is not in the same blind spot. See backlog items 26 / 92.
      - name: Exercise Source canvas front-surface suites
        run: npx jest src/components/source/canvas/__tests__ --runInBand

      # Four component directories this workflow already reached into, and
      # left dark. It named only the `*.controls.test.tsx` suites the control
      # catalog required, so it pulled exactly its own evidence into CI: of
      # the 22 suites across these directories, 15 ran nowhere.
      #
      # Measured before wiring rather than after: all 15 pass, 99 tests, and
      # none fails to collect -- they are healthy suites that nothing ran, not
      # a red directory being quietly admitted. The four directories together
      # are 22 suites and 211 tests in about four seconds locally, against a
      # job whose recent runs sit near 281s under a 720s ceiling.
      #
      # Directories rather than the fifteen filenames, for the same reason
      # the canvas step above gives: a file list is a blind spot that reopens
      # the day someone adds a suite.
      #
      # One suite inside them, ProbabilisticForecastCard, covers a component
      # nothing reaches -- see the release record. It is run anyway because
      # excluding one file would reintroduce the hand-maintained list, and
      # what it does and does not prove is written down instead.
      # Pattern choice for a step here versus a dedicated workflow is
      # measured in docs/ci/README-suite-wiring.md. Short version: queue
      # time is zero either way, this job has 66% headroom, and a dedicated
      # workflow pays its own setup — so pick on failure attribution, and do
      # not convert an existing one for consistency alone.
      - name: Exercise unwired component suites (programs, agent, shell, atlas)
        run: >-
          npx jest
          src/components/programs/__tests__
          src/components/agent/__tests__
          src/components/shell/__tests__
          src/components/atlas/__tests__
          --runInBand

      # Shared AI-disclosure primitives and the phase-workspace controls were
      # catalog-adjacent but ran in no workflow. The route-group action files
      # are exact paths because unescaped parentheses are a Jest regex group.
      - name: Exercise shared rendered AI controls
        run: npx jest src/components/abarva/__tests__ --runInBand

      - name: Exercise phase-workspace controls
        run: npx jest src/components/strategic-moves/phase-workspace/__tests__ --runInBand

      - name: Exercise program approval action controls
        run: >-
          npx jest --runTestsByPath
          "src/app/(maestro)/admin/programs/approvals/_actions/__tests__/escalate-approval.test.ts"
          "src/app/(maestro)/admin/programs/approvals/_actions/__tests__/notify-sponsor.test.ts"
          --runInBand

      - name: Exercise Source award and SOW handoff readiness
        run: >-
          npx jest --runTestsByPath
          src/__tests__/integration/source/source-award-sow-handoff-readiness.test.ts
          src/__tests__/integration/source/source-award-sow-handoff-readiness-panel.test.ts
          --runInBand

      # Not catalog controls. T-556 drew twenty untriaged unrun suites from the
      # census's own governed-risk ranking — band `high`, score 10, signal
      # `tenant_scoped_read` — and verdicted fifteen of them `wire_into_ci`.
      # The three steps below are that wiring (T-557). All fifteen were
      # executed before being wired, on `9afed2c6f`: 15 suites, 280 tests, 280
      # passed, 2.3s. No failure is imported.
      #
      # EXACT PATHS, not the directory, and that is the whole point of the
      # shape. `src/app/(maestro)/source/preview/workspace/__tests__` holds 33
      # suites, 14 of which no workflow runs: the ten below, `contractDetailRetry`
      # which T-556's draw of twenty did not reach, and the three T-556
      # verdicted `rewrite_as_behavior` — suites that assert substrings of
      # source files instead of running them. A directory sweep would be
      # shorter and would wire those three as well, admitting byte-matching
      # into a required job as though it were behaviour. T-558 owns rewriting
      # them; until it does, they stay unrun deliberately.
      #
      # That reasoning held the door and the door was already open (T-555).
      # `WorkspaceExecutiveShell.performance.test.ts`, named below since T-557,
      # was verdicted `wire_into_ci` rather than `rewrite_as_behavior`, and
      # nine of its cases were byte-scans over the component and the
      # stylesheet — exactly the shape the paragraph above refuses to admit.
      # A verdict is a reading of a suite, so keeping byte-matching out by
      # naming files individually only works while every verdict is right.
      # T-555 repaired that suite in place rather than unwiring it: what could
      # be rendered moved to the `shell-behaviour` suite added below, what was
      # already rendered elsewhere was retired, what is genuinely a rule about
      # the code now reads a comment-stripped copy so a comment can no longer
      # satisfy it. The three `rewrite_as_behavior` files are untouched and
      # still unrun; T-558 still owns them.
      # `src/__tests__/behaviors/t557-unrun-suite-wiring.test.ts` asserts both
      # halves — these fifteen reached, those three still not — through the
      # census's four-hop resolver rather than a grep over this file.
      #
      # The route-group paths are quoted because bash reads an unquoted
      # `(maestro)` as a subshell, and `--runTestsByPath` because jest reads a
      # bare path argument as a regex, in which the same parentheses are a
      # capture group.
      - name: Exercise the Source preview workspace suites
        run: >-
          npx jest --runTestsByPath
          "src/app/(maestro)/source/preview/workspace/__tests__/VendorCanvas.cockpit.test.tsx"
          "src/app/(maestro)/source/preview/workspace/__tests__/WorkspaceClient.ecl-browser.test.tsx"

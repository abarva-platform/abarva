name: AI Surface Control Catalog

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-surface-control-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-surface-control-catalog:
    name: AI surface control catalog
    runs-on: ubuntu-latest
    # Raised from 5 with the Programs unit suites (T-004). The five most recent
    # runs of this job took 135s, 138s, 147s, 218s and 281s against the old
    # 300s ceiling, so the job was already finishing within seconds of a
    # timeout on its slowest runs and one more step would have tipped it into
    # failing for a reason that has nothing to do with the controls it guards.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Check AI surface controls
        run: npm run audit:ai-surface-controls

      # Every step below exercises one suite. This one asks a different
      # question of all of them at once: does the suite credited with a control
      # still contain the case that proves it? The static gate above checks the
      # FILE — that it exists, that this workflow runs it, that the name filter
      # matches — and never looks inside, so a suite named by four control
      # kinds earned four credits whatever it exercised (item C-554). Deleting
      # the one case proving one of them left both the suite and that gate
      # green. The names are read back from jest's own report rather than
      # scanned out of the source, because a case name can be built from a
      # template literal or a `describe.each` table; all 23 credited suites run
      # in one invocation in about three seconds.
      - name: Prove each credited control still has its case
        run: npm run audit:ai-surface-control-cases

      - name: Exercise visible agent stream controls
        run: npx jest src/app/api/chat/agent/__tests__/agent-visible-stream-controls.test.ts --runInBand

      - name: Exercise agent phase-advance approval gate
        run: npx jest src/lib/agent/tools/program/__tests__/advancePhase.approval-gate.test.ts --runInBand

      - name: Exercise Source external-action gate
        run: npx jest src/app/api/v1/source/work-items/__tests__/external-action-gate.test.ts --runInBand

      - name: Exercise Moves phase-advance approval gate
        # --runTestsByPath: jest reads a bare pattern as a regex, and the
        # literal brackets in [programId] are a character class that matches
        # nothing. The step passed locally and found no tests in CI.
        run: npx jest --runTestsByPath "src/app/api/v1/programs/[programId]/advance/__tests__/approval-gate.test.ts" --runInBand

      # Not a catalog control. The two walk routes a reviewer drives from the
      # phase workspace — the capture save and aVa's cited drafting — had no
      # route suite of their own, and neither directory is swept by any job, so
      # both are named here by exact path. Quoted for the same reason as the
      # step above: jest reads a bare pattern as a regex and the literal
      # brackets in [programId] are a character class that matches nothing.
      #
      # What they hold is the Move-unreadable refusal both routes answer with.
      # Each has reader ladders that end `detail || error`, so a body carrying
      # only a code printed the literal `not_found` to a signed-in reviewer —
      # once in the cited-draft panel's alert, once in a per-section save slot.
      # The GET case is the deliberate other side: that arm keeps its bare body
      # because no client fetches it, and the test says so, so a later sweep
      # cannot "finish the job" by adding copy nothing renders.
      - name: Exercise Moves walk-step Move-unreadable refusals
        run: >-
          npx jest --runTestsByPath
          "src/app/api/v1/programs/[programId]/phase-input-draft/__tests__/route.test.ts"
          "src/app/api/v1/programs/[programId]/phase-capture/__tests__/move-unreadable-refusal.test.ts"
          --runInBand

      - name: Exercise Intelligence promotion approval gate
        run: npx jest --runTestsByPath src/lib/programs/__tests__/origination-submit.promotion-gate.test.ts --runInBand

      # C-544. The step above proves the SERVER gate. This one proves what the
      # brief panel renders: the legal catalog claims this surface carries an AI
      # label and the promotion's evidence refs, and until this step existed no
      # job ran anything that would notice either going away.
      - name: Exercise Intelligence promotion brief panel disclosure controls
        run: npx jest --runTestsByPath src/components/programs/origination/__tests__/ProgramBriefPanel.controls.test.tsx --runInBand

      # C-547. The Moves Nexus current-state briefing panel's citation and
      # confidence disclosures are real code that NO route reaches — nothing in
      # the product imports the panel, so its catalog entry carries
      # routeReachable: false and the audit counts both controls in its
      # not-on-any-screen bucket. This step is still the difference between a
      # claim and a check: it proves the two controls render when the component
      # is mounted, which is what has to hold the day something mounts it.
      # Listed by exact path because src/components/strategic-moves/__tests__ is
      # not swept by any job.
      - name: Exercise Moves Nexus current-state briefing disclosure controls
        run: npx jest --runTestsByPath src/components/strategic-moves/__tests__/NexusCurrentStateBriefingPanel.controls.test.tsx --runInBand

      # C-549. src/components/setup/__tests__ is also swept by directory in
      # unit-suites.yml, but the catalog gate credits a control only when THIS
      # workflow runs its suite, so it is named here by exact path as well.
      - name: Exercise Setup Steward reconnect guidance assumption disclosure
        run: npx jest --runTestsByPath src/components/setup/__tests__/ConnectorReconnectPage.assumption-disclosure.test.tsx --runInBand

      - name: Exercise Moves phase-gate route approval
        # The catalog credits the route suite for proving both the authorized
        # workspace-user success path and the missing-rationale refusal. Keep
        # the focused denial suite as an additional check.
        run: npx jest --runTestsByPath src/app/api/programs/phase-gate/__tests__/approval-gate.test.ts src/app/api/programs/phase-gate/__tests__/route.test.ts --runInBand

      # The Moves workspace upload route's own suite arrived in a NEW directory
      # — `src/app/api/programs/workspace/[moveId]/__tests__` — that no workflow
      # reached, so `product-directory-ci-coverage` refused it as a dark tree.
      # Wired rather than baselined, which is what that gate's own message asks
      # for. `--runTestsByPath` is load-bearing: a bare jest path argument is a
      # REGEX against the full path, and `[moveId]` would be read as a character
      # class. Named here because a step may name a suite individually only
      # inside a required job, and this is one.
      - name: Exercise Moves workspace evidence upload route
        run: >-
          npx jest --runTestsByPath
          'src/app/api/programs/workspace/[moveId]/__tests__/upload-route.test.ts'
          --runInBand

      - name: Exercise Intelligence gate-waiver decision controls
        run: npx jest --runTestsByPath src/app/api/reasoning/gate-waiver/__tests__/route.controls.test.ts --runInBand

      - name: Exercise Tower portfolio upload non-approval boundary
        run: npx jest --runTestsByPath src/app/api/tower/upload/__tests__/route.test.ts --runInBand

      - name: Exercise renewal cockpit external action
        run: npx jest --runTestsByPath src/components/source/__tests__/RenewalCockpitActionBar.external-action.test.tsx --runInBand

      - name: Exercise Source estimate assumption disclosure
        run: npx jest --runTestsByPath src/components/source/__tests__/RenewalCockpitView.estimate-disclosure.test.tsx --runInBand

      - name: Exercise deliverable approval actions
        run: npx jest --runTestsByPath src/components/deliverables/__tests__/ApproveActions.controls.test.tsx --runInBand

      - name: Exercise Source approval queue controls
        run: npx jest --runTestsByPath src/components/source/__tests__/AdminSourceEventApprovalQueue.controls.test.tsx --runInBand

      - name: Exercise Source canonical artifact render approval gate
        run: npx jest --runTestsByPath "src/app/api/v1/source/[eventId]/artifacts/[artifactCode]/render/__tests__/route.test.ts" --runInBand

      - name: Exercise Source governed artifact download approval gate
        run: npx jest --runTestsByPath "src/app/api/v1/source/artifacts/[artifactId]/download/__tests__/route.test.ts" --runInBand

      - name: Exercise Moves phase-advance button
        run: npx jest --runTestsByPath src/components/programs/__tests__/PhaseAdvanceButton.controls.test.tsx --runInBand

      - name: Exercise Moves decision evidence packet
        run: npx jest --runTestsByPath src/lib/programs/__tests__/moves-ai-liability.decision-packet.test.ts --runInBand

      - name: Exercise agent response disclosure controls
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentResponse.controls.test.tsx --runInBand

      # The `citation` control of the same surface. It is a separate suite
      # because it needs `@/lib/agent/markdownRenderer` mocked, and the suite
      # above deliberately runs with the repo-wide react-markdown passthrough
      # so its four other controls are proven against the component as
      # everything else renders it.
      - name: Exercise agent response citation resolution
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentResponse.citation-control.test.tsx --runInBand

      # Full suite: backlog T-015 closed the former pin-top and structured
      # artifact exemptions, so the catalog can now gate the whole dock file.
      - name: Exercise agent dock responsibility and approval notices
        run: npx jest --runTestsByPath src/components/agent/__tests__/AgentDock.test.tsx --runInBand

      - name: Exercise Atlas drawer disclosure controls
        run: npx jest --runTestsByPath src/components/shell/__tests__/AtlasDrawer.controls.test.tsx --runInBand

      # C-416. The Tower pressure brief's five controls live in a component no
      # route mounts (routeReachable: false). This suite measures the component
      # that DOES render on the Tower route, and asserts what it shows today:
      # none of the five as statements. It is a measurement, not coverage — the
      # catalog keeps all five at status "none" and cites it — so a control
      # starting to render turns this step red until the catalog is reconciled.
      - name: Measure Tower shell against the pressure brief controls
        run: npx jest --runTestsByPath src/components/tower/command-center/__tests__/TowerCommandCenterAvaShell.brief-controls.test.tsx --runInBand

      - name: Exercise Moves deliverable canvas disclosure controls
        run: npx jest --runTestsByPath src/lib/programs/__tests__/deliverable-canvas-polish-view.controls.test.ts --runInBand

      - name: Exercise programs gate approval modal
        run: npx jest --runTestsByPath src/components/programs/__tests__/ProgramDetailPage.gate-approval.controls.test.tsx --runInBand

      # Not a catalog control. These two suites guard the Source artifact verdict
      # contract — that the deal pack, the CXO report and its HTML/PPTX renders
      # all state the verdict the expert-judgment kernel returned. They ran in no
      # CI job, and one of them sat red for weeks while a sibling expectation was
      # rewritten to agree with the defect. See backlog items 26 / 66 / 77.
      - name: Exercise Source artifact verdict consistency
        run: npx jest --runTestsByPath src/lib/source/exports/__tests__/artifact-verdict-consistency.test.ts src/lib/source/exports/cxo-report/__tests__/source-cxo-narrative-report.test.ts --runInBand

      # Not a catalog control. This suite drives the real Source canvas ask
      # handler and asserts that the payload the canvas renders describes the
      # answer it is showing. It is deliberately NOT under
      # `src/__tests__/behaviors`: the behavior coverage floor measures over
      # whatever those suites load, and driving a real route pulls that route's
      # largely unexercised dependency graph into the denominator — measured at
      # 93.44% without this suite and 77.73% with it. Wiring it here keeps the
      # floor honest and keeps the suite running. See backlog item 82.
      - name: Exercise Source canvas model answer payload
        run: npx jest --runTestsByPath "src/app/api/v1/source/[eventId]/nexus/ask/__tests__/canvas-model-answer-payload.test.ts" --runInBand

      # Not a catalog control. This suite drives the shared evidence-packet
      # validator, which checked every field the product writes and not the one
      # field a human writes: the rationale minimum was enforced per-surface at
      # the two Moves builders, so a new decision surface had to remember it.
      # See backlog item 63.
      - name: Exercise shared evidence packet human rationale
        run: npx jest --runTestsByPath src/lib/ai-liability/__tests__/human-decision-controls.human-rationale.test.ts --runInBand

      # The shared rationale validator above already owns one file in this
      # directory. Run the remaining liability controls as a parent so new
      # audit/export, acknowledgment, training, and policy tests cannot land
      # outside CI without running the rationale suite twice.
      - name: Exercise remaining AI liability library controls
        run: >-
          npx jest src/lib/ai-liability/__tests__
          --testPathIgnorePatterns src/lib/ai-liability/__tests__/human-decision-controls.human-rationale.test.ts
          --runInBand

      # These guards are imported by the production answer routes and decide
      # whether product capability, tenant evidence, and third-party claims
      # may reach a client-visible answer.
      - name: Exercise product truth library controls
        run: npx jest src/lib/agent/product-truth/__tests__ --runInBand

      # Not a catalog control. `src/components/source/canvas/analytics/__tests__`
      # runs in no npm script and no workflow — 28 suites / 173 tests over the
      # component the Source event route mounts, reporting to nobody. Found
      # while wiring the off-stage notice below, whose own first CI run
      # executed it nowhere. The whole directory is wired rather than the one
      # new file: all 28 were green on `main` when this step was added, so no
      # failure is imported, and wiring one file would leave the other 27 in
      # the same blind spot. See backlog items 26 / 66 / 77.
      - name: Exercise Source canvas analytics component suites
        run: npx jest src/components/source/canvas/analytics --runInBand

      # Not a catalog control. `src/components/engagement` held NO suites at
      # all and no workflow named it, while the engagement meta strip it holds
      # is the Moves nav tab's own progress surface: it states the phase, the
      # baseline lock, the next gate, and a marker per phase gate. Two
      # successive defects landed in that strip's gate rail — a hardcoded phase
      # model, then a blindness to the record that holds a mid-phase approval —
      # and neither could have been caught here, because the `data-testid` the
      # first of them added had no assertion behind it anywhere in the tree.
      #
      # Wired as a DIRECTORY, like the `src/lib/programs/__tests__` step below:
      # the directory is the half that covers suites nobody has written yet,
      # and this one is being created with its first suite, so file-by-file
      # wiring would guarantee the next suite starts dark.
      - name: Exercise the engagement console component suites
        run: npx jest src/components/engagement --runInBand

      # The Moves step page template and its first step, P3 Gate readiness,
      # where gate-document sign-off and the governed gate submission (approve
      # and submit, with the approver's own rationale) now happen on one page.
      # Wired as a DIRECTORY, like the engagement console above: the directory
      # is created with its first suites, so file-by-file wiring would start
      # the next step page's suite dark.
      - name: Exercise the Moves step page suites
        run: npx jest src/components/strategic-moves/step-page --runInBand

      # Not a catalog control. `src/components/strategic-moves/__tests__` is the
      # second-ranked governed-risk directory in
      # `docs/architecture/test-ci-coverage-census.json` — declared AI surface
      # control, approval/lifecycle write and tenant-scoped read — and ran in no
      # npm script and no workflow. Its AI-liability suite could not run at all:
      # importing the documents panel under jsdom reached `@clerk/backend`'s bare
      # ESM, so the suite failed to parse and the three failures underneath it
      # were invisible. The 13 green suites are listed rather than the directory
      # because `MovesPhaseStandaloneClient.test.tsx` carried 4 triaged-red cases
      # that were not that change's to fix. See backlog items 26 / 92 / 102.
      #
      # T-518 closed those four. The fourteenth path below was that suite, added
      # here because the exclusion above was explicitly conditional on its red
      # cases and they no longer exist: 76 of 76 pass on this commit. It is
      # listed by exact path for the same reason as the other thirteen — the
      # directory is not swept, so naming it is how it runs at all — and the
      # job hosting this step is a required status check, so the name is one a
      # closure note may honestly quote (T-595). New strategic-moves suites
      # that live beside these controls must be named here deliberately.
      #
      # The forty-fourth path below is the phase approve-and-build gate sign-off
      # suite, named here under that rule. It sat in this directory enumerated
      # but collected by nothing: the census recorded it `run: false`,
      # `covered: false`, `untriaged: true` while the directory itself ranks at
      # the critical governed-risk band on the declared-AI-surface-control and
      # approval-or-lifecycle-write signals. A dark suite over gate sign-off on
      # the approve path is precisely the gap this step exists to close. Five of
      # five pass on this commit.
      #
      # The ninety-second path below is the document cabinet's storage state.
      # One boolean decided a red chip, so a generated deliverable — which is
      # rendered from its recorded content on download and never occupies the
      # vault — carried the same warning as an uploaded file whose bytes were
      # not stored, which is unrecoverable. A declared-AI-surface control whose
      # only alarm fires on every healthy row cannot be read, so it belongs in
      # this step. Eight of eight pass on this commit.
      #
      # The forty-seventh path below pins which phases the capture dock offers
      # aVa's input-drafting control on. The host handed the dock a literal
      # one-action list on every mounted phase while the handler returned
      # silently outside its window, so the first phase carried an enabled
      # button that made no request and said nothing. A declared-AI-surface
      # control that does nothing belongs in this step. Nine of nine pass on
      # this commit.
      # The forty-eighth path below is the Documents tab's sign-off column. The
      # panel joins two independent reads, and the one that owns sign-off state
      # destructured `data` alone — so a failed query fail-opened to an empty
      # map, the same shape as "no document on record". Every row then lost its
      # approved badge, took the AI-draft badge by default, and had its approve
      # control withheld without a word, while the exit gate went on asking for
      # a sign-off the screen offered no way to give. A declared-AI-surface
      # control that disappears on a read nobody checked belongs in this step.
      # Eight of eight pass on this commit.
      #
      # The last path below is the review queue for outside public sources:
      # the approve and reject controls that decide whether a public web page
      # found by the audited research step may ever be cited in a Move
      # deliverable, and the label that keeps such a page from reading as a
      # fact about the client. An approval control over AI-retrieved content
      # belongs in this step; the directory is not swept, so it is named.
      - name: Exercise Moves visible AI liability controls
        run: >-
          npx jest --runTestsByPath
          src/components/strategic-moves/__tests__/moves-liability-visible-controls.test.tsx
          src/components/strategic-moves/__tests__/deliverable-approval-action.test.tsx
          src/components/strategic-moves/__tests__/MovesPhaseStandaloneClient.test.tsx
          src/components/strategic-moves/__tests__/BoardArtifactsPanel.test.tsx
          src/components/strategic-moves/__tests__/FileCabinetPanel.labels.test.ts
          src/components/strategic-moves/__tests__/FileCabinetPanel.evidence-review.test.tsx
          src/components/strategic-moves/__tests__/FileCabinetPanel.review-readback.test.tsx
          src/components/strategic-moves/__tests__/FileCabinetPanel.client-approval-refusal.test.tsx
          src/components/strategic-moves/__tests__/MovePhaseExplorer.finder-shell.test.tsx
          src/components/strategic-moves/__tests__/StrategicMoveOriginateClient.test.ts
          src/components/strategic-moves/__tests__/StrategicMoveOriginateClient.test.tsx
          src/components/strategic-moves/__tests__/composeOriginateFirstMessage.grounding.test.ts
          src/components/strategic-moves/__tests__/move-list-format.test.ts
          src/components/strategic-moves/__tests__/moves-detail-route-sunset.test.ts
          src/components/strategic-moves/__tests__/phase-approve-and-build-settle.test.tsx
          src/components/strategic-moves/__tests__/phase-build-required-evidence-refusal.test.tsx
          src/components/strategic-moves/__tests__/phase-capture-autosave-lanes.test.tsx
          src/components/strategic-moves/__tests__/strategicMoveBriefToDiscoveryShape.test.ts
          src/components/strategic-moves/__tests__/CharterBasisField.test.tsx
          src/components/strategic-moves/__tests__/MovesCaptureFlow.test.tsx
          src/components/strategic-moves/__tests__/MovesCaptureFlowGrid.test.tsx
          src/components/strategic-moves/__tests__/MovesCaptureWorkspace.test.tsx
          src/components/strategic-moves/__tests__/ava-dock-adapter.test.ts
          src/components/strategic-moves/__tests__/MovesHome.test.tsx
          src/components/strategic-moves/__tests__/moves-home-adapter.test.ts
          src/components/strategic-moves/__tests__/moves-home-mapper.test.ts
          src/components/strategic-moves/__tests__/portfolio-reconciliation-summary.test.ts
          src/components/strategic-moves/__tests__/CaptureNotesFill.test.tsx
          src/components/strategic-moves/__tests__/capture-notes-basis-link.test.ts
          src/components/strategic-moves/__tests__/charter-gate-assumption-disclosure.test.ts
          src/components/strategic-moves/__tests__/CharterGateAssumptionNotice.test.tsx
          src/components/strategic-moves/__tests__/charter-basis-edit-notice.test.ts
          src/components/strategic-moves/__tests__/charter-basis-host-join.test.ts
          src/components/strategic-moves/__tests__/capture-phase-section-totals.test.ts
          src/components/strategic-moves/__tests__/capture-phase-progress.test.ts
          src/components/strategic-moves/__tests__/CharterAssumptionsCarryForward.test.tsx
          src/components/strategic-moves/__tests__/CharterStandingAfterDiscover.test.tsx
          src/components/strategic-moves/__tests__/AssumptionRegisterPanel.test.tsx
          src/components/strategic-moves/__tests__/phase-stepper-state-label.test.ts
          src/components/strategic-moves/__tests__/approvals-overview-labels.test.ts
          src/components/strategic-moves/__tests__/phase-approval-standing.test.ts
          src/components/strategic-moves/__tests__/DiagnosisFactsEditor.test.tsx
          src/components/strategic-moves/__tests__/SolutionOptionChooser.test.tsx
          src/components/strategic-moves/__tests__/MovesCaptureFlowRouteSteps.test.tsx
          src/components/strategic-moves/__tests__/phase-documents-panel-route-scope.test.tsx
          src/components/strategic-moves/__tests__/CaptureGateMetNotice.test.tsx
          src/components/strategic-moves/__tests__/MovesPhaseFindings.test.tsx
          src/components/strategic-moves/__tests__/MovesPhaseCharts.test.tsx
          src/components/strategic-moves/__tests__/phase-approve-and-build-gate-signoff.test.tsx
          src/components/strategic-moves/__tests__/ava-draft-action-phase-reach.test.tsx
          src/components/strategic-moves/__tests__/moves-capture-composer-streaming.test.tsx
          src/components/strategic-moves/__tests__/FileCabinetPanel.upload-retention.test.tsx
          src/components/strategic-moves/__tests__/phase-documents-panel-sign-off-readback.test.tsx
          src/components/strategic-moves/__tests__/PublicSourcesReviewPanel.test.tsx
          --runInBand

      # Not a catalog control. `src/lib/agent/tools/__tests__` is the
      # first-ranked governed-risk directory in
      # `docs/architecture/test-ci-coverage-census.json` — declared AI surface
      # control, approval/lifecycle write and tenant-scoped read — and ran in no
      # npm script and no workflow. Its ten suites drive the real tool handlers
      # for every write an agent can make to a Program: the phase advance that
      # must never self-approve, the program commit, the deliverable sign-off
      # and the registry's defence-in-depth surface gate. All ten were green and
      # reporting to nobody. Nine of ten deliberate control mutations failed
      # them; the survivor — deleting the publish-rights gate on the
      # single-deliverable sign-off — is covered by this change and now fails
      # them too. See backlog items 26 / 92.
      - name: Exercise agent program-tool control suites
        run: npx jest src/lib/agent/tools/__tests__ --runInBand

      # Not a catalog control. `src/lib/agent/tools/intelligence/__tests__` is
      # the Sentinel half of the directory above and ran in no npm script and
      # no workflow either. It was red the whole time: three cases named a
      # pattern id the corpus retired when it re-keyed `pattern_*` slugs to
      # `PAT-*` codes. A fourth case guarded its assertions behind
      # `if (depth1.success && depth2.success)`, so it stayed green while
      # asserting nothing, and the tool's own input schema — handed verbatim to
      # the model — still offered the retired id as its worked example. Roots
      # are now derived from the live manifest so a future re-key cannot
      # reproduce this. See backlog items 26 / 92 / 120.
      - name: Exercise Sentinel intelligence-tool suites
        run: npx jest src/lib/agent/tools/intelligence/__tests__ --runInBand

      # Not a catalog control. The Programs pattern authority decides whether
      # a pattern key may be cited as a match, and every writer treats its
      # refusal as fatal — `commit_program` returns
      # `program_pattern_not_promoted` instead of submitting the brief, and
      # `originateProgram` throws before the engagement insert. So its
      # promoted-state list is load-bearing: when it named three states
      # `engagement_topics.promotion_state` cannot hold, the gate refused every
      # key that exists, and every unit test stayed green because each one
      # injects its own lookup and can return a row the database could never
      # produce. The reachability suite checks the list against the CHECK
      # constraint in the migration that defines the column. These suites ran
      # in no workflow. See backlog item 126.
      - name: Exercise the Programs pattern authority
        run: >
          npx jest --runTestsByPath
          src/lib/programs/__tests__/pattern-authority-reachability.test.ts
          src/lib/programs/__tests__/pattern-authority.test.ts
          src/lib/programs/__tests__/program-pattern-writer-guards.test.ts
          --runInBand


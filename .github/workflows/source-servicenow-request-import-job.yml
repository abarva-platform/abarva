name: Source ServiceNow request import job

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run produces proof only. apply writes immutable request versions only after exact confirmation."
        required: true
        type: choice
        options:
          - dry_run
          - apply
        default: dry_run
      tenant_key:
        description: "Exact tenant key for the request import scope."
        required: true
        type: string
        default: corpus_global
      load_run_id:
        description: "Operator run id. Leave blank to use source-servicenow-request-${github.run_id}."
        required: false
        type: string
        default: ""
      idempotency_key:
        description: "Required idempotency key. Apply refuses blank values."
        required: true
        type: string
      input_sha256:
        description: "Optional expected SHA-256 for the checked-in synthetic extract."
        required: false
        type: string
        default: ""
      confirm_apply:
        description: "Required for apply: APPLY_SERVICENOW_REQUESTS."
        required: false
        type: string
        default: ""

concurrency:
  group: source-servicenow-request-import-job
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  request-import:
    name: ServiceNow request import operator job
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME || 'ca-abarva-web-lab-eastus' }}
      RESOURCE_GROUP: ${{ vars.AZURE_WEB_RESOURCE_GROUP || 'rg-abarva-controlplane-lab-eastus' }}
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
      AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
      AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID || '701a8554-a166-46e9-bf13-743bc50e3b20' }}
      SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY: ${{ inputs.tenant_key }}
      SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT: datasets/source-servicenow-sourcing-requests-synthetic-v1/servicenow_sourcing_requests.csv
      SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_ID: source-servicenow-sourcing-requests-synthetic-v1
      SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_VERSION: v1
      SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT_SOURCE_VERSION: v1
      SOURCE_SERVICENOW_REQUEST_IMPORT_RELEASE_RECORD: docs/releases/records/2026-09-22-source-servicenow-request-import-job.md
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve run identity
        id: run_identity
        shell: bash
        run: |
          set -euo pipefail
          load_run_id="${{ inputs.load_run_id }}"
          if [[ -z "$load_run_id" ]]; then
            load_run_id="source-servicenow-request-${GITHUB_RUN_ID}"
          fi
          if [[ -z "${SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY}" ]]; then
            echo "idempotency_key is required." >&2
            exit 1
          fi
          echo "load_run_id=$load_run_id" >> "$GITHUB_OUTPUT"
          mkdir -p audit-artifacts/source-servicenow-request-import-job

      - name: Refuse unsafe apply request
        if: inputs.mode == 'apply' && inputs.confirm_apply != 'APPLY_SERVICENOW_REQUESTS'
        run: |
          echo "Apply requires confirm_apply=APPLY_SERVICENOW_REQUESTS." >&2
          exit 1

      - name: Refuse apply outside main
        if: inputs.mode == 'apply' && github.ref != 'refs/heads/main'
        run: |
          echo "Apply may only run from refs/heads/main after merge." >&2
          exit 1

      - name: Verify Azure OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${AZURE_DEPLOY_CLIENT_ID}" ]]; then missing+=("AZURE_CLIENT_ID or AZURE_LAB_CLIENT_ID"); fi
          if [[ -z "${AZURE_DEPLOY_TENANT_ID}" ]]; then missing+=("AZURE_TENANT_ID or AZURE_LAB_TENANT_ID"); fi
          if [[ -z "${AZURE_DEPLOY_SUBSCRIPTION_ID}" ]]; then missing+=("AZURE_SUBSCRIPTION_ID or AZURE_LAB_SUBSCRIPTION_ID"); fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Azure configuration:\n' >&2
            printf -- '- %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Resolve currently deployed digest image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          app_json="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output json)"
          echo "$app_json" > audit-artifacts/source-servicenow-request-import-job/containerapp.json
          image="$(echo "$app_json" | jq -r '.properties.template.containers[0].image // empty')"
          if [[ -z "$image" || "$image" != *@sha256:* ]]; then
            echo "Could not resolve a digest-pinned template image from the live container app." >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image" > audit-artifacts/source-servicenow-request-import-job/image.txt

      - name: Run dry-run proof through private operator
        if: inputs.mode == 'dry_run'
        shell: bash
        run: |
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --script source:servicenow-requests:proof-job \
            --container db-migrate \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_MODE=dry-run \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY="$SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_LOAD_RUN_ID="${{ steps.run_identity.outputs.load_run_id }}" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY="$SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT="$SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_ID="$SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_ID" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_VERSION="$SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_VERSION" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT_SOURCE_VERSION="$SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT_SOURCE_VERSION" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_BUILD_VERSION="$GITHUB_SHA" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_EXPECTED_INPUT_SHA256="${{ inputs.input_sha256 }}" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_RELEASE_RECORD="$SOURCE_SERVICENOW_REQUEST_IMPORT_RELEASE_RECORD" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_OUT_DIR=/tmp/source-servicenow-request-import-job \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_EMIT_PROOF_BUNDLE=true \
            --out-dir audit-artifacts/source-servicenow-request-import-job/live-dry-run \
            --poll-seconds 15 \
            --idle-verify-wait-seconds 300

      - name: Run apply through private operator
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          npm run ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --script source:servicenow-requests:proof-job \
            --container db-migrate \
            --secret-env DATABASE_URL=azure-postgres-control-database-url \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_MODE=apply \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_APPLY_APPROVED=true \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_APPLY_CONFIRM=APPLY_SERVICENOW_REQUESTS \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY="$SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_LOAD_RUN_ID="${{ steps.run_identity.outputs.load_run_id }}" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY="$SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT="$SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_ID="$SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_ID" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_VERSION="$SOURCE_SERVICENOW_REQUEST_IMPORT_DATASET_VERSION" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT_SOURCE_VERSION="$SOURCE_SERVICENOW_REQUEST_IMPORT_INPUT_SOURCE_VERSION" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_BUILD_VERSION="$GITHUB_SHA" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_EXPECTED_INPUT_SHA256="${{ inputs.input_sha256 }}" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_RELEASE_RECORD="$SOURCE_SERVICENOW_REQUEST_IMPORT_RELEASE_RECORD" \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_OUT_DIR=/tmp/source-servicenow-request-import-job \
            --env SOURCE_SERVICENOW_REQUEST_IMPORT_EMIT_PROOF_BUNDLE=true \
            --out-dir audit-artifacts/source-servicenow-request-import-job/live-apply \
            --poll-seconds 15 \
            --idle-verify-wait-seconds 300

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'audit-artifacts/source-servicenow-request-import-job';
          fs.mkdirSync(root, { recursive: true });
          const summary = {
            lane: 'client-data-lane',
            job: 'source-servicenow-request-import',
            mode: '${{ inputs.mode }}',
            tenant_key: process.env.SOURCE_SERVICENOW_REQUEST_IMPORT_TENANT_KEY,
            load_run_id: '${{ steps.run_identity.outputs.load_run_id }}',
            idempotency_key_present: Boolean(process.env.SOURCE_SERVICENOW_REQUEST_IMPORT_IDEMPOTENCY_KEY),
            image: fs.existsSync(path.join(root, 'image.txt')) ? fs.readFileSync(path.join(root, 'image.txt'), 'utf8').trim() : null,
            timestamp: new Date().toISOString(),
            note: 'Dry-run is proof-only. Apply requires the exact workflow confirmation and writes immutable request-version rows only.'
          };
          fs.writeFileSync(path.join(root, 'workflow-summary.json'), JSON.stringify(summary, null, 2) + '\n');
          NODE

      - name: Upload request import proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-servicenow-request-import-job
          path: audit-artifacts/source-servicenow-request-import-job*
          if-no-files-found: error

name: Source NDA demo webhook secret

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type STORE_LAB_WEBHOOK_SECRET exactly; requires the production environment secret"
        required: true
        type: string

concurrency:
  group: source-nda-demo-webhook-secret
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-abarva-controlplane-lab-eastus
  VAULT_RESOURCE_GROUP: rg-abarva-shared-security-lab-eastus
  VAULT_NAME: kv-abarva-lab-001
  ACR_NAME: acrabarvalab001
  WEB_APP_NAME: ca-abarva-web-lab-eastus
  PRIVATE_OPERATOR_JOB: job-abarva-private-operator-eus
  BOOTSTRAP_ROLE_NAME: Source NDA Demo HMAC Bootstrap
  AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
  AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
  AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID }}

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Assert main and separate dispatch confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Main only' >&2; exit 1; }
          [[ "$CONFIRM" == STORE_LAB_WEBHOOK_SECRET ]] || { echo 'Exact confirmation required' >&2; exit 1; }
          [[ -n "$AZURE_DEPLOY_CLIENT_ID" && -n "$AZURE_DEPLOY_TENANT_ID" && -n "$AZURE_DEPLOY_SUBSCRIPTION_ID" ]]

      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Preflight private vault and approved image
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          vault_json="$(az keyvault show -g "$VAULT_RESOURCE_GROUP" -n "$VAULT_NAME" -o json)"
          jq -e '.properties.publicNetworkAccess == "Disabled" and .properties.enableRbacAuthorization == true' <<< "$vault_json" >/dev/null
          vault_id="$(jq -r '.id' <<< "$vault_json")"
          endpoint_json="$(az network private-endpoint-connection list --id "$vault_id" -o json)"
          approved="$(jq '[.[] | select(.properties.privateLinkServiceConnectionState.status == "Approved" and .properties.provisioningState == "Succeeded")] | length' <<< "$endpoint_json")"
          [[ "$approved" -gt 0 ]] || { echo 'Vault private endpoint is not approved' >&2; exit 1; }
          web_json="$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP_NAME" -o json)"
          image="$(jq -r '.properties.template.containers[0].image // empty' <<< "$web_json")"
          [[ "$image" == "$ACR_NAME.azurecr.io/abarva/web@sha256:"* ]] || { echo 'Web image is not digest pinned' >&2; exit 1; }
          revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<< "$web_json")"
          traffic="$(jq --arg revision "$revision" '[.properties.configuration.ingress.traffic[]? | select(.revisionName == $revision and .weight == 100)] | length' <<< "$web_json")"
          [[ -n "$revision" && "$traffic" -eq 1 ]] || { echo 'Serving revision does not own all traffic' >&2; exit 1; }
          revision_image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$WEB_APP_NAME" --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$revision_image" == "$image" ]] || { echo 'Template and serving revision images differ' >&2; exit 1; }
          operator_json="$(az containerapp job show -g "$RESOURCE_GROUP" -n "$PRIVATE_OPERATOR_JOB" -o json)"
          environment_id="$(jq -r '.properties.environmentId // empty' <<< "$operator_json")"
          [[ "$environment_id" == *"/cae-abarva-scale-lab-eastus" ]] || { echo 'Private job environment mismatch' >&2; exit 1; }
          echo "vault_id=$vault_id" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "environment_id=$environment_id" >> "$GITHUB_OUTPUT"

      - name: Create short-lived identity and metadata/set-only grant
        id: identity
        shell: bash
        env:
          VAULT_ID: ${{ steps.preflight.outputs.vault_id }}
        run: |
          set -euo pipefail
          identity_name="id-nda-hmac-bootstrap-$GITHUB_RUN_ID"
          identity_json="$(az identity create -g "$RESOURCE_GROUP" -n "$identity_name" -o json)"
          identity_id="$(jq -r '.id' <<< "$identity_json")"
          principal_id="$(jq -r '.principalId' <<< "$identity_json")"
          client_id="$(jq -r '.clientId' <<< "$identity_json")"
          acr_id="$(az acr show -n "$ACR_NAME" --query id -o tsv)"
          [[ -n "$identity_id" && -n "$principal_id" && -n "$client_id" && -n "$acr_id" ]]
          echo "identity_id=$identity_id" >> "$GITHUB_OUTPUT"
          echo "principal_id=$principal_id" >> "$GITHUB_OUTPUT"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          role_json="$(az role definition list --name "$BOOTSTRAP_ROLE_NAME" -o json)"
          if [[ "$(jq 'length' <<< "$role_json")" -eq 0 ]]; then
            role_path="$RUNNER_TEMP/source-nda-hmac-role-$GITHUB_RUN_ID.json"
            jq -n --arg name "$BOOTSTRAP_ROLE_NAME" --arg scope "/subscriptions/$AZURE_DEPLOY_SUBSCRIPTION_ID" \
              --arg id "$(cat /proc/sys/kernel/random/uuid)" \
              '{Name:$name,Id:$id,IsCustom:true,Description:"Temporarily list secret metadata and set the lab NDA HMAC secret",Actions:[],NotActions:[],DataActions:["Microsoft.KeyVault/vaults/secrets/readMetadata/action","Microsoft.KeyVault/vaults/secrets/setSecret/action"],NotDataActions:[],AssignableScopes:[$scope]}' > "$role_path"
            az role definition create --role-definition "$role_path" --output none
            rm -f "$role_path"
          else
            jq -e 'length == 1 and (.[0].permissions | length == 1) and
              (.[0].permissions[0].actions | length == 0) and
              (.[0].permissions[0].dataActions | sort == ["Microsoft.KeyVault/vaults/secrets/readMetadata/action","Microsoft.KeyVault/vaults/secrets/setSecret/action"])' \
              <<< "$role_json" >/dev/null || { echo 'Existing role is over-permissioned' >&2; exit 1; }
          fi
          acr_assignment="$(az role assignment create --assignee-object-id "$principal_id" --assignee-principal-type ServicePrincipal \
            --role AcrPull --scope "$acr_id" --query id -o tsv)"
          [[ "$acr_assignment" == */providers/Microsoft.Authorization/roleAssignments/* ]]
          echo "acr_assignment=$acr_assignment" >> "$GITHUB_OUTPUT"
          vault_assignment="$(az role assignment create --assignee-object-id "$principal_id" --assignee-principal-type ServicePrincipal \
            --role "$BOOTSTRAP_ROLE_NAME" --scope "$VAULT_ID" --query id -o tsv)"
          [[ "$vault_assignment" == */providers/Microsoft.Authorization/roleAssignments/* ]]
          echo "vault_assignment=$vault_assignment" >> "$GITHUB_OUTPUT"

      - name: Write job secret and run inside private network
        id: execution
        shell: bash
        env:
          SOURCE_NDA_DEMO_WEBHOOK_HMAC: ${{ secrets.SOURCE_NDA_DEMO_WEBHOOK_HMAC }}
          IMAGE: ${{ steps.preflight.outputs.image }}
          ENVIRONMENT_ID: ${{ steps.preflight.outputs.environment_id }}
          IDENTITY_ID: ${{ steps.identity.outputs.identity_id }}
          CLIENT_ID: ${{ steps.identity.outputs.client_id }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_NDA_DEMO_WEBHOOK_HMAC" ]] || { echo 'Encrypted environment secret is missing' >&2; exit 1; }
          export JOB_NAME="nda-hmac-$GITHUB_RUN_ID"
          spec_path="$RUNNER_TEMP/source-nda-hmac-job-$GITHUB_RUN_ID.yaml"
          error_path="$RUNNER_TEMP/source-nda-hmac-az-$GITHUB_RUN_ID.err"
          trap 'rm -f "$spec_path" "$error_path"' EXIT
          node scripts/ops/docusign-lab-webhook-secret-job.mjs "$spec_path"
          unset SOURCE_NDA_DEMO_WEBHOOK_HMAC
          sleep 30
          if ! az containerapp job create -g "$RESOURCE_GROUP" -n "$JOB_NAME" --yaml "$spec_path" --output none 2>"$error_path"; then
            echo 'Private operator job creation failed; error output withheld because it may contain secret material' >&2
            exit 1
          fi
          rm -f "$spec_path" "$error_path"
          execution="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv)"
          [[ -n "$execution" ]]
          status=unknown
          for attempt in $(seq 1 30); do
            status="$(az containerapp job execution show -g "$RESOURCE_GROUP" -n "$JOB_NAME" \
              --job-execution-name "$execution" --query properties.status -o tsv 2>/dev/null || true)"
            [[ "$status" == Succeeded || "$status" == Failed || "$status" == Canceled ]] && break
            sleep 10
          done
          [[ "$status" == Succeeded ]] || { echo "Private webhook-secret job $status; logs withheld" >&2; exit 1; }
          echo 'Demo webhook secret write job succeeded. Secret value was not read back or logged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove job, grants, and bootstrap identity
        if: always() && steps.identity.outcome != 'skipped'
        shell: bash
        env:
          VAULT_ID: ${{ steps.preflight.outputs.vault_id }}
          ACR_ASSIGNMENT: ${{ steps.identity.outputs.acr_assignment }}
          VAULT_ASSIGNMENT: ${{ steps.identity.outputs.vault_assignment }}
        run: |
          set -euo pipefail
          job_name="nda-hmac-$GITHUB_RUN_ID"
          identity_name="id-nda-hmac-bootstrap-$GITHUB_RUN_ID"
          az containerapp job delete -g "$RESOURCE_GROUP" -n "$job_name" --yes --output none 2>/dev/null || true
          principal="$(az identity show -g "$RESOURCE_GROUP" -n "$identity_name" --query principalId -o tsv 2>/dev/null || true)"
          if [[ -z "$principal" && ( -n "$ACR_ASSIGNMENT" || -n "$VAULT_ASSIGNMENT" ) ]]; then
            echo 'Identity missing while temporary grants may remain; manual cleanup required' >&2
            exit 1
          fi
          if [[ -n "$principal" ]]; then
            acr_id="$(az acr show -n "$ACR_NAME" --query id -o tsv)"
            for entry in "$BOOTSTRAP_ROLE_NAME|$VAULT_ID|$VAULT_ASSIGNMENT" "AcrPull|$acr_id|$ACR_ASSIGNMENT"; do
              role="${entry%%|*}"
              remainder="${entry#*|}"
              scope="${remainder%%|*}"
              recorded="${remainder#*|}"
              if [[ -n "$recorded" ]]; then
                az role assignment delete --ids "$recorded"
              fi
              remaining="$(az role assignment list --assignee-object-id "$principal" --role "$role" --scope "$scope" --query '[].id' -o tsv)"
              while IFS= read -r assignment; do
                [[ -n "$assignment" ]] && az role assignment delete --ids "$assignment"
              done <<< "$remaining"
              for attempt in 1 2 3 4 5; do
                remaining="$(az role assignment list --assignee-object-id "$principal" --role "$role" --scope "$scope" --query '[].id' -o tsv)"
                [[ -z "$remaining" ]] && break
                sleep 5
              done
              [[ -z "$remaining" ]] || { echo "Temporary $role grant remains" >&2; exit 1; }
            done
            az identity delete -g "$RESOURCE_GROUP" -n "$identity_name" --output none
          fi
          [[ -z "$(az identity show -g "$RESOURCE_GROUP" -n "$identity_name" --query id -o tsv 2>/dev/null || true)" ]]
          [[ -z "$(az containerapp job show -g "$RESOURCE_GROUP" -n "$job_name" --query id -o tsv 2>/dev/null || true)" ]]
          echo 'Temporary job, grants, and identity removed.' >> "$GITHUB_STEP_SUMMARY"

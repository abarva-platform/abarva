name: First Capital refresh load

on:
  workflow_dispatch:
    inputs:
      tenant_key:
        description: "First Capital tenant alias to load."
        required: true
        default: "first-capital"
        type: choice
        options:
          - first-capital
          - firstcapital
      dry_run:
        description: "Plan the refresh without writing to the database."
        required: false
        type: boolean
        default: true
      require_live_embeddings:
        description: "Fail unless Azure/OpenAI embedding credentials are configured."
        required: false
        type: boolean
        default: true
      evaluate_insights:
        description: "Run the context insight evaluator after a write load."
        required: false
        type: boolean
        default: true
      run_population_audit:
        description: "Run the live tenant population audit after the load."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  first-capital-refresh-load:
    name: Load First Capital through private ACA operator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
      AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
      AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID || '701a8554-a166-46e9-bf13-743bc50e3b20' }}
      RESOURCE_GROUP: ${{ vars.AZURE_PRIVATE_OPERATOR_RESOURCE_GROUP || vars.AZURE_WEB_RESOURCE_GROUP || 'rg-abarva-controlplane-lab-eastus' }}
      PRIVATE_OPERATOR_JOB: ${{ vars.AZURE_PRIVATE_OPERATOR_JOB_NAME || 'job-abarva-private-operator-eus' }}
      PRIVATE_OPERATOR_ENVIRONMENT_ID: ${{ vars.AZURE_PRIVATE_OPERATOR_ENVIRONMENT_ID || '/subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.App/managedEnvironments/cae-abarva-scale-lab-eastus' }}
      PRIVATE_OPERATOR_REGISTRY_SERVER: ${{ vars.AZURE_PRIVATE_OPERATOR_REGISTRY_SERVER || 'acrabarvalab001.azurecr.io' }}
      PRIVATE_OPERATOR_REGISTRY_IDENTITY: ${{ vars.AZURE_PRIVATE_OPERATOR_REGISTRY_IDENTITY || '/subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-abarva-scale-runtime-lab-eastus' }}
      DATABASE_SECRET_NAME: ${{ vars.AZURE_PRIVATE_OPERATOR_DATABASE_SECRET_NAME || 'azure-postgres-control-database-url' }}
      DATABASE_SECRET_KEYVAULT_URL: ${{ vars.AZURE_PRIVATE_OPERATOR_DATABASE_SECRET_KEYVAULT_URL || 'https://kv-abarva-lab-001.vault.azure.net/secrets/azure-postgres-control-database-url' }}
      OPENAI_SECRET_NAME: ${{ vars.AZURE_PRIVATE_OPERATOR_OPENAI_SECRET_NAME || 'openai-api-key' }}
      OPENAI_SECRET_KEYVAULT_URL: ${{ vars.AZURE_PRIVATE_OPERATOR_OPENAI_SECRET_KEYVAULT_URL || 'https://kv-abarva-lab-001.vault.azure.net/secrets/openai-api-key' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Prepare private operator job
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-artifacts/first-capital-refresh-load

          image="$(
            az containerapp job show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_OPERATOR_JOB" \
              --query 'properties.template.containers[0].image' \
              -o tsv
          )"

          if [ -z "$image" ]; then
            echo "Could not resolve current private operator image." >&2
            exit 1
          fi

          {
            echo "PRIVATE_OPERATOR_IMAGE=$image"
            echo "PRIVATE_OPERATOR_CONTAINER=firstcapital-refresh-load"
            echo "PRIVATE_REFRESH_JOB=fc-refresh-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

          cat > audit-artifacts/first-capital-refresh-load/private-operator-job.yaml <<YAML
          name: fc-refresh-${GITHUB_RUN_ID}
          identity:
            type: UserAssigned
            userAssignedIdentities:
              ${PRIVATE_OPERATOR_REGISTRY_IDENTITY}: {}
          properties:
            environmentId: ${PRIVATE_OPERATOR_ENVIRONMENT_ID}
            configuration:
              triggerType: Manual
              replicaRetryLimit: 0
              replicaTimeout: 3600
              manualTriggerConfig:
                parallelism: 1
                replicaCompletionCount: 1
              registries:
                - server: ${PRIVATE_OPERATOR_REGISTRY_SERVER}
                  identity: ${PRIVATE_OPERATOR_REGISTRY_IDENTITY}
              secrets:
                - name: ${DATABASE_SECRET_NAME}
                  keyVaultUrl: ${DATABASE_SECRET_KEYVAULT_URL}
                  identity: ${PRIVATE_OPERATOR_REGISTRY_IDENTITY}
                - name: ${OPENAI_SECRET_NAME}
                  keyVaultUrl: ${OPENAI_SECRET_KEYVAULT_URL}
                  identity: ${PRIVATE_OPERATOR_REGISTRY_IDENTITY}
            template:
              containers:
                - name: firstcapital-refresh-load
                  image: ${image}
                  imageType: ContainerImage
                  command:
                    - /bin/sh
                  args:
                    - -lc
                    - |
                      set -eu
                      cd /app
                      echo '{"event":"firstcapital_refresh_start","tenant_key":"${{ inputs.tenant_key }}","dry_run":"${{ inputs.dry_run }}"}'
                      if [ "${{ inputs.require_live_embeddings }}" = "true" ] && [ -z "\${OPENAI_API_KEY:-}" ] && { [ -z "\${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}" ] || [ -z "\${AZURE_OPENAI_EMBEDDING_KEY:-}" ]; }; then
                        echo "Live embeddings required, but neither OPENAI_API_KEY nor Azure embedding env is available inside the private operator." >&2
                        exit 1
                      fi
                      load_args=""
                      if [ "${{ inputs.dry_run }}" = "true" ]; then
                        load_args="--dry-run"
                      fi
                      TENANT_KEY="${{ inputs.tenant_key }}" npx tsx scripts/seed/load-tenant-substrate.ts \${load_args}
                      if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.evaluate_insights }}" = "true" ]; then
                        TENANT_KEY="${{ inputs.tenant_key }}" npm run intel:context-insights:evaluate -- --tenant=first-capital
                      fi
                      if [ "${{ inputs.run_population_audit }}" = "true" ]; then
                        node <<'NODE'
                      const fs = require('node:fs');
                      const { createRequire } = require('node:module');
                      const req = createRequire('/app/package.json');
                      const { Client } = req('pg');
                      const tenantKeys = ['first-capital', 'firstcapital', 'arcturus'];

                      async function count(client, sql, params) {
                        const result = await client.query(sql, params);
                        return Number(result.rows[0]?.n ?? 0);
                      }

                      (async () => {
                        const client = new Client({
                          connectionString: process.env.DATABASE_URL,
                          ssl: { rejectUnauthorized: false },
                        });
                        await client.connect();
                        const clientResult = await client.query(
                          'select id, tenant_key, slug, name from clients where tenant_key = any(\$1::text[]) or slug = any(\$1::text[]) order by case when tenant_key = \$2 then 0 else 1 end, created_at nulls last limit 1',
                          [tenantKeys, 'first-capital'],
                        );
                        const clientRow = clientResult.rows[0];
                        if (!clientRow) throw new Error('No First Capital client row found for population audit');
                        const clientId = clientRow.id;
                        const audit = {
                          event: 'firstcapital_population_audit',
                          tenant_keys: tenantKeys,
                          client: clientRow,
                          counts: {
                            applications: await count(client, 'select count(*)::int as n from applications where client_id = \$1', [clientId]),
                            ai_initiatives: await count(client, 'select count(*)::int as n from ai_initiatives where client_id = \$1', [clientId]),
                            vendor_contracts: await count(client, 'select count(*)::int as n from vendor_contracts where client_id = \$1', [clientId]),
                            context_chunks_by_client: await count(client, 'select count(*)::int as n from enterprise_context_chunks where client_id = \$1', [clientId]),
                            context_chunks_by_tenant: await count(client, 'select count(*)::int as n from enterprise_context_chunks where tenant_key = any(\$1::text[])', [tenantKeys]),
                            context_insights_active: await count(client, "select count(*)::int as n from context_insights where tenant_key = any(\$1::text[]) and lifecycle_state = 'active'", [tenantKeys]),
                            active_moves: await count(client, 'select count(*)::int as n from engagements where client_id::text = \$1 and archived_at is null and deleted_at is null', [clientId]),
                            active_source_events: await count(client, "select count(*)::int as n from source_events where client_key = any(\$1::text[]) and lifecycle_state <> 'archived'", [tenantKeys]),
                          },
                        };
                        fs.mkdirSync('/tmp/abarva-data-quality', { recursive: true });
                        fs.writeFileSync('/tmp/abarva-data-quality/first-capital-population-audit.json', JSON.stringify(audit, null, 2));
                        console.log(JSON.stringify(audit, null, 2));
                        await client.end();
                      })().catch((error) => {
                        console.error(error);
                        process.exit(1);
                      });
                      NODE
                      fi
                      node -e 'const { createRequire } = require("node:module"); const req = createRequire("/app/package.json"); const { Client } = req("pg"); const aliases = ["first-capital","firstcapital","arcturus"]; (async () => { const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } }); await client.connect(); const clients = await client.query("select id, tenant_key, slug, name from clients where tenant_key = any(\$1::text[]) or slug = any(\$1::text[]) order by case when tenant_key=\$2 then 0 else 1 end, created_at nulls last", [aliases, "${{ inputs.tenant_key }}"]); const first = clients.rows[0]; if (!first) throw new Error("No First Capital client row found"); const counts = await client.query("select (select count(*)::int from applications where client_id=\$1) as applications, (select count(*)::int from ai_initiatives where client_id=\$1) as ai_initiatives, (select count(*)::int from vendor_contracts where client_id=\$1) as vendor_contracts, (select count(*)::int from enterprise_context_chunks where client_id=\$1) as chunks_by_client, (select count(*)::int from enterprise_context_chunks where tenant_key = any(\$2::text[])) as chunks_by_tenant, (select count(*)::int from engagements where client_id::text=\$1 and archived_at is null and deleted_at is null) as active_moves, (select count(*)::int from source_events where client_key = any(\$2::text[]) and lifecycle_state <> '"'"'archived'"'"') as active_source_events", [first.id, aliases]); console.log(JSON.stringify({ event: "firstcapital_refresh_receipt", client: first, counts: counts.rows[0], aliases }, null, 2)); await client.end(); })().catch((error) => { console.error(error); process.exit(1); });'
                  env:
                    - name: DATABASE_URL
                      secretRef: ${DATABASE_SECRET_NAME}
                    - name: OPENAI_API_KEY
                      secretRef: ${OPENAI_SECRET_NAME}
                    - name: NODE_OPTIONS
                      value: --conditions=react-server
                  resources:
                    cpu: 0.5
                    memory: 1Gi
            workloadProfileName: Consumption
          resourceGroup: ${RESOURCE_GROUP}
          YAML

      - name: Run private operator load
        id: run
        shell: bash
        run: |
          set -euo pipefail

          az containerapp job create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_REFRESH_JOB" \
            --yaml audit-artifacts/first-capital-refresh-load/private-operator-job.yaml \
            --output none

          execution="$(
            az containerapp job start \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_REFRESH_JOB" \
              --query name \
              -o tsv
          )"

          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "$execution" > audit-artifacts/first-capital-refresh-load/private-operator-execution.txt

          for attempt in $(seq 1 90); do
            status="$(
              az containerapp job execution show \
                --resource-group "$RESOURCE_GROUP" \
                --name "$PRIVATE_REFRESH_JOB" \
                --job-execution-name "$execution" \
                --query 'properties.status' \
                -o tsv 2>/dev/null || true
            )"

            echo "execution=$execution status=${status:-unknown} attempt=$attempt"
            case "$status" in
              Succeeded)
                break
                ;;
              Failed|Canceled)
                break
                ;;
            esac
            sleep 20
          done

          az containerapp job logs show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_REFRESH_JOB" \
            --execution "$execution" \
            --container "$PRIVATE_OPERATOR_CONTAINER" \
            --tail 300 \
            | tee audit-artifacts/first-capital-refresh-load/private-operator.log || true

          if [ "${status:-}" != "Succeeded" ]; then
            echo "Private operator execution did not succeed: ${status:-unknown}" >&2
            exit 1
          fi

      - name: Delete private refresh job
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PRIVATE_REFRESH_JOB:-}" ]; then
            echo "PRIVATE_REFRESH_JOB was not set; nothing to delete."
            exit 0
          fi

          az containerapp job delete \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_REFRESH_JOB" \
            --yes \
            --output none || true

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-capital-refresh-load
          path: audit-artifacts/first-capital-refresh-load
          if-no-files-found: warn

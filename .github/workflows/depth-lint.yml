name: Depth Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/standards/**"
      - "docs/corpus-author-log/**"
      - "docs/template-author-log/**"
      - "docs/instrument-author-log/**"
      - "docs/workshop-author-log/**"
      - "worldview/**"
      - "src/lib/depth/**"
      - "scripts/lint/depth-lint.ts"
      - ".github/workflows/depth-lint.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  depth-lint:
    name: Score depth exemplars
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run depth lint
        id: depth
        shell: bash
        run: |
          set +e
          npm run --silent lint:depth -- --all > depth-lint-results.json
          rc=$?
          cat depth-lint-results.json
          {
            echo "## Depth lint"
            echo
            echo '```json'
            cat depth-lint-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment PR depth scores
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE' > depth-comment.md
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('depth-lint-results.json', 'utf8'));
          const results = report.results || [report];
          const rows = results.map((r) => `| ${r.artifact_id} | ${r.rubric_type} | ${r.total_score}/10 | ${r.pass ? 'PASS' : 'BLOCK'} |`);
          console.log('## Depth lint scores');
          console.log('');
          console.log('| Artifact | Rubric | Score | Result |');
          console.log('|---|---:|---:|---|');
          console.log(rows.join('\n'));
          console.log('');
          console.log(`Estimated run cost: $${Number(report.estimated_cost_usd || 0).toFixed(4)}`);
          NODE
          gh pr comment "$PR_NUMBER" --body-file depth-comment.md

      - name: Enforce threshold
        run: |
          if [ "${{ steps.depth.outputs.exit_code }}" != "0" ]; then
            echo "::error::Depth lint failed. Every artifact must score at least 8/10 and PR estimated lint cost must stay under $5."
            exit 1
          fi

name: Depth Lint

# Required branch-protection context; keep pull_request paths aligned.
on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/standards/**"
      - "docs/corpus-author-log/**"
      - "docs/template-author-log/**"
      - "docs/instrument-author-log/**"
      - "docs/workshop-author-log/**"
      - "worldview/**"
      - "src/lib/depth/**"
      - "scripts/lint/depth-lint.ts"
      - ".github/workflows/depth-lint.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  depth-lint:
    name: Score depth exemplars
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run depth lint
        id: depth
        shell: bash
        run: |
          set +e
          npm run --silent lint:depth -- --all > depth-lint-results.json 2> depth-lint-error.log
          rc=$?
          if ! node -e "JSON.parse(require('fs').readFileSync('depth-lint-results.json', 'utf8'))" 2>/dev/null; then
            node scripts/ci/write-depth-lint-failure.cjs > depth-lint-results.json
            rc=1
          fi
          cat depth-lint-results.json
          {
            echo "## Depth lint"
            echo
            echo '```json'
            cat depth-lint-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment PR depth scores
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/ci/render-depth-lint-comment.cjs > depth-comment.md
          gh pr comment "$PR_NUMBER" --body-file depth-comment.md

      - name: Enforce threshold
        run: |
          if [ "${{ steps.depth.outputs.exit_code }}" != "0" ]; then
            echo "::error::Depth lint failed. Every artifact must score at least 8/10 and PR estimated lint cost must stay under $5."
            exit 1
          fi

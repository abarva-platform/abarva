name: Canonical Tenant Drift

# Required branch-protection context; keep pull_request paths aligned.
on:
  merge_group:
  pull_request:
    branches:
      - main
    paths:
      - src/config/tenants/CANONICAL_TENANTS.ts
      - src/**
      - scripts/**
      - tests/**
      - supabase/migrations/**
      - scripts/verify-canonical-tenants.ts
      - scripts/verify-retired-tenant-references.mjs
      - .github/workflows/canonical-tenant-drift.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

jobs:
  canonical-tenant-drift:
    name: Verify canonical tenant allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical tenant drift
        run: npm run db:verify:canonical-tenants

      - name: Verify retired tenant references
        run: npm run db:verify:retired-tenants

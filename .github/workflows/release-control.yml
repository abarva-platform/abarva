name: Release Control Gate

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  release-control:
    name: Release record and impact note
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Prove the tenant-narrative guard's own term derivation
        run: npm run check:release-record-tenant-narrative-guard

      - name: Refuse a newly derived single-word tenant term without a read
        run: npm run check:tenant-narrative-term-drift

      - name: Prove the Layer Impact lane rule can fail
        run: npm run check:release-record-lane-guard

      - name: Prove the release record template matches the gate
        run: npm run check:release-record-template-contract

      - name: Prove the release check runs every gate it lists
        run: npm run check:release-check-runs-every-gate

      # The ACA runtime invariant is stated over "all required worker job
      # images". This proves the set it enforces is DERIVED from the deploy
      # script that re-images them, not restated in a second hand-typed list
      # that can quietly stop matching (item C-589). `--print-worker-jobs`
      # resolves and exits before any az or curl call, so this touches nothing.
      - name: Prove the enforced worker-job set is derived from the deploy script
        run: npm run check:aca-worker-job-set-derived

      # A triage verdict is written at a base commit and addresses a future
      # reader. When its subject file is later deleted the row keeps giving an
      # instruction about a path that cannot be opened, and nothing expires it:
      # the reconciliation that counts these rows is a report by design, because
      # the rows it prints under an OPEN verdict are work that is owed. This is
      # scoped to the disjoint case where the SUBJECT is gone, which is not owed
      # work, and the only repair is to record where it went (item 26).
      - name: Prove no triage verdict addresses a file that is gone
        run: npm run check:triage-verdict-discharge

      - name: Check release record
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: npm run release:check -- --base origin/${BASE_REF} --head HEAD

name: Release Control Gate

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  release-control:
    name: Release record and impact note
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check release record
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: npm run release:check -- --base origin/${BASE_REF} --head HEAD

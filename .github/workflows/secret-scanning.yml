name: Secret Scanning

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks PR diff
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan PR diff for secrets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: npm run secrets:scan -- --log-opts="origin/${BASE_REF}..HEAD"

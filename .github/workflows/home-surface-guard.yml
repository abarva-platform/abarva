# Home Surface Guard
#
# Purpose: run every Jest suite on the Home surface on each pull request and each
# push to `main`, and fail on any movement away from a recorded baseline.
#
# Why a dedicated workflow: none of the other gates ran these. The Home suites
# passed on the machine of whoever last ran them and gated nothing, and a red
# test reached `main` while every check on its pull request went green.
#
# Why a baseline rather than a plain pass/fail: the surface is already red. 18 of
# its 68 suites were failing when this landed, most of them on legacy Home paths.
# A check that is red on the day it arrives teaches everyone to ignore it, so the
# baseline records what was already broken and the check fails on anything new.
# It ratchets one way -- see docs/ci/README-test-ratchet.md.
#
# There is no path filter on purpose. Most of what has broken this surface was
# changed somewhere else: the projection builder, the tenant registry, a shared
# component. A guard that only fired when `src/components/home/**` changed would
# not have caught any of them.
#
# Runs alongside the other CI checks rather than in front of them.

name: Home Surface Guard

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: home-surface-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-guard:
    name: Home surface tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Home surface tests against the baseline
        run: node scripts/ci/test-ratchet.mjs docs/ci/home-test-baseline.json

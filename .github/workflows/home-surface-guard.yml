# Home Surface Guard
#
# Purpose: run the Home surface's own tests on every PR and every push to main.
#
# Why a dedicated workflow: none of the other gates run them. The Home suites
# were passing locally and gating nothing, and a red test reached `main` and sat
# there -- a context item had lost the assessment id naming the record it was
# built from, so two tenants' packets read identically in the model's context,
# and every check on that PR still went green.
#
# There is no path filter on purpose. Most of what has broken this surface was
# changed somewhere else: the projection builder, the tenant registry, a shared
# component. A guard that only fires when `src/components/home/**` changes would
# not have caught any of them.
#
# Runs alongside the other CI checks rather than in front of them.

name: Home Surface Guard

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: home-surface-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-guard:
    name: Home surface tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Home surface Jest tests
        # --json is read by the step below. Jest already fails when a path matches
        # no test files; the count check is what catches a suite that still runs
        # but has quietly stopped covering anything.
        run: |
          npx jest src/components/home/v4/__tests__ src/lib/home/preview/__tests__ \
            --silent --json --outputFile=/tmp/home-jest.json

      - name: Assert the guard still covers the surface
        if: always()
        run: node scripts/ci/assert-home-test-floor.mjs /tmp/home-jest.json

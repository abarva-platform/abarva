name: ECL physical admission

on:
  pull_request:
    branches:
      - main
    # Every file the generator, the adapter, the loader and these tests read.
    # A change to the source definition, the relationship map or the dataset
    # registry changes what would be loaded, so it has to run this proof too.
    paths:
      - ".github/workflows/ecl-physical-admission.yml"
      - "config/ecl/synthetic-enterprise-v1-relationship-map.json"
      - "datasets/synthetic/**"
      - "datasets/tenant-inputs/tenant-input-registry.json"
      - "docs/architecture/sql-drafts/ecl_physical_schema_v1_draft.sql"
      - "docs/governance/dataset-manifests/**"
      - "scripts/ecl/generate_synthetic_enterprise_v1.py"
      - "scripts/ecl/normalize_synthetic_enterprise_v1.py"
      - "scripts/ecl/validate_synthetic_enterprise_v1.py"
      - "scripts/ecl/__tests__/test_synthetic_ecl_physical_admission.py"
      - "scripts/ecl/__tests__/test_synthetic_enterprise_v1_load.ts"
      - "scripts/ecl/__tests__/test_synthetic_enterprise_v1_load_gate.ts"
      - "scripts/ecl/__tests__/test_synthetic_enterprise_v2_load.ts"
      - "scripts/ecl/__tests__/test_synthetic_enterprise_home_projection.ts"
      - "scripts/ecl/__tests__/test_synthetic_enterprise_home_promotion.ts"
      - "scripts/ecl/project_synthetic_enterprise_home.ts"
      - "scripts/ecl/promote_synthetic_enterprise_home.ts"
      - "scripts/ecl/retire_synthetic_enterprise_home.ts"
      - "scripts/ecl/synthetic_enterprise_home_rows.ts"
      - "scripts/ecl/load_synthetic_enterprise_v1.ts"
      - "src/config/tenants/CANONICAL_TENANTS.ts"
      - "src/lib/governance/context-corpus-policy.ts"
      - "src/lib/governance/dataset-manifest.ts"
      - "supabase/migrations/20260831031000_ecl_substrate_baseline.sql"
      - "supabase/migrations/20261001183000_ecl_enterprise_context_admission.sql"
      - "supabase/migrations/20261002013000_home_active_assessment.sql"
      - "supabase/migrations/20260901090000_home_serving_views_intake_families.sql"
      - "supabase/migrations/20260902090000_home_serving_view_executive_interviews.sql"
      - "supabase/migrations/20260902100000_home_serving_view_relationships.sql"
  workflow_dispatch:

jobs:
  physical-admission:
    name: Synthetic ECL physical admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecl_admission_test
          POSTGRES_USER: ecl_test
          POSTGRES_PASSWORD: ecl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecl_test -d ecl_admission_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Check Postgres client
        run: command -v psql
      - name: Prove additive ECL admission on disposable Postgres
        env:
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: python3 scripts/ecl/__tests__/test_synthetic_ecl_physical_admission.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refuse a load the dataset registry has not approved
        run: node --import tsx --test scripts/ecl/__tests__/test_synthetic_enterprise_v1_load_gate.ts
      - name: Load and read back synthetic source and canonical rows
        env:
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: npx tsx scripts/ecl/__tests__/test_synthetic_enterprise_v1_load.ts
      - name: Load and read back versioned logical applications
        env:
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: npx tsx scripts/ecl/__tests__/test_synthetic_enterprise_v2_load.ts
      - name: Apply additive Home serving readers in the disposable database
        env:
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: |
          psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260901090000_home_serving_views_intake_families.sql
          psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260902090000_home_serving_view_executive_interviews.sql
          psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260902100000_home_serving_view_relationships.sql
      - name: Project canonical enterprise rows to shadow Home serving views
        env:
          NODE_OPTIONS: --conditions=react-server
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: npx tsx scripts/ecl/__tests__/test_synthetic_enterprise_home_projection.ts
      - name: Rehearse inert Home selection migration
        env:
          ECL_ADMISSION_TEST_DATABASE_URL: postgresql://ecl_test:ecl_test@127.0.0.1:5432/ecl_admission_test
        run: |
          psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002013000_home_active_assessment.sql
          psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002013000_home_active_assessment.sql
          test "$(psql "$ECL_ADMISSION_TEST_DATABASE_URL" -X -At -c 'select count(*) from ecl_projection.home_active_assessment')" = 0
      - name: Prove generated Home admission spine
        run: npm run test:ecl:synthetic-enterprise-v2:promote-home

name: Wave 0 Quality Gate

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wave0-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave0-quality-gate:
    name: Wave 0 harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run Wave 0 gate
        run: npm run wave0:quality-gate

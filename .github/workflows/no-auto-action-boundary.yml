name: No Auto-Action Boundary

on:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: no-auto-action-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-auto-action-boundary:
    name: Agent tool no-auto-action boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Check agent tool boundary
        run: npm run audit:no-auto-action-boundary

name: Context Corpus Governance

# The hard gate for the Context & Corpus Governance Framework. Static, DB-free
# enforcement: a future change from ANY agent (Codex or Claude Code) cannot
# quietly weaken the policy contract, mint agent_ready outside the gate, hand-type
# tenant lists, or leave an expired exception in place. Keep pull_request paths
# aligned with branch protection.
on:
  merge_group:
  pull_request:
    branches:
      - main
    paths:
      - src/lib/governance/**
      - src/lib/ecl/insights/**
      - scripts/ecl/integrated_insights_job.ts
      - scripts/ecl/synthetic_enterprise_home_job.ts
      - scripts/ecl/__tests__/integrated-insights.test.ts
      - src/__tests__/behaviors/delegated-approval.test.ts
      - src/scripts/governance/**
      - src/config/tenants/CANONICAL_TENANTS.ts
      - src/lib/tenant/synthetic-tenant-declaration.ts
      - datasets/tenant-inputs/tenant-input-registry.json
      - docs/governance/policy-exceptions.json
      - docs/governance/dataset-manifests/**
      - .github/workflows/context-corpus-governance.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

jobs:
  context-corpus-governance:
    name: Context corpus governance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate context & corpus governance
        run: npm run validate:context-corpus

      - name: Policy exception tests
        run: npx jest src/lib/governance/__tests__/policy-exceptions.test.ts

      - name: Legacy approval tests
        run: npx jest --runInBand src/lib/governance/__tests__/dataset-manifest.test.ts

      - name: Native insight load approval tests
        run: npx jest --runInBand src/lib/ecl/insights/__tests__/load-approval.test.ts

      - name: Native candidate load regressions
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npm run test:ecl-integrated-insights

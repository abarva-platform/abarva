name: Agent quality live runner

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "41 11 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates runnable case selection; live executes /api/chat/agent with AGENT_QUALITY_SESSION_COOKIE."
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      base_url:
        description: "Base URL for live mode."
        required: false
        default: "https://app.abarva.ai"
      auth_mode:
        description: "Live auth mode. cookie uses AGENT_QUALITY_SESSION_COOKIE; demo-sign-in signs in per case."
        required: false
        default: "cookie"
        type: choice
        options:
          - cookie
          - demo-sign-in
      agent:
        description: "Optional agent filter: sentinel, atlas, nexus, source, steward."
        required: false
        default: ""
      tenant:
        description: "Optional tenant filter: meridian-health or skyharbor-air."
        required: false
        default: ""
      limit:
        description: "Optional case limit for live mode."
        required: false
        default: ""

jobs:
  agent-quality:
    name: Agent quality corpus runner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && inputs.auth_mode == 'demo-sign-in' }}
        run: npx playwright install chromium --with-deps

      - name: Validate corpus contract
        run: npm run qa:agent-quality:corpus

      - name: Build filters
        id: filters
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ inputs.agent }}" ]; then ARGS="$ARGS --agent ${{ inputs.agent }}"; fi
          if [ -n "${{ inputs.tenant }}" ]; then ARGS="$ARGS --tenant ${{ inputs.tenant }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Dry-run case selection
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'dry-run' }}
        run: npm run qa:agent-quality:runner -- --mode dry-run ${{ steps.filters.outputs.args }} --out agent-quality-plan.json

      - name: Verify live auth secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && inputs.auth_mode == 'cookie' }}
        env:
          AGENT_QUALITY_SESSION_COOKIE: ${{ secrets.AGENT_QUALITY_SESSION_COOKIE }}
        shell: bash
        run: |
          if [ -z "$AGENT_QUALITY_SESSION_COOKIE" ]; then
            {
              echo "### Missing live-run authentication"
              echo
              echo "Live agent-quality execution requires repository secret \`AGENT_QUALITY_SESSION_COOKIE\`."
              echo "Create a short-lived authenticated app session cookie for the selected base URL, store it as the secret, and re-run this workflow."
              echo
              echo "Dry-run mode remains available without this secret."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing AGENT_QUALITY_SESSION_COOKIE::Live mode requires repository secret AGENT_QUALITY_SESSION_COOKIE. Re-run in dry-run mode or add a short-lived authenticated session cookie."
            exit 1
          fi

      - name: Live agent quality run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' }}
        env:
          AGENT_QUALITY_SESSION_COOKIE: ${{ secrets.AGENT_QUALITY_SESSION_COOKIE }}
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD || 'Demo2026!' }}
          E2E_DEMO_ACCESS_CODE: ${{ secrets.E2E_DEMO_ACCESS_CODE || '424242' }}
        run: |
          npm run qa:agent-quality:runner -- \
            --mode live \
            --base-url "${{ inputs.base_url }}" \
            --auth-mode "${{ inputs.auth_mode }}" \
            ${{ steps.filters.outputs.args }} \
            --out agent-quality-answers.jsonl

      - name: Upload plan
        if: ${{ always() && hashFiles('agent-quality-plan.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-quality-plan
          path: agent-quality-plan.json
          retention-days: 14

      - name: Upload answers
        if: ${{ always() && hashFiles('agent-quality-answers.jsonl') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-quality-answers
          path: agent-quality-answers.jsonl
          retention-days: 14

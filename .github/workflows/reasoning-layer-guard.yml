# Reasoning Layer Guard
#
# Purpose: enforce that the reasoning layer (`src/lib/reasoning/*`) is
# always type-safe and that its ~620 unit tests pass on every PR and
# every push to main. The reasoning layer is critical infrastructure
# for cascade analysis, contradiction detection, and instance health,
# so we gate it with a dedicated workflow rather than relying on broad
# CI coverage.
#
# This workflow runs alongside (not in front of) the other CI checks
# so other gates can still complete independently.

name: Reasoning Layer Guard

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reasoning-layer-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reasoning-guard:
    name: Typecheck + reasoning-layer tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck (full project)
        # One command, defined in scripts/quality/typecheck.mjs: it removes any
        # .tsbuildinfo first, raises the heap above where this project OOMs, and
        # exits 3 on a crash so an abort can never read as a clean run. The heap
        # floor lives in the script, not here, so a local run gets it too.
        run: npm run typecheck

      - name: Reasoning-layer Jest tests
        run: npx jest src/lib/reasoning --silent

      # The reasoning ROUTES, not just the library. Added with item C-527,
      # whose behavioural case for `/api/reasoning/stage-synthesis` landed in a
      # directory no workflow ran — which the coverage census caught and is the
      # reason this step exists. A control that CI never executes is the defect
      # class this guard exists against, so the whole directory is named rather
      # than one file: a case added beside a future reasoning route is wired by
      # being written, not by someone remembering to edit this list.
      #
      # `src/app/api/reasoning/gate-waiver` is also run by
      # ai-surface-control-catalog.yml. Running it twice is cheap; leaving a new
      # sibling directory unrun is not.
      - name: Reasoning route Jest tests
        run: npx jest src/app/api/reasoning --silent

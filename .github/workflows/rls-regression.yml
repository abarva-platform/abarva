name: RLS regression (L4 SQL tenant isolation)

# Runs the SQL-level RLS regression suite against Azure Postgres.
# Complements .github/workflows/sec-p0-post-deploy.yml: that suite probes the
# HTTP API for cross-tenant leaks; this one probes the database tier directly,
# under the authenticated role with each tenant's JWT claim.
#
# WHY THIS RUNS THROUGH AN ACA JOB RATHER THAN CONNECTING DIRECTLY
#
# Direct runner-to-database access is not a valid proof path for the private
# Azure Postgres network. This suite submits the same read-only probe through
# the private operator job used by db-migration-lab.yml's preflight: same
# deployed image, same database secret reference, same network path.
#
# READ-ONLY. The SQL only creates TEMP tables and runs SELECTs. Safe against a
# live database. This lane must never acquire the ability to write.
#
# Requires tests/security/rls-regression.sql to be present in the runtime image
# (see Dockerfile). The runner reads it at execution time; without it the check
# cannot run, and that is reported as NOT CHECKED rather than as a pass.

on:
  pull_request:
    paths:
      - ".github/workflows/rls-regression.yml"
      - "scripts/security/classify-rls-regression.mjs"
      - "scripts/security/classify-rls-regression.test.mjs"
      - "scripts/run-rls-regression.ts"
      - "tests/security/rls-regression.sql"
  merge_group:
  workflow_dispatch:
    inputs:
      environment:
        description: "Database to probe"
        required: true
        default: "control"
        type: choice
        options:
          - control
          - context
  schedule:
    # 03:30 UTC nightly — staggered 30 min after sec-p0-post-deploy so the two
    # layers do not share a green/red window in the alert path.
    - cron: "30 3 * * *"

permissions:
  contents: read
  id-token: write

env:
  CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME || 'ca-abarva-web-lab-eastus' }}
  RESOURCE_GROUP: ${{ vars.AZURE_WEB_RESOURCE_GROUP || 'rg-abarva-controlplane-lab-eastus' }}
  AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_LAB_CLIENT_ID }}
  AZURE_DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_LAB_TENANT_ID }}
  AZURE_DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_LAB_SUBSCRIPTION_ID || '701a8554-a166-46e9-bf13-743bc50e3b20' }}

jobs:
  rls-regression:
    name: RLS regression (L4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job submits a job to the private operator Container App and reads a
    # live database. The `pull_request` trigger above exists for the classifier
    # contract only, so this half must never run from a pull request: a review
    # of the control must not reach the subject it decides about.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The operator job exposes exactly one database secret today:
      # azure-postgres-control-database-url. There is no context-database secret
      # on the job, so the context target cannot be probed. Say that plainly and
      # stop, rather than silently probing control and labelling it context.
      - name: Resolve target and secret reference
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.environment || 'control' }}"
          case "$target" in
            control)
              echo "label=azure/abarva_control" >> "$GITHUB_OUTPUT"
              echo "secret_ref=azure-postgres-control-database-url" >> "$GITHUB_OUTPUT"
              ;;
            context)
              {
                echo "## Result — NOT CHECKED"
                echo ""
                echo "No context-database secret is configured on the operator job,"
                echo "so the context database cannot be probed. Tenant-isolation"
                echo "state for that database is **unknown**, not clean."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::NOT CHECKED · no context-database secret on the operator job"
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Azure OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${AZURE_DEPLOY_CLIENT_ID}" ]]; then missing+=("AZURE_CLIENT_ID or AZURE_LAB_CLIENT_ID"); fi
          if [[ -z "${AZURE_DEPLOY_TENANT_ID}" ]]; then missing+=("AZURE_TENANT_ID or AZURE_LAB_TENANT_ID"); fi
          if [[ -z "${AZURE_DEPLOY_SUBSCRIPTION_ID}" ]]; then missing+=("AZURE_SUBSCRIPTION_ID or AZURE_LAB_SUBSCRIPTION_ID"); fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Azure configuration:\n' >&2
            printf -- '- %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Prepare audit artifacts directory
        run: mkdir -p audit-artifacts/rls-regression

      - name: Resolve currently-deployed image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          app_json="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output json)"
          echo "$app_json" > audit-artifacts/rls-regression/containerapp.json
          template_image="$(echo "$app_json" | jq -r '.properties.template.containers[0].image // empty')"
          if [[ -z "$template_image" || "$template_image" != *"@sha256:"* ]]; then
            echo "Could not resolve a digest-pinned template image from the live container app." >&2
            exit 1
          fi
          echo "image=$template_image" >> "$GITHUB_OUTPUT"
          echo "$template_image" > audit-artifacts/rls-regression/image.txt

      - name: Run RLS regression through the private operator job
        id: run
        shell: bash
        run: |
          set +e
          npm run --silent ops:aca-job -- \
            --image "${{ steps.image.outputs.image }}" \
            --script test:rls-regression \
            --container db-migrate \
            --secret-env DATABASE_URL=${{ steps.target.outputs.secret_ref }} \
            --out-dir audit-artifacts/rls-regression/run \
            > audit-artifacts/rls-regression/run.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat audit-artifacts/rls-regression/run.log

      # THREE OUTCOMES, KEPT APART — and decided by a control that runs, not
      # by a grep ladder in this file (item C-627).
      #
      #   GREEN       → every tenant × table probe passed AND the operator job
      #                 succeeded. The one verdict that may not be inferred.
      #   LEAK        → the suite ran and found rows belonging to another
      #                 tenant. Outranks every other marker.
      #   NOT CHECKED → the run established nothing about isolation. Exits
      #                 non-zero, including when an input was unreadable.
      #
      # Classification reads the suite's own markers from the job log, because
      # the job submitter reports any non-zero container exit as "Failed" and
      # cannot tell a leak from a connection error. It also reads the
      # submitter's exit code, because the converse holds too: the submitter
      # fails on its own post-run work independently of the container, so a
      # green marker beside a failed job is not a pass. The behavioural suite
      # for all of this is the `classifier-contract` job below.
      - name: Classify result
        shell: bash
        run: |
          node scripts/security/classify-rls-regression.mjs \
            --logs audit-artifacts/rls-regression/run/04-logs.txt \
            --rc "${{ steps.run.outputs.rc }}" \
            --label "${{ steps.target.outputs.label }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-regression-${{ github.run_id }}
          path: audit-artifacts/rls-regression
          if-no-files-found: warn
          retention-days: 30

  # The classifier's behavioural contract. Runs on every pull request that
  # touches the control or its subject, and needs no Azure, no database and no
  # secret -- so the gate that decides a tenant-isolation verdict is now a gate
  # that can fail in review, which the inline version never was.
  classifier-contract:
    name: RLS result classifier contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the RLS result classifier contract
        run: npm run test:rls-classifier

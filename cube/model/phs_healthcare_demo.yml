cubes:
  - name: phs_vendor_portfolio
    sql_table: foundation_v2_phs_cube_canary.phs_vendor_portfolio_v1
    public: true
    joins:
      - name: phs_contract_families
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {phs_contract_families.tenant_key} AND {CUBE.vendor_id} = {phs_contract_families.vendor_id}"
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: projection_row_id
        sql: projection_row_id
        type: string
        primary_key: true
      - name: vendor_id
        sql: vendor_id
        type: string
      - name: legal_name
        sql: legal_name
        type: string
      - name: supplier_category
        sql: supplier_category
        type: string
      - name: risk_tier
        sql: risk_tier
        type: string
      - name: status
        sql: status
        type: string
    measures:
      - name: count
        type: count
        drill_members: [supplier_category, risk_tier, legal_name, vendor_id]
      - name: contract_family_count
        sql: contract_family_count
        type: sum
        drill_members: [supplier_category, risk_tier, legal_name, vendor_id]
      - name: supported_service_count
        sql: supported_service_count
        type: sum
        drill_members: [supplier_category, risk_tier, legal_name, vendor_id]
      - name: invoice_line_count
        sql: invoice_line_count
        type: sum
        drill_members: [supplier_category, risk_tier, legal_name, vendor_id]
      - name: invoice_line_amount
        sql: invoice_line_amount
        type: sum
        format: currency
        drill_members: [supplier_category, risk_tier, legal_name, vendor_id]
    hierarchies:
      - name: phs_vendor_360
        title: PHS Vendor 360
        levels: [supplier_category, risk_tier, legal_name, vendor_id]

  - name: phs_contract_families
    sql_table: foundation_v2_phs_cube_canary.phs_contract_family_v1
    public: true
    joins:
      - name: phs_vendor_portfolio
        relationship: many_to_one
        sql: "{CUBE.tenant_key} = {phs_vendor_portfolio.tenant_key} AND {CUBE.vendor_id} = {phs_vendor_portfolio.vendor_id}"
      - name: phs_contract_scope
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {phs_contract_scope.tenant_key} AND {CUBE.contract_family_id} = {phs_contract_scope.contract_family_id}"
      - name: phs_spend_invoice_history
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {phs_spend_invoice_history.tenant_key} AND {CUBE.contract_family_id} = {phs_spend_invoice_history.contract_family_id}"
      - name: phs_sla_itsm_performance
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {phs_sla_itsm_performance.tenant_key} AND {CUBE.contract_family_id} = {phs_sla_itsm_performance.contract_id}"
      - name: phs_service_credits
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {phs_service_credits.tenant_key} AND {CUBE.contract_family_id} = {phs_service_credits.contract_id}"
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: projection_row_id
        sql: projection_row_id
        type: string
        primary_key: true
      - name: contract_family_id
        sql: contract_family_id
        type: string
      - name: contract_name
        sql: contract_name
        type: string
      - name: vendor_id
        sql: vendor_id
        type: string
      - name: evidence_tier
        sql: evidence_tier
        type: string
      - name: renewal_window
        sql: renewal_window
        type: string
    measures:
      - name: count
        type: count
        drill_members:
          [renewal_window, evidence_tier, contract_name, contract_family_id]
      - name: total_contract_value
        sql: synthetic_midpoint_total_contract_value
        type: sum
        format: currency
        drill_members:
          [renewal_window, evidence_tier, contract_name, contract_family_id]
      - name: amendment_count
        sql: amendment_count
        type: sum
        drill_members:
          [renewal_window, evidence_tier, contract_name, contract_family_id]
      - name: sla_term_count
        sql: sla_term_count
        type: sum
        drill_members:
          [renewal_window, evidence_tier, contract_name, contract_family_id]
    hierarchies:
      - name: phs_contract_family
        title: PHS Contract Family
        levels:
          [renewal_window, evidence_tier, contract_name, contract_family_id]


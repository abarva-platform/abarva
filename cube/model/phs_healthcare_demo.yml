      - name: service_ref
        sql: service_ref
        type: string
      - name: claim_state
        sql: claim_state
        type: string
    measures:
      - name: count
        type: count
        drill_members:
          [claim_state, contract_id, service_ref, service_credit_id]
      - name: eligible_amount
        sql: eligible_amount
        type: sum
        format: currency
        drill_members:
          [claim_state, contract_id, service_ref, service_credit_id]
      - name: claimed_amount
        sql: claimed_amount
        type: sum
        format: currency
        drill_members:
          [claim_state, contract_id, service_ref, service_credit_id]
      - name: unclaimed_amount
        sql: "coalesce(eligible_amount, 0) - coalesce(claimed_amount, 0)"
        type: sum
        format: currency
        drill_members:
          [claim_state, contract_id, service_ref, service_credit_id]
    hierarchies:

cubes:
  - name: source_v4_vendors
    sql_table: consumption_v4_canary.sourcing_vendor_v1
    public: true
    joins:
      - name: source_v4_contracts
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {source_v4_contracts.tenant_key} AND {CUBE.vendor_id} = {source_v4_contracts.vendor_id}"
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: vendor_id
        sql: vendor_id
        type: string
        primary_key: true
      - name: legal_name
        sql: legal_name
        type: string
      - name: supplier_category
        sql: supplier_category
        type: string
      - name: strategic_status
        sql: strategic_status
        type: string
      - name: risk_tier
        sql: risk_tier
        type: string
      - name: relationship_owner_role
        sql: relationship_owner_role
        type: string
      - name: quality_state
        sql: quality_state
        type: string
    measures:
      - name: count
        type: count
        drill_members:
          - supplier_category
          - strategic_status
          - risk_tier
          - legal_name
          - vendor_id
      - name: annual_value
        sql: annual_value
        type: sum
        format: currency
        drill_members:
          - supplier_category
          - strategic_status
          - risk_tier
          - legal_name
          - vendor_id
      - name: contract_count
        sql: contract_count
        type: sum
        drill_members:
          - supplier_category
          - strategic_status
          - risk_tier
          - legal_name
          - vendor_id
    hierarchies:
      - name: v4_vendor_portfolio
        title: V4 Vendor Portfolio
        levels:
          - supplier_category
          - strategic_status
          - risk_tier
          - legal_name

  - name: source_v4_contracts
    sql_table: consumption_v4_canary.sourcing_contract_v1
    public: true
    joins:
      - name: source_v4_vendors
        relationship: many_to_one
        sql: "{CUBE.tenant_key} = {source_v4_vendors.tenant_key} AND {CUBE.vendor_id} = {source_v4_vendors.vendor_id}"
      - name: source_v4_contract_scope
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {source_v4_contract_scope.tenant_key} AND {CUBE.contract_id} = {source_v4_contract_scope.contract_id}"
      - name: source_v4_spend_monthly
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {source_v4_spend_monthly.tenant_key} AND {CUBE.contract_id} = {source_v4_spend_monthly.contract_id}"
      - name: source_v4_performance
        relationship: one_to_many
        sql: "{CUBE.tenant_key} = {source_v4_performance.tenant_key} AND {CUBE.contract_id} = {source_v4_performance.contract_id}"
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: contract_id
        sql: contract_id
        type: string
        primary_key: true
      - name: vendor_id
        sql: vendor_id
        type: string
      - name: vendor_name
        sql: vendor_name
        type: string
      - name: agreement_type
        sql: agreement_type
        type: string
      - name: renewal_type
        sql: renewal_type
        type: string
      - name: auto_renew
        sql: auto_renew
        type: boolean
      - name: quality_state
        sql: quality_state
        type: string
      - name: effective_date
        sql: effective_date
        type: time
      - name: expiration_date
        sql: expiration_date
        type: time
      - name: notice_deadline
        sql: notice_deadline
        type: time
    measures:
      - name: count
        type: count
        drill_members:
          - agreement_type
          - renewal_type
          - vendor_name
          - contract_id
          - expiration_date
      - name: annual_value
        sql: annual_value
        type: sum
        format: currency
        drill_members:
          - agreement_type
          - renewal_type
          - vendor_name
          - contract_id
          - expiration_date
      - name: total_committed_value
        sql: total_committed_value
        type: sum
        format: currency
        drill_members:
          - agreement_type
          - renewal_type
          - vendor_name
          - contract_id
          - expiration_date
      - name: auto_renew_count
        sql: "CASE WHEN auto_renew THEN 1 ELSE 0 END"
        type: sum
        drill_members:
          - renewal_type
          - auto_renew
          - vendor_name
          - contract_id
          - notice_deadline
      - name: notice_90_day_count
        sql: "CASE WHEN notice_deadline <= DATE '2027-09-28' THEN 1 ELSE 0 END"
        type: sum
        drill_members:
          - renewal_type
          - auto_renew
          - vendor_name
          - contract_id
          - notice_deadline
    hierarchies:
      - name: v4_contract_portfolio
        title: V4 Contract Portfolio
        levels:
          - agreement_type
          - renewal_type
          - vendor_name
          - contract_id
      - name: v4_renewal_calendar
        title: V4 Renewal Calendar
        levels:
          - renewal_type
          - auto_renew
          - expiration_date
          - notice_deadline

  - name: source_v4_contract_scope
    sql_table: consumption_v4_canary.sourcing_contract_scope_v1
    public: true
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: contract_scope_id
        sql: contract_scope_id
        type: string
        primary_key: true
      - name: contract_id
        sql: contract_id
        type: string
      - name: scope_type
        sql: scope_type
        type: string
      - name: scope_name
        sql: scope_name
        type: string
      - name: criticality
        sql: criticality
        type: string
      - name: relationship_method
        sql: relationship_method
        type: string
      - name: quality_state
        sql: quality_state
        type: string
    measures:
      - name: count
        type: count
        drill_members:
          - scope_type
          - criticality
          - relationship_method
          - scope_name
          - contract_id
      - name: explicit_scope_count
        sql: "CASE WHEN relationship_method = 'explicit_contract_scope' THEN 1 ELSE 0 END"
        type: sum
        drill_members:
          - scope_type
          - criticality
          - relationship_method
          - scope_name
          - contract_id
      - name: inferred_scope_count
        sql: "CASE WHEN relationship_method <> 'explicit_contract_scope' THEN 1 ELSE 0 END"
        type: sum
        drill_members:
          - scope_type
          - criticality
          - relationship_method
          - scope_name
          - contract_id
      - name: average_relationship_confidence
        sql: relationship_confidence
        type: avg
        drill_members:
          - scope_type
          - criticality
          - relationship_method
          - scope_name
          - contract_id
    hierarchies:
      - name: v4_scope_confidence
        title: V4 Scope Confidence
        levels:
          - scope_type
          - criticality
          - relationship_method
          - scope_name

  - name: source_v4_spend_monthly
    sql_table: consumption_v4_canary.sourcing_spend_monthly_v1
    public: true
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: spend_monthly_id
        sql: "tenant_key || ':' || contract_id || ':' || month::text || ':' || cost_center || ':' || matching_state"
        type: string
        primary_key: true
      - name: contract_id
        sql: contract_id
        type: string
      - name: vendor_id
        sql: vendor_id
        type: string
      - name: business_unit
        sql: business_unit
        type: string
      - name: cost_center
        sql: cost_center
        type: string
      - name: matching_state
        sql: matching_state
        type: string
      - name: month
        sql: month
        type: time
    measures:
      - name: count
        type: count
        drill_members:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month
      - name: invoice_lines
        sql: invoice_lines
        type: sum
        drill_members:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month
      - name: actual_spend
        sql: actual_spend
        type: sum
        format: currency
        drill_members:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month
      - name: committed_amount
        sql: committed_amount
        type: sum
        format: currency
        drill_members:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month
      - name: off_contract_spend
        sql: "CASE WHEN matching_state = 'off_contract' THEN actual_spend ELSE 0 END"
        type: sum
        format: currency
        drill_members:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month
    hierarchies:
      - name: v4_spend_consumption
        title: V4 Spend Consumption
        levels:
          - business_unit
          - cost_center
          - matching_state
          - contract_id
          - month

  - name: source_v4_performance
    sql_table: consumption_v4_canary.sourcing_performance_v1
    public: true
    dimensions:
      - name: tenant_key
        sql: tenant_key
        type: string
        public: false
      - name: performance_id
        sql: "tenant_key || ':' || contract_id || ':' || service_id || ':' || metric_name || ':' || period_start::text"
        type: string
        primary_key: true
      - name: contract_id
        sql: contract_id
        type: string
      - name: service_id
        sql: service_id
        type: string
      - name: metric_name
        sql: metric_name
        type: string
      - name: claim_state
        sql: claim_state
        type: string
      - name: dispute_status
        sql: dispute_status
        type: string
      - name: quality_state
        sql: quality_state
        type: string
      - name: period_start
        sql: period_start
        type: time
    measures:
      - name: count
        type: count
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
      - name: breach_count
        sql: breach_count
        type: sum
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
      - name: credit_calculated
        sql: credit_calculated
        type: sum
        format: currency
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
      - name: credit_claimed
        sql: credit_claimed
        type: sum
        format: currency
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
      - name: credit_recovered
        sql: credit_recovered
        type: sum
        format: currency
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
      - name: unclaimed_credit
        sql: "COALESCE(credit_calculated, 0) - COALESCE(credit_claimed, 0)"
        type: sum
        format: currency
        drill_members:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start
    hierarchies:
      - name: v4_service_credit_path
        title: V4 Service Credit Path
        levels:
          - metric_name
          - claim_state
          - dispute_status
          - contract_id
          - period_start


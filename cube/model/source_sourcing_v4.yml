views:
  - name: source_v4_executive_portfolio
    cubes:
      - join_path: source_v4_contracts
        includes:
          - count
          - annual_value
          - total_committed_value
          - auto_renew_count
          - notice_90_day_count
          - v4_contract_portfolio
          - v4_renewal_calendar
      - join_path: source_v4_context_coverage
        prefix: true
        includes:
          - vendors
          - contracts
          - annual_value
          - scope_rows
          - invoice_lines

  - name: source_v4_vendor_concentration
    cubes:
      - join_path: source_v4_vendors
        includes:
          - legal_name
          - supplier_category
          - strategic_status
          - risk_tier
          - annual_value
          - contract_count
          - v4_vendor_portfolio

  - name: source_v4_renewal_exposure
    cubes:
      - join_path: source_v4_contracts
        includes:
          - contract_id
          - vendor_name
          - renewal_type
          - expiration_date
          - notice_deadline
          - auto_renew
          - annual_value
          - notice_90_day_count
          - v4_renewal_calendar

  - name: source_v4_scope_confidence
    cubes:
      - join_path: source_v4_contract_scope
        includes:
          - contract_id
          - scope_type
          - scope_name
          - criticality
          - relationship_method
          - count
          - explicit_scope_count
          - inferred_scope_count
          - average_relationship_confidence
          - v4_scope_confidence

  - name: source_v4_spend_consumption
    cubes:
      - join_path: source_v4_spend_monthly
        includes:
          - contract_id
          - vendor_id
          - business_unit
          - cost_center
          - matching_state
          - month
          - invoice_lines
          - actual_spend
          - committed_amount
          - off_contract_spend
          - v4_spend_consumption

  - name: source_v4_performance_credits
    cubes:
      - join_path: source_v4_performance
        includes:
          - contract_id
          - metric_name
          - period_start
          - breach_count
          - credit_calculated
          - credit_claimed
          - credit_recovered
          - unclaimed_credit
          - v4_service_credit_path

  - name: source_v4_ai_usage_value_proof
    cubes:
      - join_path: source_v4_saas_usage
        includes:
          - product_name
          - function_ref
          - finance_validation_state
          - claimable_value_state
          - baseline_metric_state
          - period_start
          - assigned_seats
          - active_users
          - actual_cost
          - claimable_rows
          - v4_ai_usage_value_proof

  - name: source_v4_cloud_optimization
    cubes:
      - join_path: source_v4_cloud_cost
        includes:
          - service_name
          - region
          - commitment_type
          - optimization_recommendation_state
          - period_start
          - actual_cost
          - amortized_cost
          - overage_amount
          - v4_cloud_optimization

  - name: source_v4_workforce_rate_card
    cubes:
      - join_path: source_v4_workforce_rate_cards
        includes:
          - contract_id
          - role_title
          - level
          - location
          - approval_state
          - rate_card_amendment_exists
          - hours
          - bill_rate
          - unapproved_variance_count
          - v4_rate_card_path

  - name: source_v4_sourcing_event_bafo
    cubes:
      - join_path: source_v4_sourcing_events
        includes:
          - event_id
          - event_type
          - stage
          - round
          - supplier_id

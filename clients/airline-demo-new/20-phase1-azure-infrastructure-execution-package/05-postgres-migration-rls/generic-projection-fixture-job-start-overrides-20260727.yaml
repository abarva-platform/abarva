containers:
  - name: airdn-job
    image: postgres:16-alpine
    command:
      - /bin/sh
    args:
      - -lc
      - |
        set -eu
        wget -qO /tmp/generic_projection_fixture.sql https://raw.githubusercontent.com/abarva-platform/abarva/1ac9e01ba2f868257c9823dcd4ec0048919aed18/clients/airline-demo-new/20-phase1-azure-infrastructure-execution-package/05-postgres-migration-rls/generic-projection-conformance-fixture.sql
        PGPASSWORD=$PGPASSWORD psql -v ON_ERROR_STOP=1 -h $PGHOST -U $PGUSER -d $PGDATABASE -f /tmp/generic_projection_fixture.sql
    env:
      - name: PGHOST
        value: pg-abarva-airdn-lab-eus2-001.postgres.database.azure.com
      - name: PGPORT
        value: "5432"
      - name: PGUSER
        value: airdn_admin
      - name: PGDATABASE
        value: abarva_airline_demo_new_knowledge_lab
      - name: PGPASSWORD
        secretRef: pg-admin-password

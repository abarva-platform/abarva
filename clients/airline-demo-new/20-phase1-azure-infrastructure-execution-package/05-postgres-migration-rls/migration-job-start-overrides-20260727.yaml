containers:
  - name: airdn-job
    image: postgres:16-alpine
    command:
      - /bin/sh
    args:
      - -lc
      - |
        set -eu
        wget -qO /tmp/001_shared.sql https://raw.githubusercontent.com/abarva-platform/abarva/52588aec52e607534e9318361f6220b1a05dd99b/clients/shared/21-phase3c2e-executable-data-layer/sql/001_shared_knowledge_publication_consumption.sql
        PGPASSWORD=$PGPASSWORD psql -v ON_ERROR_STOP=1 -h $PGHOST -U $PGUSER -d $PGDATABASE -f /tmp/001_shared.sql
        PGPASSWORD=$PGPASSWORD psql -v ON_ERROR_STOP=1 -h $PGHOST -U $PGUSER -d $PGDATABASE -Atc "select 'schemas=' || count(*) from information_schema.schemata where schema_name in ('source_registry','evidence','working','knowledge','metrics','governance','publication','consumption','audit','operations');"
    env:
      - name: PGHOST
        value: pg-abarva-airdn-lab-eus2-001.postgres.database.azure.com
      - name: PGPORT
        value: "5432"
      - name: PGUSER
        value: airdn_admin
      - name: PGDATABASE
        value: abarva_airline_demo_new_knowledge_lab
      - name: PGPASSWORD
        secretRef: pg-admin-password

containers:
  - name: airdn-job
    image: postgres:16-alpine
    command:
      - /bin/sh
    args:
      - -lc
      - |
        set -eu
        cat >/tmp/validate-diagnostic.sql <<'SQL'
        \set ON_ERROR_STOP on
        \echo 'diagnostic: parser visible'
        SELECT count(*)::int AS parser_visible
        FROM source_registry.source
        WHERE tenant_key='airline-demo-new'
          AND source_visibility='client_visible'
          AND source_basis <> 'restricted_evaluator'
          AND metadata->>'releaseId' = 'airline-demo-new-source-corpus-v1.0.0';

        \echo 'diagnostic: parsed terminal events'
        SELECT count(*)::int AS parsed
        FROM audit.lineage_event
        WHERE tenant_key='airline-demo-new'
          AND lineage_ref LIKE 'parse:%'
          AND event_payload->>'terminalState' IN ('parsed','parsed_with_warnings','not_applicable');

        \echo 'diagnostic: hidden entity markers'
        SELECT count(*) AS hidden_entity
        FROM working.entity_candidate
        WHERE tenant_key='airline-demo-new'
          AND candidate_payload::text ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)';

        \echo 'diagnostic: hidden fact markers'
        SELECT count(*) AS hidden_fact
        FROM working.fact_candidate
        WHERE tenant_key='airline-demo-new'
          AND fact_value::text ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)';

        \echo 'diagnostic: hidden relationship markers'
        SELECT count(*) AS hidden_relationship
        FROM working.relationship_candidate
        WHERE tenant_key='airline-demo-new'
          AND array_to_string(evidence_refs, ',') ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)';

        \echo 'diagnostic: invalid required ids'
        SELECT (
          SELECT count(*) FROM working.entity_candidate WHERE tenant_key='airline-demo-new' AND (candidate_ref='' OR display_name='')
        ) + (
          SELECT count(*) FROM working.fact_candidate WHERE tenant_key='airline-demo-new' AND candidate_ref=''
        ) + (
          SELECT count(*) FROM working.relationship_candidate WHERE tenant_key='airline-demo-new' AND (candidate_ref='' OR from_candidate_ref='' OR to_candidate_ref='')
        ) AS invalid_ids;

        \echo 'diagnostic: broken relationships'
        SELECT count(*)::int AS broken_relationships
        FROM working.relationship_candidate
        WHERE tenant_key='airline-demo-new'
          AND (from_candidate_ref IS NULL OR to_candidate_ref IS NULL OR from_candidate_ref = to_candidate_ref);

        \echo 'diagnostic: combined validation query'
        WITH parser_visible AS (
          SELECT count(*)::int AS count
          FROM source_registry.source
          WHERE tenant_key='airline-demo-new'
            AND source_visibility='client_visible'
            AND source_basis <> 'restricted_evaluator'
            AND metadata->>'releaseId' = 'airline-demo-new-source-corpus-v1.0.0'
        ),
        parsed AS (
          SELECT count(*)::int AS count
          FROM audit.lineage_event
          WHERE tenant_key='airline-demo-new'
            AND lineage_ref LIKE 'parse:%'
            AND event_payload->>'terminalState' IN ('parsed','parsed_with_warnings','not_applicable')
        ),
        hidden AS (
          SELECT (
            SELECT count(*) FROM working.entity_candidate WHERE tenant_key='airline-demo-new' AND candidate_payload::text ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)'
          ) + (
            SELECT count(*) FROM working.fact_candidate WHERE tenant_key='airline-demo-new' AND fact_value::text ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)'
          ) + (
            SELECT count(*) FROM working.relationship_candidate WHERE tenant_key='airline-demo-new' AND array_to_string(evidence_refs, ',') ~* '(restricted[_ -]?evaluator|evaluator[_ -]?only|hidden[_ -]?truth|hidden[_ -]?canonical|not[_ -]?parser[_ -]?visible)'
          ) AS count
        ),
        invalid_ids AS (
          SELECT (
            SELECT count(*) FROM working.entity_candidate WHERE tenant_key='airline-demo-new' AND (candidate_ref='' OR display_name='')
          ) + (
            SELECT count(*) FROM working.fact_candidate WHERE tenant_key='airline-demo-new' AND candidate_ref=''
          ) + (
            SELECT count(*) FROM working.relationship_candidate WHERE tenant_key='airline-demo-new' AND (candidate_ref='' OR from_candidate_ref='' OR to_candidate_ref='')
          ) AS count
        ),
        broken_rels AS (
          SELECT count(*)::int AS count
          FROM working.relationship_candidate
          WHERE tenant_key='airline-demo-new'
            AND (from_candidate_ref IS NULL OR to_candidate_ref IS NULL OR from_candidate_ref = to_candidate_ref)
        )
        SELECT
          0::int AS "crossTenantRecords",
          (SELECT count FROM broken_rels)::int AS "brokenRequiredRelationshipEndpoints",
          (SELECT count FROM hidden)::int AS "hiddenTruthReferences",
          (SELECT count FROM invalid_ids)::int AS "invalidRequiredIds",
          greatest((SELECT count FROM parser_visible) - (SELECT count FROM parsed), 0)::int AS "silentSourceSkips",
          0::int AS conflicts;
        SQL
        psql -v ON_ERROR_STOP=1 -f /tmp/validate-diagnostic.sql
    env:
      - name: PGHOST
        value: pg-abarva-airdn-lab-eus2-001.postgres.database.azure.com
      - name: PGPORT
        value: "5432"
      - name: PGUSER
        value: airdn_admin
      - name: PGDATABASE
        value: abarva_airline_demo_new_knowledge_lab
      - name: PGSSLMODE
        value: require
      - name: PGPASSWORD
        secretRef: pg-admin-password

containers:
  - name: airdn-job
    image: postgres:16-alpine
    command:
      - /bin/sh
    args:
      - -lc
      - |
        set -eu
        PGPASSWORD=$PGPASSWORD psql -v ON_ERROR_STOP=1 -h $PGHOST -U $PGUSER -d $PGDATABASE -Atc "
          select 'source_count=' || count(*) from source_registry.source where tenant_key='airline-demo-new';
          select 'parser_visible=' || count(*) from source_registry.source where tenant_key='airline-demo-new' and source_visibility='client_visible';
          select 'source_versions=' || count(*) from source_registry.source_version where tenant_key='airline-demo-new';
          select 'working_entity=' || count(*) from working.entity_candidate where tenant_key='airline-demo-new';
          select 'working_fact=' || count(*) from working.fact_candidate where tenant_key='airline-demo-new';
          select 'working_relationship=' || count(*) from working.relationship_candidate where tenant_key='airline-demo-new';
          select 'knowledge_entity=' || count(*) from knowledge.entity where tenant_key='airline-demo-new';
          select 'knowledge_fact=' || count(*) from knowledge.fact_assertion where tenant_key='airline-demo-new';
          select 'knowledge_relationship=' || count(*) from knowledge.relationship_assertion where tenant_key='airline-demo-new';
          select 'domain_publications=' || count(*) from publication.domain_publication where tenant_key='airline-demo-new';
          select 'active_baselines=' || count(*) from publication.knowledge_baseline where tenant_key='airline-demo-new' and is_active=true;
          select 'consumption_edges=' || count(*) from consumption.relationship_edge_v1 where tenant_key='airline-demo-new';
        "
    env:
      - name: PGHOST
        value: pg-abarva-airdn-lab-eus2-001.postgres.database.azure.com
      - name: PGPORT
        value: "5432"
      - name: PGUSER
        value: airdn_admin
      - name: PGDATABASE
        value: abarva_airline_demo_new_knowledge_lab
      - name: PGPASSWORD
        secretRef: pg-admin-password

name: job-skyharbor-load-0528
properties:
  environmentId: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.App/managedEnvironments/cae-abarva-scale-lab-eastus
  configuration:
    triggerType: Manual
    replicaRetryLimit: 0
    replicaTimeout: 3600
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-url
      - name: github-token
      - name: openai-key
  template:
    containers:
      - name: firstcapital-structured-load
        image: node:24-bookworm
        imageType: ContainerImage
        command:
          - /bin/bash
          - -c
        args:
          - |
            set -euo pipefail
            export NEXT_TELEMETRY_DISABLED=1
            mkdir -p /work
            rm -rf /work/abarva
            git --version >/dev/null 2>&1 || (apt-get update && apt-get install -y git ca-certificates)
            git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/abarva-platform/abarva.git /work/abarva
            cd /work/abarva
            npm ci --no-audit --no-fund
            node <<'NODE'
            const { Client } = require('pg');
            const fs = require('node:fs');
            const staleId = 'a75687bf-71b9-4524-ab4e-68ae3f28d200';
            const url = process.env.ABARVA_AZURE_DATABASE_URL || process.env.DATABASE_URL;
            const client = new Client({ connectionString: url, ssl: { rejectUnauthorized: false } });
            (async () => {
              await client.connect();
              const { rows } = await client.query(
                `SELECT id, tenant_key, slug, name
                   FROM clients
                  WHERE tenant_key IN ('first-capital','firstcapital','arcturus')
                     OR slug IN ('first-capital','firstcapital','arcturus')
                  ORDER BY CASE WHEN tenant_key = 'first-capital' THEN 0 ELSE 1 END
                  LIMIT 1`,
              );
              await client.end();
              if (!rows[0]?.id) throw new Error('Could not resolve live First Capital client_id');
              const loaderPath = 'scripts/seed/load-tenant-substrate.ts';
              const next = fs.readFileSync(loaderPath, 'utf8').replaceAll(staleId, rows[0].id);
              fs.writeFileSync(loaderPath, next);
              console.log(`Resolved First Capital live client_id ${rows[0].id} from clients.${rows[0].tenant_key ?? rows[0].slug ?? rows[0].name}`);
            })().catch(async (err) => {
              console.error(err);
              try { await client.end(); } catch {}
              process.exit(1);
            });
            NODE
            TENANT_KEY=firstcapital npx tsx scripts/seed/load-tenant-substrate.ts --only-tables
            node scripts/audit/db-substrate-audit.mjs --tenant=first-capital
        env:
          - name: TENANT_KEY
            value: firstcapital
          - name: ABARVA_AZURE_DATABASE_URL
            secretRef: db-url
          - name: DATABASE_URL
            secretRef: db-url
          - name: GITHUB_TOKEN
            secretRef: github-token
          - name: OPENAI_API_KEY
            secretRef: openai-key
        resources:
          cpu: 1
          memory: 2Gi
    volumes: []
  workloadProfileName: Consumption
resourceGroup: rg-abarva-controlplane-lab-eastus

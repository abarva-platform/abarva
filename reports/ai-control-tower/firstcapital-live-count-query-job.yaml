name: job-abarva-private-operator-eus
properties:
  environmentId: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.App/managedEnvironments/cae-abarva-scale-lab-eastus
  configuration:
    triggerType: Manual
    replicaRetryLimit: 0
    replicaTimeout: 3600
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acrabarvalab001.azurecr.io
        identity: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-abarva-scale-runtime-lab-eastus
    secrets:
      - name: azure-postgres-control-database-url
        keyVaultUrl: https://kv-abarva-lab-001.vault.azure.net/secrets/azure-postgres-control-database-url
        identity: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-abarva-scale-runtime-lab-eastus
  template:
    containers:
      - name: db-migrate
        image: acrabarvalab001.azurecr.io/abarva/web@sha256:eff232244d6a80dac59398182490658fc815d29911608d322d89881bd535f495
        imageType: ContainerImage
        command:
          - node
        args:
          - -e
          - |
            const { Client } = require('pg');
            const clientId = '09d9a267-e89c-4fe1-831f-337a62787ec5';
            const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await client.connect();
              const { rows } = await client.query(`
                SELECT
                  (SELECT count(*)::int FROM applications WHERE client_id = $1) AS applications,
                  (SELECT count(*)::int FROM ai_initiatives WHERE client_id = $1) AS ai_initiatives,
                  (SELECT count(*)::int FROM vendor_contracts WHERE client_id = $1) AS vendor_contracts,
                  (SELECT count(*)::int FROM enterprise_context_chunks WHERE client_id = $1) AS enterprise_context_chunks,
                  (SELECT tenant_key FROM clients WHERE id = $1) AS tenant_key
              `, [clientId]);
              console.log(JSON.stringify({ event: 'firstcapital_live_counts', clientId, ...rows[0] }, null, 2));
              await client.end();
            })().catch(async (err) => {
              console.error(err);
              try { await client.end(); } catch {}
              process.exit(1);
            });
        env:
          - name: DATABASE_URL
            secretRef: azure-postgres-control-database-url
          - name: AZURE_CLIENT_ID
            value: 3b6e0c9d-2265-499f-af46-965e0ad78b95
          - name: NODE_OPTIONS
            value: --conditions=react-server
        resources:
          cpu: 0.5
          memory: 1Gi
    volumes: []
  workloadProfileName: Consumption
resourceGroup: rg-abarva-controlplane-lab-eastus

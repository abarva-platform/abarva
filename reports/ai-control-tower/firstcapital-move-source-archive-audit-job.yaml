name: job-abarva-private-operator-eus
properties:
  environmentId: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.App/managedEnvironments/cae-abarva-scale-lab-eastus
  configuration:
    triggerType: Manual
    replicaRetryLimit: 0
    replicaTimeout: 3600
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acrabarvalab001.azurecr.io
        identity: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-abarva-scale-runtime-lab-eastus
    secrets:
      - name: azure-postgres-control-database-url
        keyVaultUrl: https://kv-abarva-lab-001.vault.azure.net/secrets/azure-postgres-control-database-url
        identity: /subscriptions/701a8554-a166-46e9-bf13-743bc50e3b20/resourceGroups/rg-abarva-controlplane-lab-eastus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-abarva-scale-runtime-lab-eastus
  template:
    containers:
      - name: db-migrate
        image: acrabarvalab001.azurecr.io/abarva/web@sha256:eff232244d6a80dac59398182490658fc815d29911608d322d89881bd535f495
        imageType: ContainerImage
        command:
          - node
        args:
          - -e
          - |
            const { Client } = require('pg');
            const clientId = '09d9a267-e89c-4fe1-831f-337a62787ec5';
            const liveAliases = ['first-capital', 'firstcapital', 'arcturus'];
            const allAliases = [...liveAliases, 'archived:first-capital'];
            const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await client.connect();
              const counts = await client.query(`
                SELECT
                  (SELECT tenant_key FROM clients WHERE id = $1::uuid) AS tenant_key,
                  (SELECT count(*)::int FROM engagements WHERE client_id::text = $1 AND archived_at IS NULL AND deleted_at IS NULL) AS active_moves_live_client,
                  (SELECT count(*)::int FROM engagements WHERE client_id::text = $1 AND archived_at IS NOT NULL AND deleted_at IS NULL) AS archived_moves_live_client,
                  (SELECT count(*)::int FROM source_events WHERE client_key = ANY($2::text[]) AND lifecycle_state <> 'archived') AS active_source_events_live_aliases,
                  (SELECT count(*)::int FROM source_events WHERE client_key = 'archived:first-capital' OR (client_key = ANY($2::text[]) AND lifecycle_state = 'archived')) AS archived_source_events_aliases
              `, [clientId, liveAliases]);
              const moveSample = await client.query(`
                SELECT id::text, name, created_by, status, archived_at::text
                  FROM engagements
                 WHERE client_id::text = $1
                 ORDER BY created_at NULLS LAST, id
                 LIMIT 12
              `, [clientId]);
              const sourceSample = await client.query(`
                SELECT id::text, client_key, event_code, event_name, lifecycle_state, created_by_user_id, created_at::text
                  FROM source_events
                 WHERE client_key = ANY($1::text[])
                 ORDER BY created_at NULLS LAST, id
                 LIMIT 12
              `, [allAliases]);
              console.log(JSON.stringify({
                event: 'firstcapital_move_source_archive_audit',
                clientId,
                ...counts.rows[0],
                move_sample: moveSample.rows,
                source_event_sample: sourceSample.rows
              }, null, 2));
              await client.end();
            })().catch(async (err) => {
              console.error(err);
              try { await client.end(); } catch {}
              process.exit(1);
            });
        env:
          - name: DATABASE_URL
            secretRef: azure-postgres-control-database-url
          - name: AZURE_CLIENT_ID
            value: 3b6e0c9d-2265-499f-af46-965e0ad78b95
          - name: NODE_OPTIONS
            value: --conditions=react-server
        resources:
          cpu: 0.5
          memory: 1Gi
    volumes: []
  workloadProfileName: Consumption
resourceGroup: rg-abarva-controlplane-lab-eastus

<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rollback Proof</title><style>body{margin:0;background:#f7f6f2;color:#171713;font-family:Arial,Helvetica,sans-serif}main{max-width:1080px;margin:0 auto;padding:44px 28px}h1{font-family:Georgia,'Times New Roman',serif;font-size:42px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0f766e;font-weight:700}.lede{font-size:18px;color:#625d54;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}.card{background:#fff;border:1px solid #dedbd2;border-radius:8px;padding:18px}.card b{display:block;font-size:26px}@media(max-width:820px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><main><p class="eyebrow">Rollback proof only</p><h1>Rollback path verified.</h1><p class="lede">The restore target is verified and the active pointer was left unchanged.</p><div class="grid"><div class="card"><b>verified</b><span>restore target</span></div><div class="card"><b>0</b><span>production rollback writes</span></div><div class="card"><b>4</b><span>rollback steps</span></div></div></main></body></html>

# Deliverable generation worker — EVENT-TRIGGERED (KEDA) variant.
#
# Purpose: drain the `deliverable_runs` queue within ~10-30s of a run being
# enqueued (status='queued'), instead of waiting up to 20 minutes for the cron
# worker. KEDA's PostgreSQL scaler polls the control DB every 30s and scales the
# job 0->1 when there is at least one queued run; the worker claims a bounded
# batch (FOR UPDATE SKIP LOCKED — safe to run concurrently with the cron job),
# then exits 0 and KEDA scales back to 0.
#
# This is the EVENT primary. The Schedule job `job-abarva-deliv-worker`
# (*/20 * * * *) is intentionally KEPT as a fallback safety net so the queue
# still drains if KEDA can't reach the DB or a scale event is missed.
#
# Apply / re-apply (control-plane lab):
#   az containerapp job create -n job-abarva-deliv-worker-event \
#     -g rg-abarva-controlplane-lab-eastus --yaml infra/azure/deliverable-worker-event-job.yaml
#
# IMPORTANT — image lifecycle: aca-main-deploy.yml only updates the WEB app
# image; the worker jobs (cron AND this event job) are updated out-of-band. When
# the worker image changes, update BOTH jobs:
#   az containerapp job update -n job-abarva-deliv-worker        -g <rg> --image <img>
#   az containerapp job update -n job-abarva-deliv-worker-event  -g <rg> --image <img>
# The `image:` below is digest-pinned for runtime-invariant safety.
#

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">SkyHarbor economics and value-control architecture</title>
  <desc id="desc">Executive economics diagram separating governed budget, committed contracts, AI use cost, and finance-recognized value proof.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#246fc8"/><stop offset="1" stop-color="#198f82"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#8ba0bd"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.m{font-size:13px;font-weight:820;fill:#246fc8}.h{font-size:24px;font-weight:820}.s{font-size:14px;fill:#53627b}.k{font-size:15px;font-weight:820}.v{font-size:30px;font-weight:840}.small{font-size:12px;fill:#657087}.white{fill:#fff}.whiteSub{fill:#d9e6ff}.box{fill:#fff;stroke:#d9e0ea;stroke-width:1.5}.line{fill:none;stroke:#9fb0c8;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#b97824;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}.guard{fill:#fff7e8;stroke:#b97824}.gap{fill:#fff5f4;stroke:#b63b35}.ok{fill:#eef8f6;stroke:#198f82}
    </style>
  </defs>
  <rect width="1280" height="460" rx="18" fill="#f8fbff"/>
  <text x="34" y="46" class="m">Economics tab / value proof boundary</text>
  <text x="34" y="82" class="h">Show economics as a control path, not a savings claim</text>
  <text x="34" y="110" class="s">Home can show budget scale and committed economics; Tower/Finance must validate baselines and recognized outcomes.</text>
  <rect x="50" y="152" width="210" height="160" rx="12" class="box"/>
  <text x="75" y="188" class="k">FY2027 technology budget</text><text x="75" y="235" class="v">$2.35B</text><text x="75" y="264" class="s">Governed planning scope</text>
  <rect x="330" y="152" width="210" height="160" rx="12" class="guard"/>
  <text x="355" y="188" class="k">Annual committed base</text><text x="355" y="235" class="v">$1.48B</text><text x="355" y="264" class="s">63% of FY2027 budget</text>
  <rect x="610" y="152" width="210" height="160" rx="12" class="ok"/>
  <text x="635" y="188" class="k">Visible AI use cost</text><text x="635" y="235" class="v">$170.2M</text><text x="635" y="264" class="s">Cost lane, not benefit proof</text>
  <rect x="890" y="152" width="250" height="160" rx="12" class="gap"/>
  <text x="915" y="188" class="k">Finance-recognized value</text><text x="915" y="235" class="v">Unknown</text><text x="915" y="264" class="s">No zero-dollar fabrication</text>
  <path class="line" d="M262 232 H320"/><path class="dash" d="M542 232 H600"/><path class="dash" d="M822 232 H880"/>
  <rect x="64" y="352" width="250" height="58" rx="9" fill="#fff" stroke="#d9e0ea"/><text x="84" y="376" class="k">Budget authority</text><text x="84" y="398" class="small">Source files, period, owner, scope</text>
  <rect x="374" y="352" width="250" height="58" rx="9" fill="#fff" stroke="#d9e0ea"/><text x="394" y="376" class="k">Contract flexibility</text><text x="394" y="398" class="small">Renewal windows, rights, lock-in</text>
  <rect x="684" y="352" width="250" height="58" rx="9" fill="#fff" stroke="#d9e0ea"/><text x="704" y="376" class="k">Adoption evidence</text><text x="704" y="398" class="small">Usage, active users, use cases</text>
  <rect x="994" y="352" width="220" height="58" rx="9" fill="#142346"/><text x="1014" y="376" class="k white">Tower gate</text><text x="1014" y="398" class="small whiteSub">Baseline, outcome, attestation</text>
  <rect x="50" y="128" width="1090" height="10" rx="5" fill="#e8eef7"/><rect x="50" y="128" width="686" height="10" rx="5" fill="url(#blue)"/><rect x="50" y="128" width="431" height="10" rx="5" fill="#b97824"/>
</svg>

  <title id="title">AbarVa four-layer intelligence architecture</title>
  <desc id="desc">Four horizontal context layers feed graph, vector, and structured retrieval in parallel before composing a Nexus system prompt.</desc>
  <rect width="960" height="540" rx="28" fill="#F8F7F4"/>
  <text x="56" y="54" fill="#0C0C0C" font-family="Georgia, serif" font-size="30" font-weight="700">Four-layer intelligence architecture</text>
  <text x="56" y="82" fill="#4B5563" font-family="DM Sans, sans-serif" font-size="14">Every Nexus response composes four layers of context, then queries graph, vector, and structured systems in parallel.</text>


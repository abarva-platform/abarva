<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">AbarVa logo lockup revised</title>
  <desc id="desc">AbarVa wordmark with refined intelligence-inspired orbital symbol, smaller mark, tighter Va spacing, Abar in black and Va in dark sky blue.</desc>
  <defs>

    <path d="M52 121 C50 68 91 33 144 42" class="stroke-ink" stroke-width="8"/>
    <path d="M174 74 C202 124 169 181 112 190" class="stroke-ink" stroke-width="8"/>
    <path d="M63 173 C37 133 48 82 88 58" class="stroke-ink" stroke-width="5" opacity="0.95"/>
    <path d="M156 51 C195 75 211 125 188 166" class="stroke-ink" stroke-width="5" opacity="0.95"/>

      .word { font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif; }
      .strong { font-weight: 700; }
      .regular { font-weight: 400; }
    </style>
  </defs>
  <rect width="1600" height="520" fill="transparent"/>
  <g id="abarva-symbol" transform="translate(152 158) scale(0.658)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 1 L111 18 L128 25 L111 32 L104 49 L97 32 L80 25 L97 18 Z" fill="#0b4a91" stroke="none"/>
    <path d="M12 118 H50" class="stroke-ink" stroke-width="6"/>

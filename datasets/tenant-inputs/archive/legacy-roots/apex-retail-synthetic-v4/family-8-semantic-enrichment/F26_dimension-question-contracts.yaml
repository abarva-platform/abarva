-
  tenant_key: apex-retail
  dimension_family: organization_leadership
  supported_questions:
    - How is IT organized?
    - Who owns this capability?
    - Which leadership roles are accountable?
  unsupported_questions:
    - Final HR reporting hierarchy without client-approved HR data
    - Named leaders where no F18 or adjacent leadership evidence exists
  required_sources:
    - F01
    - F02
    - F03
    - D19
    - F18
    - F19
    - F12
  deterministic_artifacts:
    - leadership table
    - team-to-domain chart
    - ownership graph
  citation_rule: Cite role/team ownership and named leadership separately.
  gap_rule: Lead with loaded operating-model synthesis, then state exact missing people-org evidence.
